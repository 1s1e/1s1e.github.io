<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

/* ---------------- NOAA solar position ---------------- */
var LAT = 28.1773, LON = -82.2341;

function dayOfYear(y, m, d) {
  var start = Date.UTC(y, 0, 1);
  return Math.round((Date.UTC(y, m - 1, d) - start) / 86400000) + 1;
}
function isLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }

/* UTC offset (hours) for America/New_York on a local date:
   EDT (UTC-4) from the second Sunday of March to the first Sunday of November, else EST (UTC-5). */
function nthSunday(y, month, n) {
  var first = new Date(Date.UTC(y, month, 1));
  var dow = first.getUTCDay();
  return 1 + ((7 - dow) % 7) + (n - 1) * 7;
}
function tzOffsetHours(y, m, d) {
  var startDay = nthSunday(y, 2, 2);   // second Sunday of March
  var endDay = nthSunday(y, 10, 1);    // first Sunday of November
  if (m < 3 || m > 11) return -5;
  if (m > 3 && m < 11) return -4;
  if (m === 3) return d >= startDay ? -4 : -5;
  return d < endDay ? -4 : -5;         // November
}

/* NOAA algorithm: returns {alt, az} in degrees. az measured clockwise from north.
   date/time are local clock values in America/New_York. */
function sunPosition(y, mo, d, hourLocal) {
  var doy = dayOfYear(y, mo, d);
  var daysInYear = isLeap(y) ? 366 : 365;
  var gamma = 2 * Math.PI / daysInYear * (doy - 1 + (hourLocal - 12) / 24);
  var eqtime = 229.18 * (0.000075 + 0.001868 * Math.cos(gamma) - 0.032077 * Math.sin(gamma)
    - 0.014615 * Math.cos(2 * gamma) - 0.040849 * Math.sin(2 * gamma));
  var decl = 0.006918 - 0.399912 * Math.cos(gamma) + 0.070257 * Math.sin(gamma)
    - 0.006758 * Math.cos(2 * gamma) + 0.000907 * Math.sin(2 * gamma)
    - 0.002697 * Math.cos(3 * gamma) + 0.00148 * Math.sin(3 * gamma);
  var tz = tzOffsetHours(y, mo, d);
  var timeOffset = eqtime + 4 * LON - 60 * tz;      // minutes
  var tst = hourLocal * 60 + timeOffset;            // true solar time, minutes
  var haDeg = tst / 4 - 180;
  if (haDeg < -180) haDeg += 360;
  if (haDeg > 180) haDeg -= 360;
  var ha = haDeg * Math.PI / 180;
  var lat = LAT * Math.PI / 180;
  var cosZen = Math.sin(lat) * Math.sin(decl) + Math.cos(lat) * Math.cos(decl) * Math.cos(ha);
  cosZen = Math.max(-1, Math.min(1, cosZen));
  var alt = 90 - Math.acos(cosZen) * 180 / Math.PI;
  var az = Math.atan2(Math.sin(ha),
    Math.cos(ha) * Math.sin(lat) - Math.tan(decl) * Math.cos(lat)) * 180 / Math.PI + 180;
  return { alt: alt, az: (az + 360) % 360 };
}

/* ---------------- Scene ---------------- */
var FT = 0.3048;
var container = document.getElementById('scene');
var renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
container.appendChild(renderer.domElement);

var scene = new THREE.Scene();
function applySceneTheme() { var t = document.documentElement.dataset.theme; scene.background = new THREE.Color(t === 'light' ? 0xf3eee0 : 0x152130); }
applySceneTheme();
new MutationObserver(applySceneTheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 2000);
camera.position.set(-38, 52, 62);

var controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(-2.5, 0, -9.7);
controls.maxPolarAngle = Math.PI * 0.495;
controls.minDistance = 8;
controls.maxDistance = 400;
controls.update();

var ambient = new THREE.AmbientLight(0xbfd0e0, 0.55);
scene.add(ambient);
var sun = new THREE.DirectionalLight(0xfff2dd, 2.6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -95; sun.shadow.camera.right = 95;
sun.shadow.camera.top = 95; sun.shadow.camera.bottom = -95;
sun.shadow.camera.near = 10; sun.shadow.camera.far = 420;
sun.shadow.bias = -0.0006;
sun.shadow.radius = 3;
scene.add(sun);
scene.add(sun.target);

/* Ground: satellite crop, 1900 px by 1800 px at 0.0658 m per px.
   World axes: +X east, +Z south, so north is -Z and the texture top (north) sits at -Z. */
var GROUND_W = 1900 * 0.0658, GROUND_D = 1800 * 0.0658;
var groundTex = new THREE.TextureLoader().load('ground.jpg');
groundTex.colorSpace = THREE.SRGBColorSpace;
groundTex.anisotropy = 8;
var ground = new THREE.Mesh(
  new THREE.PlaneGeometry(GROUND_W, GROUND_D),
  new THREE.MeshStandardMaterial({ map: groundTex, roughness: 1, metalness: 0 })
);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

/* Exact home footprint: the 15 vertex house shell is copied unchanged
   from the accepted v5 floor plan registration
   (work/shadow_exact_spec.json). The enclosure rectangle is registered
   from the dimensioned pool diagram (work/pool_screen_spec.json): its
   south edge lies on the rear wall outer face (plan y=1100) and its
   lateral position is anchored by the spa basin's west edge on the
   lanai opening's west face (plan x=857), converted through the same
   v5 chain. Local frame: x is metres east,
   z is metres south, origin at the ground texture top left corner. The
   ground plane is centred on the world origin, so a local point maps to
   world (x - GROUND_W / 2, z - GROUND_D / 2), with texture north at -Z. */
var SHELL_LOCAL = [
  [54.151, 37.947],
  [52.259, 38.996],
  [45.754, 61.964],
  [51.249, 63.521],
  [51.469, 62.949],
  [54.359, 63.768],
  [55.661, 59.372],
  [58.913, 60.303],
  [58.324, 62.451],
  [59.101, 63.843],
  [61.067, 64.4],
  [62.459, 63.622],
  [68.158, 43.5],
  [57.585, 40.505],
  [56.507, 38.615]
];
var ENC_LOCAL = [
  [54.70, 30.18],
  [70.54, 34.67],
  [68.05, 43.47],
  [52.21, 38.98]
];

var stucco = new THREE.MeshStandardMaterial({ color: 0xe6ddcb, roughness: 0.95 });
var roofMat = new THREE.MeshStandardMaterial({ color: 0x6e6156, roughness: 0.9,
  side: THREE.DoubleSide });
var screenMat = new THREE.MeshStandardMaterial({ color: 0x232d30, roughness: 0.6,
  transparent: true, opacity: 0.35, side: THREE.DoubleSide });
var frameMat = new THREE.MeshStandardMaterial({ color: 0x3a312b, roughness: 0.7 });
var waterMat = new THREE.MeshStandardMaterial({ color: 0x2e7f9e, roughness: 0.25 });
var shelfMat = new THREE.MeshStandardMaterial({ color: 0x8fc8d8, roughness: 0.3 });
var rockMat = new THREE.MeshStandardMaterial({ color: 0x4a423a, roughness: 1 });
var deckMat = new THREE.MeshStandardMaterial({ color: 0xd8cfbc, roughness: 0.95 });
var spaRimMat = new THREE.MeshStandardMaterial({ color: 0x2f3e46, roughness: 0.6 });
var copingMat = new THREE.MeshStandardMaterial({ color: 0x8f8a80, roughness: 0.9 });

function toWorld(p) { return [p[0] - GROUND_W / 2, p[1] - GROUND_D / 2]; }
function shapeFor(polyLocal) {
  var shape = new THREE.Shape();
  polyLocal.forEach(function (p, i) {

  var g = new THREE.ExtrudeGeometry(shapeFor(polyLocal),

  g.rotateX(-Math.PI / 2);

}

function flatShape(polyLocal, yM, mat) {
  var g = new THREE.ShapeGeometry(shapeFor(polyLocal));
  g.rotateX(-Math.PI / 2);

  m.position.y = yM;

function facetMesh(facets, mat) {
  var positions = [], index = [];
  facets.forEach(function (poly) {
    var contour = poly.map(function (p) {
      var w = toWorld([p[0], p[1]]);
      return new THREE.Vector2(w[0], -w[1]);
    });
    var baseIdx = [];
    poly.forEach(function (p) {
      var w = toWorld([p[0], p[1]]);
      positions.push(w[0], p[2], w[1]);
      baseIdx.push(positions.length / 3 - 1);
    });
    var tris = THREE.ShapeUtils.triangulateShape(contour, []);
    tris.forEach(function (t) { index.push(baseIdx[t[0]], baseIdx[t[1]], baseIdx[t[2]]); });
    for (var e = 0; e < poly.length; e++) {
      var a = poly[e], b = poly[(e + 1) % poly.length];
      var wa = toWorld([a[0], a[1]]), wb = toWorld([b[0], b[1]]);
      positions.push(wa[0], a[2] - 0.07, wa[1]);
      var a2 = positions.length / 3 - 1;
      positions.push(wb[0], b[2] - 0.07, wb[1]);
      var b2 = positions.length / 3 - 1;
      index.push(baseIdx[e], b2, baseIdx[(e + 1) % poly.length]);
      index.push(baseIdx[e], a2, b2);
    }
  });
  var g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
  g.setIndex(index);
  g.computeVertexNormals();
  var m = new THREE.Mesh(g, mat);
  m.castShadow = true; m.receiveShadow = true;
  scene.add(m);
  return m;
}

/* ---------------- Controls and sun updates ---------------- */
var dateEl = document.getElementById('date');

function fmtTime(mins) {
  var h = Math.floor(mins / 60), m = Math.floor(mins % 60);
  return (h < 10 ? '0' : '') + h + ':' + (m < 10 ? '0' : '') + m;
}
function parseDate() {
  var p = dateEl.value.split('-');
  return { y: +p[0], mo: +p[1], d: +p[2] };
}
function fmtDate(y, mo, d) {
  return y + '-' + (mo < 10 ? '0' : '') + mo + '-' + (d < 10 ? '0' : '') + d;
}

function updateSun() {
  var dt = parseDate();
  var mins = +timeEl.value;
  clockEl.textContent = fmtTime(mins);
  var sp = sunPosition(dt.y, dt.mo, dt.d, mins / 60);
  var altR = sp.alt * Math.PI / 180, azR = sp.az * Math.PI / 180;
  /* sun direction: +X east, -Z north */
  var dir = new THREE.Vector3(
    Math.cos(altR) * Math.sin(azR),
    Math.sin(altR),
    -Math.cos(altR) * Math.cos(azR));
  var cx = -2.5, cz = -9.7;
  if (sp.alt > -1) {
    sun.visible = true;
    sun.position.set(cx + dir.x * 160, Math.max(dir.y, 0.02) * 160, cz + dir.z * 160);
    sun.target.position.set(cx, 0, cz);
    sun.intensity = 2.6 * Math.max(0.12, Math.min(1, sp.alt / 25));
    ambient.intensity = 0.25 + 0.35 * Math.max(0, Math.min(1, sp.alt / 40));
  } else {
    sun.visible = false;
    ambient.intensity = 0.12;
  }
  var names = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  readoutEl.innerHTML = '<span class="rl">Date <b>' + names[dt.mo - 1] + ' ' + dt.d + ', ' + dt.y + '</b></span>' +
    '<span class="rl">Time <b>' + fmtTime(mins) + '</b></span>' +
    '<span class="rl">Sun altitude <b>' + sp.alt.toFixed(1) + ' deg</b></span>' +
    '<span class="rl">Sun azimuth <b>' + sp.az.toFixed(1) + ' deg</b></span>' +
    (sp.alt <= 0 ? '<span class="rl">(sun below the horizon)</span>' : '');
  updateSunExtras(dt, sp, dir);
}

/* Sunrise, solar noon and sunset for the chosen date, from the same
   NOAA sun path the page draws. Sunrise and sunset use the standard
   -0.583 degree horizon: refraction plus the Sun's disc. */
function sunTimes(y, mo, d) {
  var step = 2, prevM = 0, prevA = sunPosition(y, mo, d, 0).alt;
  var rise = null, set = null, noon = 0, maxA = -90;
  for (var m = step; m <= 1440; m += step) {
    var a = sunPosition(y, mo, d, m / 60).alt;
    if (a > maxA) { maxA = a; noon = m; }
    if (prevA < -0.583 && a >= -0.583 && rise === null) rise = [prevM, m];
    if (prevA >= -0.583 && a < -0.583) set = [prevM, m];
    prevM = m; prevA = a;
  }
  function refine(pair, rising) {
    var lo = pair[0], hi = pair[1];
    for (var i = 0; i < 24; i++) {
      var mid = (lo + hi) / 2;
      var a = sunPosition(y, mo, d, mid / 60).alt;
      if ((a >= -0.583) === rising) hi = mid; else lo = mid;
    }
    return Math.round((lo + hi) / 2);
  }
  var best = noon, bestA = maxA;
  for (var k = noon - 2; k <= noon + 2; k += 0.5) {
    var ak = sunPosition(y, mo, d, k / 60).alt;
    if (ak > bestA) { bestA = ak; best = k; }
  }
  return { rise: rise ? refine(rise, true) : null,
           set: set ? refine(set, false) : null,
           noon: Math.round(best) };
}

/* Pool sun: sample points across the pool water, raycast toward the
   Sun against everything in the scene that casts a shadow. */
var occluders = null;
var poolRay = new THREE.Raycaster();
function visibleChain(o) { while (o) { if (!o.visible) return false; o = o.parent; } return true; }
function poolSunFraction(dir) {
  scene.updateMatrixWorld(true);
  if (!occluders) {
    occluders = [];
    scene.traverse(function (o) { if (o.isMesh && o.castShadow) occluders.push(o); });
  }
  var act = occluders.filter(visibleChain);
  var lit = 0, tot = 0;
  poolRay.far = 150;
  [14, 20, 26, 32, 38, 42].forEach(function (sFt) {
    [6.5, 10, 13.5].forEach(function (tFt) {
      var lp = encPoint(sFt, tFt);
      var w = toWorld(lp);
      poolRay.set(new THREE.Vector3(w[0], 0.12, w[1]), dir);
      tot++;
      if (!poolRay.intersectObjects(act, false).length) lit++;
    });
  });
  return lit / tot;
}

var riseBtn = document.getElementById('sunRise');

var lastTimesKey = '';
var lastTimes = null;
function updateSunExtras(dt, sp, dir) {
  var key = dt.y + '-' + dt.mo + '-' + dt.d;
  if (key !== lastTimesKey) {
    lastTimesKey = key;
    lastTimes = sunTimes(dt.y, dt.mo, dt.d);

    setBtn.textContent = 'Sunset ' + (lastTimes.set === null ? '--:--' : fmtTime(lastTimes.set));

  if (sp.alt > 0.5) {
    var f = poolSunFraction(dir);
    var label = f >= 0.95 ? 'in full sun' : (f <= 0.05 ? 'in shade' : 'partly shaded, ' + Math.round(f * 100) + '% in sun');
    readoutEl.innerHTML += '<span class="rl">Pool <b>' + label + '</b></span>';

    readoutEl.innerHTML += '<span class="rl">Neighbours <b>are the photograph itself, their shadows fixed in it</b></span>';
  }
}

/* Longest and shortest day of next year: the June and December
   solstices. The instant is found from the Sun's apparent longitude
   (Meeus) and dated in America/New_York. */
var longestBtn = document.getElementById('longestDay');
var shortestBtn = document.getElementById('shortestDay');
function appLong(j) {
  var T = (j - 2451545.0) / 36525;
  var L0 = (280.46646 + T * (36000.76983 + 0.0003032 * T)) % 360;
  var M = 357.52911 + T * (35999.05029 - 0.0001537 * T);
  var Mr = M * Math.PI / 180;
  var C = (1.914602 - T * (0.004817 + 0.000014 * T)) * Math.sin(Mr)
    + (0.019993 - 0.000101 * T) * Math.sin(2 * Mr)
    + 0.000289 * Math.sin(3 * Mr);
  var omega = 125.04 - 1934.136 * T;
  return (L0 + C - 0.00569 - 0.00478 * Math.sin(omega * Math.PI / 180) + 360) % 360;
}
function solsticeNYDate(year, target) {
  var j0 = Date.UTC(year, 0, 1) / 86400000 + 2440587.5;
  var prevJ = j0, prevU = appLong(j0);
  for (var j = j0 + 0.25; j < j0 + 366; j += 0.25) {
    var raw = appLong(j);
    var u = prevU + ((raw - (prevU % 360) + 540) % 360 - 180);
    if (prevU < target && target <= u) {
      var a = prevJ, b = j, ua = prevU;
      for (var i = 0; i < 50; i++) {
        var mid = (a + b) / 2;
        var um = ua + ((appLong(mid) - (ua % 360) + 540) % 360 - 180);
        if (um < target) { a = mid; ua = um; } else { b = mid; }
      }
      var sol = new Date(((a + b) / 2 - 2440587.5) * 86400000);
      var off = tzOffsetHours(sol.getUTCFullYear(), sol.getUTCMonth() + 1, sol.getUTCDate());
      var ny = new Date(sol.getTime() + off * 3600000);
      return [ny.getUTCFullYear(), ny.getUTCMonth() + 1, ny.getUTCDate()];
    }
    prevJ = j; prevU = u;
  }
  return null;
}
function goSolstice(longest) {
  var r = solsticeNYDate(new Date().getFullYear() + 1, longest ? 450 : 630);
  if (!r) return;
  function p2(n) { return (n < 10 ? '0' : '') + n; }
  dateEl.value = r[0] + '-' + p2(r[1]) + '-' + p2(r[2]);
  mode = null;
  playDayBtn.classList.remove('active');
  playYearBtn.classList.remove('active');
  updateSun();
}

  return outline.map(function (p) {
    var dx = p[0] - cx, dz = p[1] - cz;
    var len = Math.hypot(dx, dz) || 1;
    var s = Math.max(0, (len - d) / len);
    return [cx + dx * s, cz + dz * s];
  });
}

function stepAnimation(ts) {
  if (!mode) return;
  if (!lastStamp) lastStamp = ts;
  var dt = Math.min(100, ts - lastStamp);
  lastStamp = ts;
  if (mode === 'day') {
    var v = +timeEl.value + dt * 0.55;         // full slider sweep in about 29 seconds
    if (v > 1260) v = 300;
    timeEl.value = Math.round(v);
  } else {
    var cur = parseDate();
    var next = new Date(Date.UTC(cur.y, cur.mo - 1, cur.d) + Math.round(dt * 0.35) * 86400000);
    dateEl.value = fmtDate(next.getUTCFullYear(), next.getUTCMonth() + 1, next.getUTCDate());

}
