<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="author" content="MDS" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="mask-icon" href="/assets/safari-pinned-tab.svg" color="#1d2a3b" />
    <meta name="theme-color" content="#1d2a3b" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/assets/the-isle-master.css" />
    <link rel="stylesheet" href="/assets/splash.css" />
    <title>The Isle</title>
    <link rel="preload" as="image" href="assets/poster-set-01.jpg" fetchpriority="high" />
  </head>
  <body>
    <header class="masthead">
      <h1><img class="wordmark" src="/assets/the-isle-text-silver.svg" alt="The Isle" /></h1>
      <div class="rule" aria-hidden="true"></div>
    </header>
    <main>
      <div class="frame">
        <div class="viewport" id="viewport">
          <img id="layerA" src="assets/poster-set-01.jpg" alt="The Mountain Poster" width="1200" height="1800" fetchpriority="high" />
          <img id="layerB" alt="" width="1200" height="1800" />
        </div>
      </div>
    </main>

    <script>
      // The single poster list. Rotation and preloading read from this
      // array only; swap a poster by replacing one entry. Titles stay as
      // the images' alt text; nothing is shown on the page.
      var POSTERS = [
        { file: "assets/poster-set-01.jpg", title: "The Mountain Poster" },
        { file: "assets/poster-set-04.jpg", title: "The Sunset Poster" },
        { file: "assets/poster-set-05.jpg", title: "Lahaina" },
        { file: "assets/poster-set-06.jpg", title: "Kauai Cliffs" },
        { file: "assets/poster-set-12.jpg", title: "Kauai Bird" },
        { file: "assets/poster-set-23.jpg", title: "Pristine Beaches" },
        { file: "assets/poster-set-26.jpg", title: "Lanikai Beach" },
        { file: "assets/poster-set-28.jpg", title: "Bora Bora" },
        { file: "assets/poster-set-35.jpg", title: "Bali Nusa Penida" },
        { file: "assets/poster-set-36.jpg", title: "Zanzibar" }
      ];

      var SHOW_MS = 6000;   // time each poster stays up
      var FADE_MS = 1200;   // crossfade length, matched to the CSS transition

      var motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
      var reducedMotion = motionQuery.matches;

      var layers = [document.getElementById("layerA"), document.getElementById("layerB")];

      var current = 0; // always starts on the first poster
      var topLayer = 0;              // index into layers of the visible poster
      var playing = !reducedMotion;  // reduced motion: no auto-advance
      var timer = null;
      var fadeTimer = null;
      var zTop = 2;

      function show(i, instant) {
        var incoming = layers[1 - topLayer];
        var outgoing = layers[topLayer];
        incoming.alt = POSTERS[i].title;
        var swapped = false;
        var swap = function () {
          if (swapped) { return; }
          swapped = true;
          zTop += 1;
          incoming.style.zIndex = zTop;
          outgoing.style.zIndex = zTop - 1;
          incoming.style.opacity = "1";
          clearTimeout(fadeTimer);
          if (instant) {
            outgoing.style.opacity = "0";
          } else {
            var out = outgoing;
            fadeTimer = setTimeout(function () { out.style.opacity = "0"; }, FADE_MS);
          }
          topLayer = 1 - topLayer;
          current = i;
        };
        if (incoming.src && incoming.src.indexOf(POSTERS[i].file) !== -1 && incoming.complete && incoming.naturalWidth > 0) {
          swap();
        } else {
          incoming.onload = function () { incoming.onload = null; swap(); };
          incoming.src = POSTERS[i].file;
          if (incoming.complete && incoming.naturalWidth > 0) { incoming.onload = null; swap(); }
        }
      }

      function schedule() {
        clearTimeout(timer);
        if (playing) {
          timer = setTimeout(function () {
            show((current + 1) % POSTERS.length, reducedMotion);
            schedule();
          }, SHOW_MS);
        }
      }

      function goTo(i) {
        show(((i % POSTERS.length) + POSTERS.length) % POSTERS.length, reducedMotion);
        schedule(); // manual navigation restarts the full 6 seconds
      }

      // No on-screen controls: the arrow keys still move through the set.
      document.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight") { goTo(current + 1); }
        else if (e.key === "ArrowLeft") { goTo(current - 1); }
      });

      // Horizontal swipe on the poster navigates.
      var swipeX = null, swipeY = null;
      var viewport = document.getElementById("viewport");
      viewport.addEventListener("pointerdown", function (e) {
        swipeX = e.clientX;
        swipeY = e.clientY;
      });
      viewport.addEventListener("pointerup", function (e) {
        if (swipeX === null) { return; }
        var dx = e.clientX - swipeX;
        var dy = e.clientY - swipeY;
        swipeX = null;
        if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
          if (dx < 0) { goTo(current + 1); } else { goTo(current - 1); }
        }
      });
      viewport.addEventListener("pointercancel", function () { swipeX = null; });

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) { clearTimeout(timer); }
        else { schedule(); }
      });

      // Preload the remaining posters one at a time, in order, so they
      // never compete with the first poster or with each other. The
      // visible crossfade is gated on the incoming image being ready,
      // so a slow poster can never fade in blank.
      function preloadRest(n) {
        if (n >= POSTERS.length) { return; }
        var pre = new Image();
        pre.onload = pre.onerror = function () { preloadRest(n + 1); };
        pre.src = POSTERS[n].file;
      }
      if (document.readyState === "complete") { preloadRest(1); }
      else { window.addEventListener("load", function () { preloadRest(1); }); }

      // First paint: the first poster is already in the HTML layer,
      // shown at once.
      layers[0].style.zIndex = 2;
      layers[0].style.opacity = "1";
      schedule();
    </script>
    <script data-goatcounter="https://1s1e.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  </body>
</html>
