<title>The Isle</title>
<style>
  :root { --ground:#1b2a4a; --silver:#C0C0C0; --gold:#aa936d; --dim:#8e9bb5; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ground); color:var(--silver); font-family:-apple-system, "Segoe UI", Inter, sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px; }
  .box { width:100%; max-width:340px; text-align:center; }
  h1 { font-family:Georgia, "Times New Roman", serif; font-weight:500; letter-spacing:.35em; font-size:26px; text-transform:uppercase; }
  .rule { height:1px; background:var(--gold); margin:20px 0 26px; }
  label { display:block; font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--dim); margin-bottom:12px; }
  input { width:100%; padding:12px 14px; font-size:16px; text-align:center; color:var(--silver); background:rgba(192,192,192,.07); border:1px solid rgba(192,192,192,.4); border-radius:0; outline:none; }
  input:focus { border-color:var(--gold); }
  button { margin-top:14px; width:100%; padding:12px 14px; font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:var(--ground); background:var(--silver); border:none; cursor:pointer; }
  button:active { background:var(--gold); }
  .err { margin-top:14px; font-size:13px; color:#d8a7a7; min-height:18px; }
</style>
</head>
<body>
  <form class="box" id="f">
    <h1>The Isle</h1>
    <div class="rule"></div>
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" />
    <button type="submit">Open</button>
    <div class="err" id="e"></div>
  </form>

  var ITER = 250000;
  function b64ToBytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  document.getElementById("f").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var err = document.getElementById("e");
    err.textContent = "";
    try {
      var raw = b64ToBytes(PAYLOAD);
      var salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
      var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("p").value), "PBKDF2", false, ["deriveKey"]);
      var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct);
      var html = new TextDecoder().decode(plain);
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      err.textContent = "That password does not open this page.";
    }
