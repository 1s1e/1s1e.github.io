<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>The Isle</title>
<style>
  :root { --ground:#1b2a4a; --silver:#C0C0C0; --dim:#8e9bb5; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ground); color:var(--silver); font-family:-apple-system, "Segoe UI", Inter, sans-serif; min-height:100vh; padding:64px 22px; }
  .sheet { width:100%; max-width:560px; margin:0 auto; text-align:left; }
  .head { display:flex; justify-content:space-between; align-items:baseline; font-size:13px; letter-spacing:.32em; text-transform:uppercase; }
  .head .mark { color:var(--dim); font-size:11px; }
  .rule { height:1px; background:var(--silver); margin-top:14px; }
  .rule.thin { background:rgba(192,192,192,.45); margin-top:3px; }
  label { display:block; font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--dim); margin:38px 0 8px; }
  input { width:100%; padding:10px 2px; font-size:17px; text-align:left; color:var(--silver); background:transparent; border:none; border-bottom:1px solid rgba(192,192,192,.55); border-radius:0; outline:none; }
  input:focus { border-bottom-color:var(--silver); }
  button { margin-top:26px; padding:11px 26px; font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:var(--silver); background:transparent; border:1px solid var(--silver); cursor:pointer; }
  button:active { background:rgba(192,192,192,.16); }
  .err { margin-top:16px; font-size:13px; color:#d8a7a7; min-height:18px; }
  .foot { margin-top:12px; font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:var(--dim); }
</style>
</head>
<body>
  <form class="sheet" id="f">
    <div class="head"><span>The Isle</span><span class="mark">Secure</span></div>
    <div class="rule"></div>
    <div class="rule thin"></div>
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" />
    <button type="submit">Open</button>
    <div class="err" id="e"></div>
    <div class="rule"></div>
    <div class="foot">Private · Not linked · Not indexed</div>
  </form>

  var ITER = 250000;
  function b64ToBytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;

  document.getElementById("f").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var err = document.getElementById("e");
    err.textContent = "";
    try {
      var raw = b64ToBytes(PAYLOAD);
      var salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
      var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("p").value), "PBKDF2", false, ["deriveKey"]);

      document.open();
      document.write(html);
      document.close();
