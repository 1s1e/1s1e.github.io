<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>The Isle</title>
<style>
  :root { --ground:#1b2a4a; --silver:#C0C0C0; --dim:#8e9bb5; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ground); color:var(--silver); font-family:-apple-system, "Segoe UI", Inter, sans-serif; min-height:100vh; padding:9vh 22px 24px; }
  .card { width:100%; max-width:520px; margin:0 auto; border:1px solid rgba(192,192,192,.6); background:rgba(192,192,192,.03); padding:24px 28px 28px; }
  .chead { display:flex; justify-content:space-between; align-items:baseline; padding-bottom:12px; border-bottom:1px solid rgba(192,192,192,.4); }
  .chead .name { font-size:13px; letter-spacing:.32em; text-transform:uppercase; }
  .chead .no { font-family:"Courier New", Courier, monospace; font-size:12px; color:var(--dim); }
  .cline { padding:11px 0; border-bottom:1px solid rgba(192,192,192,.22); font-size:13px; }
  .cline .k { font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:var(--dim); display:block; margin-bottom:3px; }
  label { display:block; font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:var(--dim); margin:20px 0 2px; }
  input { width:100%; padding:9px 2px; font-size:16px; font-family:"Courier New", Courier, monospace; color:var(--silver); background:transparent; border:none; border-bottom:1px solid rgba(192,192,192,.55); border-radius:0; outline:none; }
  input:focus { border-bottom-color:var(--silver); }
  button { margin-top:24px; padding:10px 24px; font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--silver); background:transparent; border:1px solid var(--silver); cursor:pointer; }
  button:active { background:rgba(192,192,192,.16); }
  .err { margin-top:14px; font-size:13px; color:#d8a7a7; min-height:18px; }
  .cfoot { margin-top:18px; padding-top:10px; border-top:1px solid rgba(192,192,192,.4); font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:var(--dim); }
</style>
</head>
<body>
  <form class="card" id="f">
    <div class="chead"><span class="name">The Isle</span><span class="no">Card No. 1</span></div>
    <div class="cline"><span class="k">Subject</span>Private papers · Secure</div>
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" />
    <button type="submit">Open</button>
    <div class="err" id="e"></div>
    <div class="cfoot">Filed privately · Not linked · Not indexed</div>
  </form>

  var ITER = 250000;
  function b64ToBytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  document.getElementById("f").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var err = document.getElementById("e");
    err.textContent = "";
    try {
      var raw = b64ToBytes(PAYLOAD);
      var salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
      var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("p").value), "PBKDF2", false, ["deriveKey"]);
      var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);

      var html = new TextDecoder().decode(plain);
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      err.textContent = "That password does not open this page.";
