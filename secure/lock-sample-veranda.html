<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>The Isle</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
<style>
  :root { --ground:#1b2a4a; --silver:#C0C0C0; --dim:#8e9bb5; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ground); color:var(--silver); font-family:Inter, -apple-system, "Segoe UI", sans-serif; font-weight:300; min-height:100vh; padding:0 24px; }
  .col { max-width:480px; margin:0 auto; min-height:100vh; border-left:1px solid rgba(192,192,192,.35); border-right:1px solid rgba(192,192,192,.35); padding:15vh 34px 40px; }
  .box { text-align:center; }
  h1 { font-family:"Playfair Display", Georgia, serif; font-weight:400; letter-spacing:.4em; font-size:28px; text-transform:uppercase; text-indent:.4em; }
  .it { font-family:"Playfair Display", Georgia, serif; font-style:italic; font-size:18px; margin-top:22px; }
  .sub { font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--dim); margin-top:14px; text-indent:.3em; }
  label { display:block; font-size:10px; letter-spacing:.42em; text-transform:uppercase; color:var(--dim); margin:70px 0 12px; text-indent:.42em; }
  input { width:220px; padding:10px 4px; font-size:17px; letter-spacing:.25em; text-align:center; color:var(--silver); background:transparent; border:none; border-bottom:1px solid rgba(192,192,192,.5); border-radius:0; outline:none; }
  input:focus { border-bottom-color:var(--silver); }
  button { margin-top:40px; padding:12px 34px; font-size:11px; letter-spacing:.42em; text-transform:uppercase; text-indent:.42em; color:var(--silver); background:transparent; border:1px solid rgba(192,192,192,.7); cursor:pointer; }
  button:active { background:rgba(192,192,192,.16); }
  .err { margin-top:20px; font-size:13px; color:#d8a7a7; min-height:18px; }
  .foot { margin-top:54px; font-size:9px; letter-spacing:.34em; text-transform:uppercase; color:var(--dim); text-indent:.34em; }
</style>
</head>
<body>
  <div class="col">
  <form class="box" id="f">
    <h1>The Isle</h1>
    <div class="it">You are expected.</div>
    <div class="sub">The Veranda · Private</div>
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" />
    <br />
    <button type="submit">Enter</button>
    <div class="err" id="e"></div>
    <div class="foot">Private · Not linked · Not indexed</div>
  </form>
  </div>

  var ITER = 250000;
  function b64ToBytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  document.getElementById("f").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var err = document.getElementById("e");
    err.textContent = "";
    try {
      var raw = b64ToBytes(PAYLOAD);
      var salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
      var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("p").value), "PBKDF2", false, ["deriveKey"]);
      var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: iv }, key, ct);
      var html = new TextDecoder().decode(plain);
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      err.textContent = "That password does not open this page.";
    }
  });
