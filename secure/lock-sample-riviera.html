<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />

<title>The Isle</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400;1,500&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
<style>
  :root { --ground:#1b2a4a; --silver:#C0C0C0; --dim:#8e9bb5; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ground); color:var(--silver); font-family:Inter, -apple-system, "Segoe UI", sans-serif; font-weight:300; min-height:100vh; padding:17vh 24px 24px; }
  .band { position:fixed; left:0; right:0; height:12px; background:repeating-linear-gradient(90deg, rgba(192,192,192,.35) 0 1px, transparent 1px 9px); }
  .band.top { top:0; } .band.bot { bottom:0; }
  .box { width:100%; max-width:420px; margin:0 auto; text-align:center; }
  h1 { font-family:"Playfair Display", Georgia, serif; font-weight:400; letter-spacing:.42em; font-size:31px; text-transform:uppercase; text-indent:.42em; }
  .fr { font-family:"Playfair Display", Georgia, serif; font-style:italic; font-size:17px; color:var(--silver); margin-top:18px; }
  .rule { width:44px; height:1px; background:rgba(192,192,192,.6); margin:26px auto 0; }
  label { display:block; font-size:10px; letter-spacing:.42em; text-transform:uppercase; color:var(--dim); margin:66px 0 12px; text-indent:.42em; }
  input { width:240px; padding:10px 4px; font-size:17px; letter-spacing:.25em; text-align:center; color:var(--silver); background:transparent; border:none; border-bottom:1px solid rgba(192,192,192,.5); border-radius:0; outline:none; }
  input:focus { border-bottom-color:var(--silver); }
  .enter { display:flex; align-items:center; gap:16px; width:250px; margin:42px auto 0; }
  .enter .l { flex:1; height:1px; background:rgba(192,192,192,.4); }
  button { padding:4px 2px; font-size:11px; letter-spacing:.45em; text-transform:uppercase; text-indent:.45em; color:var(--silver); background:none; border:none; cursor:pointer; white-space:nowrap; }
  .err { margin-top:22px; font-size:13px; color:#d8a7a7; min-height:18px; }
  .foot { margin-top:52px; font-size:9px; letter-spacing:.34em; text-transform:uppercase; color:var(--dim); text-indent:.34em; }
</style>
</head>
<body>
  <div class="band top"></div>
  <div class="band bot"></div>
  <form class="box" id="f">
    <h1>The Isle</h1>
    <div class="fr">Résidences Privées</div>
    <div class="rule"></div>
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" />
    <div class="enter"><span class="l"></span><button type="submit">Enter</button><span class="l"></span></div>
    <div class="err" id="e"></div>
    <div class="foot">Private · Not linked · Not indexed</div>
  </form>

  function b64ToBytes(b64) {
