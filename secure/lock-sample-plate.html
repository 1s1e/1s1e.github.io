<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>The Isle</title>
<style>
  :root { --ground:#1b2a4a; --silver:#C0C0C0; --dim:#8e9bb5; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ground); color:var(--silver); font-family:-apple-system, "Segoe UI", Inter, sans-serif; min-height:100vh; padding:15vh 24px 24px; }
  .frame { position:fixed; inset:18px; border:1px solid var(--silver); pointer-events:none; }
  .frame2 { position:fixed; inset:24px; border:1px solid rgba(192,192,192,.45); pointer-events:none; }
  .box { width:100%; max-width:340px; margin:0 auto; text-align:center; position:relative; }
  h1 { font-family:Georgia, "Times New Roman", serif; font-weight:500; letter-spacing:.35em; font-size:26px; text-transform:uppercase; }
  .dia { display:flex; align-items:center; gap:10px; width:180px; margin:24px auto 30px; }
  .dia .l { flex:1; height:1px; background:var(--silver); }
  .dia .d { width:7px; height:7px; background:var(--silver); transform:rotate(45deg); }
  label { display:block; font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--dim); margin-bottom:12px; }
  input { width:100%; padding:12px 14px; font-size:16px; text-align:center; color:var(--silver); background:rgba(192,192,192,.07); border:1px solid rgba(192,192,192,.4); border-radius:0; outline:none; }
  input:focus { border-color:var(--silver); }
  button { margin-top:14px; width:100%; padding:12px 14px; font-size:12px; letter-spacing:.3em; text-transform:uppercase; color:var(--ground); background:var(--silver); border:none; cursor:pointer; }
  button:active { background:#a8a8a8; }
  .err { margin-top:14px; font-size:13px; color:#d8a7a7; min-height:18px; }
  .foot { margin-top:26px; font-size:10px; letter-spacing:.28em; text-transform:uppercase; color:var(--dim); }
</style>
</head>
<body>
  <div class="frame"></div>
  <div class="frame2"></div>
  <form class="box" id="f">
    <h1>The Isle</h1>
    <div class="dia"><span class="l"></span><span class="d"></span><span class="l"></span></div>
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" />
    <button type="submit">Open</button>
    <div class="err" id="e"></div>
    <div class="foot">Private · Not linked · Not indexed</div>
  </form>
