<title>The Isle</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
  :root { --ground:#1b2a4a; --silver:#C0C0C0; --dim:#8e9bb5; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ground); color:var(--silver); font-family:Inter, -apple-system, "Segoe UI", sans-serif; font-weight:300; min-height:100vh; padding:0 24px 24px; }
  .bar { max-width:880px; margin:0 auto; display:flex; justify-content:space-between; align-items:baseline; padding:26px 0 18px; border-bottom:1px solid rgba(192,192,192,.3); }
  .bar .name { font-family:"Playfair Display", Georgia, serif; font-size:16px; letter-spacing:.34em; text-transform:uppercase; }
  .bar .mark { font-size:10px; letter-spacing:.38em; text-transform:uppercase; color:var(--dim); }
  .box { width:100%; max-width:420px; margin:11vh auto 0; }
  h1 { font-family:"Playfair Display", Georgia, serif; font-style:italic; font-weight:400; font-size:32px; text-align:center; }
  .sub { text-align:center; font-size:12.5px; color:var(--dim); margin-top:14px; line-height:1.7; }
  label { display:block; font-size:10px; letter-spacing:.36em; text-transform:uppercase; color:var(--dim); margin:52px 0 10px; }
  input { width:100%; padding:11px 2px; font-size:16px; color:var(--silver); background:transparent; border:none; border-bottom:1px solid rgba(192,192,192,.5); border-radius:0; outline:none; }
  input:focus { border-bottom-color:var(--silver); }
  button { margin-top:30px; width:100%; padding:15px 14px; font-size:11px; letter-spacing:.38em; text-transform:uppercase; text-indent:.38em; color:var(--ground); background:var(--silver); border:none; cursor:pointer; }
  button:active { background:#a8a8a8; }
  .err { margin-top:16px; font-size:13px; color:#d8a7a7; min-height:18px; text-align:center; }
  .foot { margin-top:44px; text-align:center; font-size:9px; letter-spacing:.34em; text-transform:uppercase; color:var(--dim); text-indent:.34em; }
</style>
</head>
<body>
  <div class="bar"><span class="name">The Isle</span><span class="mark">Private</span></div>
  <form class="box" id="f">
    <h1>Welcome</h1>
    <div class="sub">This part of The Isle is reserved for the house.<br />Please enter your password to continue.</div>
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" />
    <button type="submit">Continue</button>
    <div class="err" id="e"></div>
    <div class="foot">The Isle · Private · Not linked · Not indexed</div>
  </form>

  function b64ToBytes(b64) {
