<!DOCTYPE html>
<html lang="en" class="pg-viewer">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="light dark">
<meta name="author" content="MDS">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon.png">
<link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/site.webmanifest">
<link rel="mask-icon" href="/assets/safari-pinned-tab.svg" color="#1d2a3b">
<meta name="theme-color" content="#1d2a3b">
<title>The Isle · Permit Documents</title>
<script>
  try { var t = localStorage.getItem('isle-theme'); if (t !== 'light' && t !== 'dark') t = 'dark'; document.documentElement.dataset.theme = t; var m = document.querySelector('meta[name="theme-color"]'); if (m) m.setAttribute('content', t === 'light' ? '#f0e8d5' : '#1d2a3b'); } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/assets/the-isle-master.css">
</head>
<body>
<div class="wrap">
  <header id="pagehead" hidden>
    <div class="lockup"><img class="mark-dark" src="/assets/mark-dark.png" alt="The Isle"><img class="mark-colour" src="/assets/mark-colour.png" alt="The Isle"></div>
    <span class="eye">The Isle, Secure</span>
    <h1>Permit Documents</h1>
    <p class="line">The permit documents themselves, readable here. Nothing leaves the page: each file is decrypted in this browser only.</p>
    <a class="back" href="/build/permits/">Back to Permits &amp; Documents</a>
    <a class="home" href="/build/" aria-label="Project Home"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.8V21h14V9.8"/></svg></a>
  </header>
  <div class="rule" id="headrule" hidden></div>

  <div class="gate" id="gate">
    <form class="lockform" id="gateform">
      <div class="logo">
        <img class="lg-dark" src="/assets/the-isle-vertical-silver-colourtree.png" alt="The Isle">
        <img class="lg-light" src="/assets/mark-colour.png" alt="The Isle">
      </div>
      <label for="u" class="t-label">Username</label>
      <input id="u" class="field" type="text" autocomplete="username">
      <label for="pw" class="t-label">Password</label>
      <input type="password" id="pw" class="field" autocomplete="current-password" required>
      <div class="pwrow"><button type="button" class="showpw" id="showpw" aria-pressed="false">Show</button></div>
      <button type="submit" id="unlock" class="btn">Open</button>
      <p class="err" id="err"></p>
    </form>
  </div>

  <main id="content" hidden>
    <div id="lists"></div>
    <div id="viewer">
      <div class="bar"><span id="vname"></span><a id="vopen" class="t-link" href="#" target="_blank" rel="noopener">Open full screen</a></div>
      <iframe id="vframe" title="Document viewer"></iframe>
    </div>
  </main>

  <footer id="pagefoot" hidden>
    <div class="dom">1s1e.com</div>
    <button type="button" class="switch" id="themeSwitch" role="switch" aria-checked="true" aria-label="Dark mode" data-mode="dark"><span class="glyph sun" aria-hidden="true"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5 5l1.8 1.8M17.2 17.2L19 19M19 5l-1.8 1.8M6.8 17.2L5 19"/></svg></span><span class="glyph moon" aria-hidden="true"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span><span class="knob" aria-hidden="true"><span class="knob-glyph k-sun"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.1"/><path d="M12 2.8v2.6M12 18.6v2.6M2.8 12h2.6M18.6 12h2.6M5 5l1.8 1.8M17.2 17.2L19 19M19 5l-1.8 1.8M6.8 17.2L5 19"/></svg></span><span class="knob-glyph k-moon"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></span></span></button>
  </footer>
</div>
<script>
(function () {
  var gate = document.getElementById('gate');
  var content = document.getElementById('content');
  var lists = document.getElementById('lists');
  var err = document.getElementById('err');
  var btn = document.getElementById('unlock');
  var viewer = document.getElementById('viewer');
  var vframe = document.getElementById('vframe');
  var vname = document.getElementById('vname');
  var vopen = document.getElementById('vopen');
  var pagehead = document.getElementById('pagehead');
  var headrule = document.getElementById('headrule');
  var pagefoot = document.getElementById('pagefoot');
  var manifest = null, key = null, byId = {}, cache = {};

  function b64ToBytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function fmt(n) {
    if (n >= 1048576) return (n / 1048576).toFixed(2) + ' MB';
    return (n / 1024).toFixed(2) + ' KB';
  }
  function esc(s) {
    return s.replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function fetchText(url) {
    return fetch(url).then(function (r) { if (!r.ok) throw new Error('fetch ' + url); return r.text(); });
  }
  function decryptEntry(entry) {
    var parts = entry.parts.map(function (p) { return fetchText(p); });
    return Promise.all(parts).then(function (texts) {
      var ct = b64ToBytes(texts.join(''));
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(entry.iv) }, key, ct);
    }).then(function (buf) {
      return crypto.subtle.digest('SHA-256', buf).then(function (h) {
        var hex = Array.prototype.map.call(new Uint8Array(h), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
        if (hex !== entry.sha256) throw new Error('integrity check failed');
        return new Blob([buf], { type: 'application/pdf' });
      });
    });
  }
  function readDoc(entry, button) {
    button.disabled = true; button.textContent = 'Loading';
    function done(url) {
      viewer.style.display = 'block';
      vframe.src = url; vopen.href = url; vname.textContent = entry.name;
      button.disabled = false; button.textContent = 'Read';
      viewer.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    if (cache[entry.id]) { done(cache[entry.id]); return; }
    decryptEntry(entry).then(function (blob) {
      var url = URL.createObjectURL(blob);
      cache[entry.id] = url; done(url);
    }).catch(function () {
      button.disabled = false; button.textContent = 'Read';
      err.textContent = 'That document could not be opened. Please try again.';
      gate.hidden = false;
    });
  }
  function buildLists() {
    var html = '';
    Object.keys(manifest.records).sort().forEach(function (rec) {
      html += '<h2>' + esc(rec) + '</h2><table class="docs"><tbody>';
      manifest.records[rec].forEach(function (f) {
        var entry = f.aliasOf ? byId[f.aliasOf] : f;
        var disp = { name: f.name, id: entry.id, iv: entry.iv, sha256: entry.sha256, bytes: entry.bytes, parts: entry.parts };
        html += '<tr><td class="dn">' + esc(f.name) + '</td><td class="sz">' + fmt(disp.bytes) + '</td>' +
          '<td class="act"><button type="button" class="btn" data-id="' + esc(disp.id) + '">Read</button></td></tr>';
        byId[disp.id] = disp;
      });
      html += '</tbody></table>';
    });
    lists.innerHTML = html;
    Array.prototype.forEach.call(lists.querySelectorAll('button.btn'), function (b) {
      b.addEventListener('click', function () { readDoc(byId[b.getAttribute('data-id')], b); });
    });
  }
  document.getElementById('gateform').addEventListener('submit', function (ev) {
    ev.preventDefault();
    err.textContent = ''; btn.disabled = true; btn.textContent = 'Opening';
    var pw = document.getElementById('pw').value;
    fetchText('manifest.json').then(function (txt) {
      manifest = JSON.parse(txt);
      Object.keys(manifest.records).forEach(function (rec) {
        manifest.records[rec].forEach(function (f) { if (f.id) byId[f.id] = f; });
      });
      var enc = new TextEncoder();
      return crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64ToBytes(manifest.kdf.salt), iterations: manifest.kdf.iter, hash: manifest.kdf.hash },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      });
    }).then(function (k) {
      key = k;
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(manifest.check.iv) }, key, b64ToBytes(manifest.check.b64));
    }).then(function (buf) {
      if (new TextDecoder().decode(buf) !== 'ISLE-PERMITS-OK') throw new Error('check');
      gate.hidden = true; content.hidden = false;
      pagehead.hidden = false; headrule.hidden = false; pagefoot.hidden = false;
      buildLists();
    }).catch(function () {
      btn.disabled = false; btn.textContent = 'Open';
      err.textContent = 'That password did not open the documents. Please try again.';
    });
  });
})();
</script>
<script>
  var pw = document.getElementById('pw');
  var tg = document.getElementById('showpw');
  tg.addEventListener('click', function () {
    var show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    tg.textContent = show ? 'Hide' : 'Show';
    tg.setAttribute('aria-pressed', show ? 'true' : 'false');
    pw.focus();
  });
</script>
<script>
  (function () {
    var root = document.documentElement;
    var themeSwitch = document.getElementById('themeSwitch');
    var metaTheme = document.querySelector('meta[name="theme-color"]');
    function setTheme(t) {
      root.setAttribute('data-theme', t);
      root.style.colorScheme = t;
      if (metaTheme) metaTheme.setAttribute('content', (t === 'light') ? '#f0e8d5' : '#1d2a3b');
      if (themeSwitch) {
        themeSwitch.setAttribute('data-mode', t);
        themeSwitch.setAttribute('aria-checked', (t === 'dark') ? 'true' : 'false');
        themeSwitch.setAttribute('aria-label', (t === 'dark') ? 'Dark mode' : 'Light mode');
      }
    }
    setTheme(root.getAttribute('data-theme') === 'light' ? 'light' : 'dark');
    if (themeSwitch) themeSwitch.addEventListener('click', function () {
      var next = (root.getAttribute('data-theme') === 'dark') ? 'light' : 'dark';
      setTheme(next);
      try { localStorage.setItem('isle-theme', next); } catch (e) {}
    });
  })();
</script>
</body>
</html>
