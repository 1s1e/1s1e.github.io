<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="light dark">
<meta name="author" content="MDS">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon.png">
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png">
<title>Permit Documents, The Isle</title>
<script>
  try { var t = localStorage.getItem('isle-theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<style>
  :root { --bg: #faf7ee; --ink: #1b2a4a; --muted: #75808d; --line: #ddd5bd; --accent: #a67c3d; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --bg: #152130; --ink: #ece8db; --muted: #93a0b4; --line: #31435f; --accent: #c9a35f; } }
  :root[data-theme="dark"] { --bg: #152130; --ink: #ece8db; --muted: #93a0b4; --line: #31435f; --accent: #c9a35f; }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--ink); font-family: -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 26px 40px 26px; }
  header { padding: 8svh 0 0 0; text-align: center; }
  .eye { font-size: 10px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent); }
  h1 { font-family: "Playfair Display", Georgia, serif; font-size: 36px; font-weight: 600; margin: 12px 0 0 0; }
  h2 { font-family: "Playfair Display", Georgia, serif; font-size: 24px; font-weight: 600; margin: 34px 0 4px 0; overflow-wrap: anywhere; }
  .line { font-family: "Playfair Display", Georgia, serif; font-style: italic; font-size: 16.5px; color: var(--muted); margin: 14px auto 0 auto; max-width: 54ch; }
  .rule { border-top: 1px solid var(--line); margin: 30px 0 0 0; }
  .gate { max-width: 420px; margin: 40px auto 0 auto; text-align: center; }
  .gate label { display: block; font-size: 10.5px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--muted); margin-bottom: 12px; }
  .gate input { width: 100%; padding: 13px 14px; font-size: 16px; text-align: center; color: var(--ink); background: transparent; border: 1px solid var(--line); border-radius: 0; outline: none; }
  .gate input:focus { border-color: var(--accent); }
  .gate button { margin-top: 16px; padding: 12px 34px; font-size: 11.5px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--bg); background: var(--ink); border: none; cursor: pointer; }
  .gate button:disabled { opacity: 0.5; cursor: wait; }
  .err { color: #b3402e; font-size: 13.5px; margin-top: 14px; min-height: 18px; }
  .note { font-size: 13px; line-height: 1.55; color: var(--muted); }
  table.docs { width: 100%; border-collapse: collapse; font-size: 13.5px; margin-top: 10px; }
  table.docs td { padding: 9px 10px 9px 0; border-bottom: 1px solid var(--line); vertical-align: top; line-height: 1.45; }
  td.dn { overflow-wrap: anywhere; }
  td.act { text-align: right; white-space: nowrap; padding-right: 0; }
  .read { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); background: none; border: 1px solid var(--accent); padding: 7px 14px; cursor: pointer; }
  .read:disabled { opacity: 0.55; cursor: wait; }
  .sz { color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
  #viewer { margin-top: 30px; display: none; }
  #viewer .bar { display: flex; justify-content: space-between; align-items: baseline; gap: 16px; border-bottom: 1px solid var(--line); padding-bottom: 8px; }
  #vname { font-size: 14px; font-weight: 600; overflow-wrap: anywhere; }
  #vopen { font-size: 11px; letter-spacing: 0.2em; text-transform: uppercase; color: var(--accent); text-decoration: none; white-space: nowrap; }
  #vframe { width: 100%; height: 78svh; border: 1px solid var(--line); margin-top: 12px; background: #fff; }
  footer { text-align: center; padding: 30px 0 34px 0; }
  footer .dom { font-size: 10px; letter-spacing: 0.34em; text-transform: uppercase; color: var(--muted); opacity: 0.75; }
  .back { display: inline-block; margin-top: 20px; font-size: 11px; letter-spacing: 0.26em; text-transform: uppercase; color: var(--muted); text-decoration: none; }
  .back:hover { color: var(--accent); }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <span class="eye">The Isle, Secure</span>
    <h1>Permit Documents</h1>
    <p class="line">The permit documents themselves, readable here. Nothing leaves the page: each file is decrypted in this browser only.</p>
    <a class="back" href="/site/permits/">Back to the public index</a>
  </header>
  <div class="rule"></div>

  <div class="gate" id="gate">
    <form id="gateform">
      <label for="pw">House password</label>
      <input type="password" id="pw" autocomplete="current-password" required>
      <br>
      <button type="submit" id="unlock">Unlock</button>
      <p class="err" id="err"></p>
    </form>
  </div>

  <main id="content" hidden>
    <div id="lists"></div>
    <div id="viewer">
      <div class="bar"><span id="vname"></span><a id="vopen" href="#" target="_blank" rel="noopener">Open full screen</a></div>
      <iframe id="vframe" title="Document viewer"></iframe>
    </div>
  </main>

  <footer>
    <div class="dom">1s1e.com</div>
  </footer>
</div>
<script>
(function () {
  var gate = document.getElementById('gate');
  var content = document.getElementById('content');
  var lists = document.getElementById('lists');
  var err = document.getElementById('err');
  var btn = document.getElementById('unlock');
  var viewer = document.getElementById('viewer');
  var vframe = document.getElementById('vframe');
  var vname = document.getElementById('vname');
  var vopen = document.getElementById('vopen');
  var manifest = null, key = null, byId = {}, cache = {};

  function b64ToBytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  function fmt(n) {
    if (n >= 1048576) return (n / 1048576).toFixed(2) + ' MB';
    return (n / 1024).toFixed(2) + ' KB';
  }
  function esc(s) {
    return s.replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; });
  }
  function fetchText(url) {
    return fetch(url).then(function (r) { if (!r.ok) throw new Error('fetch ' + url); return r.text(); });
  }
  function decryptEntry(entry) {
    var parts = entry.parts.map(function (p) { return fetchText(p); });
    return Promise.all(parts).then(function (texts) {
      var ct = b64ToBytes(texts.join(''));
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(entry.iv) }, key, ct);
    }).then(function (buf) {
      return crypto.subtle.digest('SHA-256', buf).then(function (h) {
        var hex = Array.prototype.map.call(new Uint8Array(h), function (b) { return ('0' + b.toString(16)).slice(-2); }).join('');
        if (hex !== entry.sha256) throw new Error('integrity check failed');
        return new Blob([buf], { type: 'application/pdf' });
      });
    });
  }
  function readDoc(entry, button) {
    button.disabled = true; button.textContent = 'Loading';
    function done(url) {
      viewer.style.display = 'block';
      vframe.src = url; vopen.href = url; vname.textContent = entry.name;
      button.disabled = false; button.textContent = 'Read';
      viewer.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    if (cache[entry.id]) { done(cache[entry.id]); return; }
    decryptEntry(entry).then(function (blob) {
      var url = URL.createObjectURL(blob);
      cache[entry.id] = url; done(url);
    }).catch(function () {
      button.disabled = false; button.textContent = 'Read';
      err.textContent = 'That document could not be opened. Please try again.';
      gate.hidden = false;
    });
  }
  function buildLists() {
    var html = '';
    Object.keys(manifest.records).sort().forEach(function (rec) {
      html += '<h2>' + esc(rec) + '</h2><table class="docs"><tbody>';
      manifest.records[rec].forEach(function (f) {
        var entry = f.aliasOf ? byId[f.aliasOf] : f;
        var disp = { name: f.name, id: entry.id, iv: entry.iv, sha256: entry.sha256, bytes: entry.bytes, parts: entry.parts };
        html += '<tr><td class="dn">' + esc(f.name) + '</td><td class="sz">' + fmt(disp.bytes) + '</td>' +
          '<td class="act"><button type="button" class="read" data-id="' + esc(disp.id) + '">Read</button></td></tr>';
        byId[disp.id] = disp;
      });
      html += '</tbody></table>';
    });
    lists.innerHTML = html;
    Array.prototype.forEach.call(lists.querySelectorAll('button.read'), function (b) {
      b.addEventListener('click', function () { readDoc(byId[b.getAttribute('data-id')], b); });
    });
  }
  document.getElementById('gateform').addEventListener('submit', function (ev) {
    ev.preventDefault();
    err.textContent = ''; btn.disabled = true; btn.textContent = 'Unlocking';
    var pw = document.getElementById('pw').value;
    fetchText('manifest.json').then(function (txt) {
      manifest = JSON.parse(txt);
      Object.keys(manifest.records).forEach(function (rec) {
        manifest.records[rec].forEach(function (f) { if (f.id) byId[f.id] = f; });
      });
      var enc = new TextEncoder();
      return crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey']).then(function (base) {
        return crypto.subtle.deriveKey(
          { name: 'PBKDF2', salt: b64ToBytes(manifest.kdf.salt), iterations: manifest.kdf.iter, hash: manifest.kdf.hash },
          base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      });
    }).then(function (k) {
      key = k;
      return crypto.subtle.decrypt({ name: 'AES-GCM', iv: b64ToBytes(manifest.check.iv) }, key, b64ToBytes(manifest.check.b64));
    }).then(function (buf) {
      if (new TextDecoder().decode(buf) !== 'ISLE-PERMITS-OK') throw new Error('check');
      gate.hidden = true; content.hidden = false;
      buildLists();
    }).catch(function () {
      btn.disabled = false; btn.textContent = 'Unlock';
      err.textContent = 'That password did not open the documents. Please try again.';
    });
  });
})();
</script>
</body>
</html>
