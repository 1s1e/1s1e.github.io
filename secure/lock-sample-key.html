<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>The Isle</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />

<style>
  :root { --ground:#1b2a4a; --silver:#C0C0C0; --dim:#8e9bb5; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ground); color:var(--silver); font-family:Inter, -apple-system, "Segoe UI", sans-serif; font-weight:300; min-height:100vh; padding:15vh 24px 24px; }
  .box { width:100%; max-width:400px; margin:0 auto; text-align:center; }
  .dia { width:9px; height:9px; background:var(--silver); transform:rotate(45deg); margin:0 auto 34px; }
  h1 { font-family:"Playfair Display", Georgia, serif; font-weight:400; letter-spacing:.5em; font-size:27px; text-transform:uppercase; text-indent:.5em; }
  .flank { display:flex; align-items:center; gap:14px; width:260px; margin:30px auto 0; }
  .flank .l { flex:1; height:1px; background:rgba(192,192,192,.5); }
  .flank .w { font-size:9px; letter-spacing:.5em; text-transform:uppercase; color:var(--dim); text-indent:.5em; }
  label { display:block; font-size:10px; letter-spacing:.42em; text-transform:uppercase; color:var(--dim); margin:64px 0 12px; text-indent:.42em; }
  input { width:220px; padding:10px 4px; font-size:17px; letter-spacing:.25em; text-align:center; color:var(--silver); background:transparent; border:none; border-bottom:1px solid rgba(192,192,192,.5); border-radius:0; outline:none; }
  input:focus { border-bottom-color:var(--silver); }
  button { margin-top:38px; padding:13px 36px; font-size:11px; letter-spacing:.42em; text-transform:uppercase; text-indent:.42em; color:var(--silver); background:transparent; border:1px solid rgba(192,192,192,.7); cursor:pointer; }
  button:active { background:rgba(192,192,192,.16); }
  .err { margin-top:20px; font-size:13px; color:#d8a7a7; min-height:18px; }
  .foot { margin-top:56px; font-size:9px; letter-spacing:.34em; text-transform:uppercase; color:var(--dim); text-indent:.34em; }
</style>
</head>
<body>
  <form class="box" id="f">
    <div class="dia"></div>
    <h1>The Isle</h1>
    <div class="flank"><span class="l"></span><span class="w">Secure</span><span class="l"></span></div>
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" />
    <br />
    <button type="submit">Enter</button>
    <div class="err" id="e"></div>
    <div class="foot">Private · Not linked · Not indexed</div>
  </form>

  function b64ToBytes(b64) {
