<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>The Isle</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Inter:wght@300;400&display=swap" rel="stylesheet" />
<style>
  :root { --ground:#1b2a4a; --silver:#C0C0C0; --dim:#8e9bb5; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ground); color:var(--silver); font-family:Inter, -apple-system, "Segoe UI", sans-serif; font-weight:300; min-height:100vh; padding:19vh 24px 24px; }
  .box { width:100%; max-width:420px; margin:0 auto; text-align:center; }
  h1 { font-family:"Playfair Display", Georgia, serif; font-weight:400; letter-spacing:.45em; font-size:34px; text-transform:uppercase; text-indent:.45em; }
  .rule { width:56px; height:1px; background:var(--silver); margin:30px auto 26px; }
  .inv { font-size:10px; letter-spacing:.42em; text-transform:uppercase; color:var(--dim); text-indent:.42em; }
  label { display:block; font-size:10px; letter-spacing:.42em; text-transform:uppercase; color:var(--dim); margin:72px 0 14px; text-indent:.42em; }
  input { width:240px; padding:10px 4px; font-size:17px; letter-spacing:.25em; text-align:center; color:var(--silver); background:transparent; border:none; border-bottom:1px solid rgba(192,192,192,.5); border-radius:0; outline:none; }
  input:focus { border-bottom-color:var(--silver); }
  button { display:block; margin:40px auto 0; padding:6px 4px; font-size:11px; letter-spacing:.45em; text-transform:uppercase; text-indent:.45em; color:var(--silver); background:none; border:none; border-bottom:1px solid transparent; cursor:pointer; }
  button:hover { border-bottom-color:rgba(192,192,192,.5); }
  .err { margin-top:22px; font-size:13px; color:#d8a7a7; min-height:18px; }
  .foot { position:fixed; left:0; right:0; bottom:30px; text-align:center; font-size:9px; letter-spacing:.34em; text-transform:uppercase; color:var(--dim); text-indent:.34em; }
</style>
</head>
<body>
  <form class="box" id="f">
    <h1>The Isle</h1>
    <div class="rule"></div>
    <div class="inv">Private · By invitation</div>
    <label for="p">Password</label>
    <input id="p" type="password" autocomplete="current-password" />
    <button type="submit">Enter</button>
    <div class="err" id="e"></div>
  </form>
  <div class="foot">The Isle · Private</div>

  var ITER = 250000;
  function b64ToBytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;

  document.getElementById("f").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var err = document.getElementById("e");
    err.textContent = "";
    try {
      var raw = b64ToBytes(PAYLOAD);
      var salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
      var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("p").value), "PBKDF2", false, ["deriveKey"]);

      document.open();
      document.write(html);
      document.close();
