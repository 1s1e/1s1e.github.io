<html lang="en">
<head>
<meta charset="utf-8" />

<title>The Isle</title>
<style>
  :root { --ground:#1b2a4a; --silver:#C0C0C0; --dim:#8e9bb5; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ground); color:var(--silver); font-family:Georgia, "Times New Roman", serif; min-height:100vh; padding:44px 22px; }
  .sheet { width:100%; max-width:600px; margin:0 auto; }
  .runhead { display:flex; justify-content:space-between; font-family:-apple-system, "Segoe UI", Inter, sans-serif; font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--dim); padding-bottom:8px; border-bottom:1px solid rgba(192,192,192,.4); }
  h1 { font-weight:500; letter-spacing:.3em; font-size:19px; text-transform:uppercase; text-align:center; margin-top:30px; }
  .years { text-align:center; font-size:12px; letter-spacing:.24em; color:var(--dim); margin-top:8px; text-transform:uppercase; }
  .rule { height:1px; background:var(--silver); margin:22px 0 0; }
  label { display:block; font-family:-apple-system, "Segoe UI", Inter, sans-serif; font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--dim); margin:30px 0 6px; }
  input { width:100%; padding:8px 2px; font-size:16px; color:var(--silver); background:transparent; border:none; border-bottom:1px solid rgba(192,192,192,.55); border-radius:0; outline:none; }
  input:focus { border-bottom-color:var(--silver); }
  button { margin-top:22px; padding:9px 22px; font-family:-apple-system, "Segoe UI", Inter, sans-serif; font-size:11px; letter-spacing:.3em; text-transform:uppercase; color:var(--silver); background:transparent; border:1px solid var(--silver); cursor:pointer; }
  button:active { background:rgba(192,192,192,.16); }
  .err { margin-top:14px; font-size:13px; color:#d8a7a7; min-height:18px; }
  .foot { margin-top:26px; padding-top:8px; border-top:1px solid rgba(192,192,192,.4); font-family:-apple-system, "Segoe UI", Inter, sans-serif; font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--dim); display:flex; justify-content:space-between; }
</style>
</head>
<body>
  <form class="sheet" id="f">
    <div class="runhead"><span>The Isle</span><span>Private Almanack</span></div>

    <div class="rule"></div>
    <label for="p">Password</label>

    <button type="submit">Open</button>
    <div class="err" id="e"></div>
    <div class="foot"><span>Not linked</span><span>Not indexed</span></div>
  </form>

  function b64ToBytes(b64) {

      document.write(html);
