<style>
  :root { --ground:#1b2a4a; --silver:#C0C0C0; --dim:#8e9bb5; }
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:var(--ground); color:var(--silver); font-family:Inter, -apple-system, "Segoe UI", sans-serif; font-weight:300; min-height:100vh; padding:0 24px 24px; }
  .wrap { max-width:880px; margin:0 auto; }
  .bar { display:flex; justify-content:space-between; align-items:baseline; padding:28px 0 16px; }
  .bar .name { font-family:"Playfair Display", Georgia, serif; font-size:17px; letter-spacing:.36em; text-transform:uppercase; }
  .bar .mark { font-size:10px; letter-spacing:.38em; text-transform:uppercase; color:var(--dim); }
  .rails { border-top:1px solid var(--silver); }
  .rails .r2 { border-top:1px solid rgba(192,192,192,.45); margin-top:4px; }
  .rails .r3 { border-top:1px solid rgba(192,192,192,.22); margin-top:4px; }
  .cols { display:flex; gap:56px; margin-top:10vh; flex-wrap:wrap; }
  .left { flex:1 1 260px; }
  .it { font-family:"Playfair Display", Georgia, serif; font-style:italic; font-size:24px; line-height:1.45; }
  .sub { font-size:12.5px; color:var(--dim); line-height:1.75; margin-top:16px; max-width:300px; }
  .box { flex:0 1 300px; }
  label { display:block; font-size:10px; letter-spacing:.38em; text-transform:uppercase; color:var(--dim); margin:6px 0 10px; }
  input { width:100%; padding:11px 2px; font-size:16px; color:var(--silver); background:transparent; border:none; border-bottom:1px solid rgba(192,192,192,.5); border-radius:0; outline:none; }
  input:focus { border-bottom-color:var(--silver); }
  button { margin-top:28px; padding:12px 32px; font-size:11px; letter-spacing:.4em; text-transform:uppercase; text-indent:.4em; color:var(--silver); background:transparent; border:1px solid rgba(192,192,192,.7); cursor:pointer; }
  button:active { background:rgba(192,192,192,.16); }
  .err { margin-top:16px; font-size:13px; color:#d8a7a7; min-height:18px; }
  .foot { margin-top:12vh; font-size:9px; letter-spacing:.34em; text-transform:uppercase; color:var(--dim); }
</style>
</head>
<body>
  <div class="wrap">
    <div class="bar"><span class="name">The Isle</span><span class="mark">The Terrace · Private</span></div>
    <div class="rails"><div class="r2"></div><div class="r3"></div></div>
    <div class="cols">
      <div class="left">
        <div class="it">The quiet side<br />of the house.</div>
        <div class="sub">Beyond this point, The Isle is private. Everything here is kept for the house and its guests.</div>
      </div>
      <form class="box" id="f">
        <label for="p">Password</label>
        <input id="p" type="password" autocomplete="current-password" />
        <button type="submit">Enter</button>
        <div class="err" id="e"></div>
      </form>
    </div>
    <div class="foot">Private · Not linked · Not indexed</div>
  </div>

  var ITER = 250000;
  function b64ToBytes(b64) {
    var bin = atob(b64), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }
  document.getElementById("f").addEventListener("submit", async function (ev) {
    ev.preventDefault();
    var err = document.getElementById("e");
    err.textContent = "";
    try {
      var raw = b64ToBytes(PAYLOAD);
      var salt = raw.slice(0, 16), iv = raw.slice(16, 28), ct = raw.slice(28);
      var base = await crypto.subtle.importKey("raw", new TextEncoder().encode(document.getElementById("p").value), "PBKDF2", false, ["deriveKey"]);
      var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: salt, iterations: ITER, hash: "SHA-256" }, base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);

      var html = new TextDecoder().decode(plain);
      document.open();
      document.write(html);
      document.close();
    } catch (e) {
      err.textContent = "That password does not open this page.";
    }
