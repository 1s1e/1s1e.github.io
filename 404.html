<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="author" content="MDS" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <link rel="mask-icon" href="/assets/safari-pinned-tab.svg" color="#1b2a4a" />
    <meta name="theme-color" content="#1b2a4a" />
    <meta name="msapplication-config" content="/browserconfig.xml" />
    <title>Page Not Found · 1s1e.com</title>
    <style>
      :root {
        --ground: #1b2a4a;
        --ink: #C0C0C0;
        --mat: #dfe2e6;
        --accent: #93a7c9;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }

      body {
        background: var(--ground);
        color: var(--mat);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      main {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }

      .logo img {
        width: min(720px, 86vw);
        height: auto;
        display: block;
      }

      h2 {
        margin-top: 46px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.42em;
        padding-left: 0.42em;
        text-transform: uppercase;
        color: var(--accent);
      }

      p {
        margin-top: 16px;
        font-size: 15px;
        line-height: 1.7;
        color: var(--mat);
      }

      a.home {
        margin-top: 28px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.32em;
        padding-left: 0.32em;
        text-transform: uppercase;
        color: var(--ink);
        text-decoration: none;
        border-bottom: 1px solid var(--accent);
        padding-bottom: 5px;
      }

      a.home:hover { color: #ffffff; }
          @media (max-width: 480px) {
        .masthead h1 .wordmark {
          width: 6.583em;
          margin: -0.2583em 0.1217em -0.2326em -0.1141em;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="logo">
        <img src="/assets/the-isle-vertical-silver-colourtree.png" alt="The Isle" />
      </div>
        <div class="rule" aria-hidden="true"></div>
      </div>
      <h2>Page Not Found</h2>
      <p>This page does not exist, or has been moved.</p>
      <a class="home" href="/">Return to the home page</a>
    </main>
    <script data-goatcounter="https://muse.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
  </body>
</html>
