  if(wx && wx.windKt != null){
    set(7, "WIND " + wx.windDir + " " + wx.windKt + " KT" + (wx.windKt <= 10 ? " · LIGHT" : ""));
    set(12, "SUNSET " + fmtH12(wx.sunset));
  } else if(wx){
    set(12, "SUNSET " + fmtH12(wx.sunset));
    if(b && b.windKt != null) set(7, "WIND " + b.windDir + " " + b.windKt + " KT");
  } else if(b && b.windKt != null){
    set(7, "WIND " + b.windDir + " " + b.windKt + " KT");
  }
  return any ? out.slice(0, 13) : null;
}
function liveOverheadLines(){
  if(!LIVE.region) return null;
  if(!LIVE.sky || !LIVE.sky.length) return [{ text: "NO TRAFFIC OVERHEAD", black: false }];
  return LIVE.sky.slice(0, boardRows()).map(function(a){
    return { text: a.cs + " · " + a.altFt + " FT" + (a.hdg == null ? "" : " · HDG " + ("00" + a.hdg).slice(-3)),
             black: false };
  });
}
function liveMarketLines(b){
  if(!LIVE.markets) return null;
  var stored = b.lines || [];
  var own = boardMarketSymbols(b);
  var any = false, labelled = false;
  var out = stored.map(function(l){
    var t = String(l.text || "").trim().toUpperCase();
    var m = t.match(/^([A-Z]{1,5})\b/);
    if(m && LIVE.markets[m[1]]){ any = true; return { text: LIVE.markets[m[1]], black: !!l.black }; }
    if(/^FIGURES ARE SAMPLES/.test(t)){ labelled = true; return { text: "\u0002", black: false }; }
    return { text: l.text, black: !!l.black };
  });
  if(any){
    out = out.map(function(l){
      return l.text === "\u0002" ? { text: "FIGURES ARE DELAYED · FREE FEED", black: false } : l;
    });
    if(!labelled) out.push({ text: "FIGURES ARE DELAYED · FREE FEED", black: false });
    return out;
  }
  if(own.length) return null; /* the board has symbols but the feed gave none: stored lines stand */
  var lines = [];
  MARKET_DEFAULTS.forEach(function(s){ if(LIVE.markets[s]) lines.push({ text: LIVE.markets[s], black: false }); });
  if(!lines.length) return null;
  lines.push({ text: "FIGURES ARE DELAYED · FREE FEED", black: false });
  return lines;
}
function liveLinesFor(b){
  if(!b || b.type === "colour") return null;
  var k = b.kind || (b.shows === "arrivals" ? "arrivals" : "departures");
  if(k === "weather") return liveWeatherLines();
  if(k !== "custom") return null;
  var t = String(b.customTitle || "").toUpperCase();
  if(t === "NORTH SHORE") return liveNorthShoreLines(b.lines || []);
  if(t === "TIDES") return liveTideLines();
  if(t === "OVERHEAD") return liveOverheadLines();
  if(t === "MARKETS") return liveMarketLines(b);
  return null;
}
function effLines(){ return liveLinesFor(board) || board.lines || []; }
function liveSignature(){
  var parts = [];
  if(board && board.simulation) parts.push(simSignature(board, Date.now()));
  var ll = liveLinesFor(board);
  if(ll) parts.push(ll.map(function(l){ return (l.black ? "#" : "") + l.text; }).join("|"));
  if(board && board.id === "board-tracked")
    parts.push(trackedFlights(board).map(function(f){ return f.remarks; }).join("|"));
  var h = datorHouse();
  parts.push(h.TIDE + "/" + h.WIND + "/" + h.SUNSET);
  return parts.join("~");
}
function liveActive(){
  if(board && board.simulation) return true;
  if(liveLinesFor(board)) return true;
  if(board && board.id === "board-tracked" && LIVE.region) return true;
  var h = datorHouse();
  return h.TIDE !== "HIGH 18:42" || h.WIND !== "SE 12 KT" || h.SUNSET !== "17:31";
}

/* ---- Feed health and the service lamp ----
   Every fetcher marks its feed each cycle: whether it answered, when
   it last answered, and whether the data itself is stale for its kind
   (an NWS observation over two hours old, a buoy observation over
   three). The header lamp reads the feeds behind the board showing:
   green when every feed answered on the latest cycle, amber when a
   feed is delayed (last answer older than two cycles, or stale data),
   red when a feed was unreachable on the latest cycle after the
   layer's retry. Content is never a fault: an empty sky, a closed
   market and a calm sea all keep the lamp green. Composed boards,
   which draw on no feed, show no lamp at all. */
var CYCLE_MS = 10 * 60 * 1000;
function feedMark(key, ok, stale){
  var f = LIVE.feeds[key] || (LIVE.feeds[key] = { ran: false, okCycle: false, lastOk: 0, stale: false });
  f.ran = true; f.okCycle = !!ok; f.stale = !!stale;
  if(ok) f.lastOk = Date.now();
}
function feedState(key){
  var f = LIVE.feeds[key];
  if(!f || !f.ran) return "wait";
  if(!f.okCycle) return "down";
  if(f.stale) return "delayed";
  if(f.lastOk && (Date.now() - f.lastOk) > 2 * CYCLE_MS) return "delayed";
  return "ok";
}
function boardFeeds(b){
  if(!b || b.type === "colour") return null;
  var feeds = [];
  var k = b.kind || "departures";
  if(k === "weather") feeds = ["weather", "tides"];
  else if(k === "custom"){
    var t = String(b.customTitle || "").toUpperCase();
    if(t === "TIDES") feeds = ["tides"];
    else if(t === "NORTH SHORE") feeds = ["nsTides", "buoy", "nsWx"];
    else if(t === "OVERHEAD") feeds = ["region"];
    else if(t === "MARKETS") feeds = ["markets"];
  }
  if(b.id === "board-tracked") feeds = ["region"];
  if((b.style || "isle") === "dator"){
    if(feeds.indexOf("weather") < 0) feeds.push("weather");
    if(feeds.indexOf("tides") < 0) feeds.push("tides");
  }
  return feeds.length ? feeds : null;
}
var FEED_RANK = { ok: 0, wait: 1, delayed: 2, down: 3 };
function lampState(b){
  var feeds = boardFeeds(b);
  if(!feeds) return null;
  var worst = "ok";
  feeds.forEach(function(key){
    var s = feedState(key);
    if(FEED_RANK[s] > FEED_RANK[worst]) worst = s;
  });
  return worst;
}
function renderLamp(){
  var lamp = document.getElementById("lamp");
  var wrap = document.getElementById("lampwrap");
  if(!lamp || !wrap) return;
  var st = lampState(board);
  if(!st){ lamp.hidden = true; wrap.hidden = true; return; }
  lamp.className = "lamp " + st;
  lamp.hidden = false;
  if(boardStyle() !== "isle" && board.type !== "colour"){
    wrap.hidden = false;
    if(lamp.parentNode !== wrap) wrap.appendChild(lamp);
  } else {
    wrap.hidden = true;
    var box = document.querySelector(".clockbox");
    if(box && lamp.parentNode !== box) box.insertBefore(lamp, box.firstChild);
  }
}
function refreshLive(){
  Promise.all([
    fetchWeather(),
    fetchTides("8726917", "America/New_York").then(function(t){ if(t) LIVE.isleTides = t; feedMark("tides", !!t); }),
    fetchTides("1612668", "Pacific/Honolulu").then(function(t){ if(t) LIVE.nsTides = t; feedMark("nsTides", !!t); }),
    fetchNsWx(),
    fetchBuoy(),
    fetchRegion(),
    fetchMarkets()
  ]).then(function(){
    var sig = liveSignature();
    var changed = sig !== LIVE.sig;
    LIVE.sig = sig;
    if(changed && liveActive()) renderBoard(true);
    renderLamp();
  });
}
refreshLive();
setInterval(refreshLive, 10 * 60 * 1000);
/* A simulation board changes on its own clock, far oftener than the
   ten minute feed cycle: check its signature every 30 seconds and
   cascade only when the generated board has actually moved. A
   composed board's remarks move on the same clock (see the evolution
   block): the same 30 second check watches its composed signature,
   and a change there flips only the changed lines' remark tiles
   through applyRemarkChange, never a full re-cascade. */
setInterval(function(){
  if(board && board.simulation){
    var sig = simSignature(board, Date.now());
    if(LIVE.sigSim === undefined){ LIVE.sigSim = sig; }
    else if(sig !== LIVE.sigSim){ LIVE.sigSim = sig; renderBoard(true); }
    return;
  }
  if(!board || board.id === "board-tracked" || board.type === "colour" || isTextBoard()) return;
  var csig = composedSignature(board, Date.now());
  if(LIVE.sigComp === undefined){
    /* First check on this board: a threshold may have crossed while
       the opening cascade was still running, after the render read
       the remarks. Apply as well as store, so the board catches up;
       applyRemarkChange moves nothing whose tiles already match. */
    LIVE.sigComp = csig; applyRemarkChange();
  }
  else if(csig !== LIVE.sigComp){ LIVE.sigComp = csig; applyRemarkChange(); }
}, 30000);
function tickClock(){
  var d = new Date();
  var t = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  document.getElementById("clock").textContent = t;
  var sc = document.querySelectorAll(".st-clock");
  for(var i = 0; i < sc.length; i++) sc[i].textContent = t;
}
tickClock(); setInterval(tickClock, 1000);
renderBoard(false);
/* A cascade that opens a board waits for the clack buffers when
   sound exists at all. The page this replaces fired its opening
   cascade 600 ms after load whether or not the set had finished
   decoding, and every step before buffersReady was silently
   discarded, so the first cascade a viewer saw was often the one
   they never heard (diagnosis, Nov 27, 2026). The board itself is
   already rendered above; the cascade runs when the buffers land,
   or after 3 s if they never do (a failed set sounds nothing
   either way). Where the browser holds the context until a first
   touch, the cascade still renders, no voice is started into the
   hold (the chain refuses a non-running context), and the
   first-clack watch fires the cascade that sounds in full once
   the touch starts the sound. */
function renderBoardWhenReady(){
  if(!AC || buffersReady){ renderBoard(true); return; }
  var waited = 0;
  var wiv = setInterval(function(){
    waited += 100;
    if(buffersReady || waited >= 3000){ clearInterval(wiv); renderBoard(true); }
  }, 100);
}
setTimeout(function(){ renderBoardWhenReady(); }, 600); /* opening cascade */

/* Sound starts from the board's own configuration, with no on-page
   control of any kind. Where the browser permits audio without a
   gesture (the television kiosk), this call starts it at once. Where
   it does not, the board displays silently and the first pointer or
   key interaction anywhere on the page starts the sound, with no
   prompt, text or button shown. */
initAudio();
document.addEventListener("pointerdown", initAudio);
document.addEventListener("keydown", initAudio);
/* Opened from the /board menu (fs=1), the board asks for the full
   screen as part of that same navigation: the request is made on
   load, inside the gesture chain the menu click began, and again at
   the first interaction if the browser refused it on load. Code
   only; the page itself carries no control or text for it. */
function askFullscreen(){
  if(!WANTFS || document.fullscreenElement) return;
  try{
    var p = document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
    if(p && p.catch) p.catch(function(){});
  }catch(e){}
}
askFullscreen();
document.addEventListener("pointerdown", askFullscreen);
document.addEventListener("keydown", askFullscreen);
window.addEventListener("storage", function(e){
    if(e.key !== CFGKEY || !e.newValue) return;
    try{
      config = JSON.parse(e.newValue); demoRemap(config);
      var nc = carouselFrom(config);
      if(nc){
        carousel = nc;
        nc.idx = carouselIdx(nc);
        showCarouselBoard(nc, nc.idx);
        return;
      }
      carousel = null;
      var nb = config.boards[config.liveBoardId];
      if(!nb) return;
      if(!nb.type) nb.type = "departures";
      if("rows" in nb) delete nb.rows;
      if(nb.type !== "colour" && !nb.kind) nb.kind = nb.shows === "arrivals" ? "arrivals" : "departures";
      if(!nb.flights) nb.flights = [];
      if(!nb.lines) nb.lines = [];
      if(nb.type === "colour" && !nb.scene) nb.scene = "walk";
      if(nb.type === "colour" && !(nb.night >= 1 && nb.night <= 8)) nb.night = 8;
      if(!nb.style) nb.style = "isle";
      if(!nb.sceneSounds) nb.sceneSounds = { on:false, level:0.5 };
      var setChanged = nb.clackSet !== board.clackSet;
      var bedChanged = nb.ambience.bed !== board.ambience.bed || nb.ambience.on !== board.ambience.on;
      board = nb;
      armFirstPa();
      armFirstClack();
      fitBoard();
      if(AC){ applyLevels(); if(setChanged) loadSet(board.clackSet); if(bedChanged) setupBed(); }
      if(AC && setChanged) renderBoardWhenReady(); else renderBoard(true);
    }catch(err){}
  });
</script>
<script>
/* ============ The television's own wiring ============
   The three icon controls govern the board in the screen through
   the engine's own paths. SOUND (bare) / PREVIEW SOUND (framed by
   Settings) is the demo's own hold on the board's audio context:
   it writes nothing to any configuration. In the Settings frame,
   Escape is the overlay's key, so it is passed to the parent.
   The line's word names what the screen holds: bare, it is LIVE,
   breathing, over the live board's name (a live carousel reads as
   the menu's now playing line does, the carousel's name and the
   member up); in the preview serving it is DEMO, steady, with the
   demoed board's name. */
(function(){
  var soundBtn = document.getElementById("dm-sound");
  function soundOn(){ return !demoSoundHeld; }
  function syncSound(){
    soundBtn.dataset.on = soundOn() ? "true" : "false";
    soundBtn.setAttribute("aria-label",
      (DEMO_CTX ? "Preview sound: " : "Sound: ") + (soundOn() ? "on" : "off"));
  }
  var part = document.getElementById("demo-name-part");
  if(part) part.hidden = false;
  var wordEl = document.getElementById("demo-word");
  if(wordEl && !DEMO_CTX){ wordEl.textContent = "LIVE"; wordEl.classList.add("live-word"); }
  var nameEl = document.getElementById("demo-board-name");
  var lastName = "";
  function capName(){
    if(!window.board || !board.name) return "";
    if(!DEMO_CTX && window.carousel && carousel && carousel.def && carousel.def.name)
      return carousel.def.name + " · " + board.name;
    return board.name;
  }
  function syncName(){
    var n = capName();
    if(nameEl && n && n !== lastName){ lastName = n; nameEl.textContent = n; }
  }
  syncName();
  setInterval(syncName, 400);
  /* the line's resting place, decided by measurement: held at its
     raised position, if the caption or the controls reach the stand
     the line rests under the stand instead. Re-measured as the name
     changes, as the screen changes size, and on the name interval,
     so it holds for any caption length at any size. */
  var lineEl = document.querySelector(".tvx-line");
  var capEl = document.querySelector(".tvx .cap-name");
  var ctrEl = document.querySelector(".tvx-controls");
  var standEl = document.querySelector(".tvx .tv-stand");
  function hitsStand(r){
    var s = standEl.getBoundingClientRect();
    return !(r.right <= s.left || r.left >= s.right || r.bottom <= s.top || r.top >= s.bottom);
  }
  function fitLine(){
    if(!lineEl || !capEl || !standEl) return;
    lineEl.classList.remove("rest");
    if(hitsStand(capEl.getBoundingClientRect()) ||
       (ctrEl && hitsStand(ctrEl.getBoundingClientRect())))
      lineEl.classList.add("rest");
  }
  fitLine();
  setInterval(fitLine, 400);
  window.addEventListener("resize", fitLine);
  if(DEMO_CTX){
    document.addEventListener("keydown", function(e){
      if(e.key === "Escape" && window.parent !== window)
        window.parent.postMessage({ type: "isle-demo-escape" }, location.origin);
    });
  }
  document.getElementById("dm-cascade").addEventListener("click", function(){
    if(!demoHeld() && window.initAudio) initAudio();
    if(window.renderBoard) renderBoard(true);
  });
  document.getElementById("dm-full").addEventListener("click", function(){
    var scr = document.getElementById("demo-screen");
    if(!scr || document.fullscreenElement || document.webkitFullscreenElement) return;
    var req = scr.requestFullscreen || scr.webkitRequestFullscreen;
    if(!req) return;
    try{ var p = req.call(scr); if(p && p.catch) p.catch(function(){}); }catch(e){}
  });
  soundBtn.addEventListener("click", function(){
    if(demoHeld()){
      demoSoundHeld = false;
      if(window.initAudio) initAudio();
      if(window.AC && AC.resume) AC.resume();
    } else {
      demoSoundHeld = true;
      if(window.AC && AC.suspend) AC.suspend();
    }
    syncSound();
  });
  syncSound();
  window.addEventListener("load", function(){ if(window.fitStage) fitStage(); });
  setTimeout(function(){ if(window.fitStage) fitStage(); }, 350);
})();
</script>
