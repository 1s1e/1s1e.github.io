<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<script>
/* One-time on-device storage reset (Nov 27, 2026). Earlier builds stored
   board data under the two keys below; on the first load of this build
   that old data is cleared so nothing stale carries over, and the page
   seeds fresh. The marker makes the reset fire once only, so boards made
   afterwards persist across visits. */
(function(){
  var RESET_EPOCH = "20261127";
  try{
    if(localStorage.getItem("isle-board-reset") !== RESET_EPOCH){
      localStorage.removeItem("isle-board-config-v1");
      localStorage.removeItem("isle-board-demo-v1");
      localStorage.setItem("isle-board-reset", RESET_EPOCH);
    }
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon.png" />
<link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
<link rel="mask-icon" href="/assets/safari-pinned-tab.svg" color="#1d2a3b" />
<title>The Isle · Flight Board Demo</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --tile-w: clamp(18px, 2.05vw, 84px);
    --tile-h: calc(var(--tile-w) * 1.42);
    --gap: calc(var(--tile-w) * 0.14);
    --px: 24px;
    --ink: #f2ede1;
    --amber: #e8a33d;
    --board-bg: #000000;
    --tile-bg: #17181a;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html,body{ background:#000; height:100%; }
  body{
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
    min-height:100vh; overflow:hidden; position:relative;
  }
  #board{
    background: var(--board-bg);
    padding: var(--pad-y, 2vh) var(--pad-x, 2vw);
  }
  header{
    display:flex; align-items:baseline; justify-content:space-between;
    padding: 0 0 calc(var(--tile-w) * 0.32);
    border-bottom: 1px solid #101011;
    margin-bottom: calc(var(--tile-w) * 0.34);
  }
  header .title{
    font-size: calc(var(--tile-w) * 1.02); line-height: 1.1;
    font-weight: 700; letter-spacing: .34em; text-transform: uppercase;
    white-space: nowrap;
  }
  header .title .dot{ color: var(--amber); letter-spacing: 0; }
  header .clock{
    font-size: calc(var(--tile-w) * 1.02); line-height: 1.1;
    font-weight: 700; letter-spacing: .18em; font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .colheads, .row{ display:flex; align-items:center; }
  .colheads{ padding: 0 0 calc(var(--tile-w) * 0.22); }
  .colheads span{
    font-size: calc(var(--tile-w) * 0.44); line-height: 1.1; letter-spacing: .3em;
    color:#8f8c82; text-transform: uppercase; font-weight: 600;
  }
  .row{ padding: var(--row-pad, 0.55vh) 0; }
  .cell{ display:flex; gap: var(--gap); }
  .spacer{ width: calc(var(--tile-w) * 1.15); flex: none; }
  .tile{
    width: var(--tile-w); height: var(--tile-h); flex: none;
    background: linear-gradient(to bottom, #1d1e21 0%, #17181a 49.4%, #060607 49.6%, #060607 50.4%, #131416 50.6%, #101112 100%);
    border-radius: calc(var(--tile-w) * 0.09);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.045), inset 0 -6px 10px rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center;
    font-size: calc(var(--tile-w) * 0.94);
    font-weight: 700; line-height: 1; color: var(--ink);
    text-shadow: 0 1px 0 rgba(0,0,0,.6);
    transform-origin: 50% 50%;
    user-select:none;
  }
  .tile.flip{ animation: tileflip 85ms ease-in; }
  @keyframes tileflip{
    0%{ transform: perspective(300px) rotateX(0deg); }
    55%{ transform: perspective(300px) rotateX(-38deg); filter: brightness(1.25); }
    100%{ transform: perspective(300px) rotateX(0deg); }
  }
  .tile.land{ animation: tileland 130ms ease-out; }
  @keyframes tileland{
    0%{ transform: scale(1.035); } 100%{ transform: scale(1); }
  }
  .row .remarks .tile{ color: var(--ink); }
  .row .remarks .tile.hot{ color: var(--amber); }
  /* ---- colour board ---- */
  #colour{ display:none; }
  #colour .pxgrid{ display:grid; gap: 2px; justify-content:center; }
  .px{
    width: var(--px); height: var(--px);
    border-radius: calc(var(--px) * 0.08);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
  }
  .px.shimmer{ animation: pxflip 170ms ease-out; }
  @keyframes pxflip{
    0%{ transform: perspective(220px) rotateX(0deg); }
    50%{ transform: perspective(220px) rotateX(-42deg); filter: brightness(1.35); }
    100%{ transform: perspective(220px) rotateX(0deg); }
  }
  /* ============ Board styles: per-board display languages ============ */
  #styled{ display:none; width:100%; height:100%; position:relative; overflow:hidden; }
  #pixcap{ display:none; align-items:center; margin: 0 auto; padding-top: 26px; }
  #pixcap .pc-tiles{ display:flex; gap:3px; flex:none; }
  #pixcap .pc-tile{ background:linear-gradient(180deg,#26282c 0%,#1b1c1f 49%,#101112 50%,#1e2023 100%); color:#f2efe3; font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; font-weight:600; display:flex; align-items:center; justify-content:center; border-radius:2px; position:relative; overflow:hidden; width:60px; height:90px; font-size:39px; box-shadow: inset 0 0 0 1px #000; }
  #pixcap .pc-tile::after{ content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(0,0,0,.6); }
  #pixcap .pc-msg{ color:#e8e6df; letter-spacing:.14em; font-weight:600; white-space:nowrap; overflow:hidden; font-size:39px; margin-left:42px; font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; }
  #pixcap .pc-msg b{ color:#ffb43a; }
  #pixcap .pc-clock{ margin-left:auto; color:#e8e6df; font-weight:600; letter-spacing:.1em; font-size:39px; font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; }

  /* Gallery Six: the board as furniture, standing on the black page ground */
  .st-gallery{ position:absolute; inset:0; background:#000000; font-family:"Source Sans 3","Helvetica Neue",Arial,sans-serif; color:#f2efe3; display:flex; flex-direction:column; }
  .st-gallery .g-plaque{ display:flex; align-items:flex-end; justify-content:space-between; }
  .st-gallery .g-title{ font-family:Fraunces, Georgia, serif; font-weight:600; color:#f2efe3; line-height:1.02; }
  .st-gallery .g-sub{ letter-spacing:.30em; color:#8f887a; font-weight:600; }
  .st-gallery .g-clock{ text-align:right; }
  .st-gallery .g-clock .t{ font-family:Fraunces, Georgia, serif; font-weight:600; color:#f2efe3; line-height:1; }
  .st-gallery .g-clock .l{ letter-spacing:.26em; color:#8f887a; font-weight:600; }
  .st-gallery .g-board{ background:linear-gradient(180deg,#1d1d1c,#101010); margin:0 auto; }
  .st-gallery .g-grid{ display:grid; }
  .st-gallery .g-tile{ background:linear-gradient(180deg,#262624 0%,#1b1b1a 49%,#141413 50%,#1e1e1d 100%); color:#f2efe3; font-family:Archivo,"Helvetica Neue",sans-serif; font-weight:600; display:flex; align-items:center; justify-content:center; border-radius:3px; position:relative; overflow:hidden; width:100%; height:100%; }
  .st-gallery .g-tile::after{ content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(0,0,0,.6); }
  .st-gallery .g-tile.settle{ animation:gsettle .18s ease-out; }
  @keyframes gsettle{ 0%{ transform:translateY(-6%); } 60%{ transform:translateY(2%); } 100%{ transform:none; } }
  .st-gallery .g-foot{ display:flex; align-items:center; justify-content:space-between; color:#8f887a; letter-spacing:.24em; font-weight:600; }
  .st-gallery .g-dots{ display:flex; }
  .st-gallery .g-dots i{ border-radius:50%; display:block; }

  /* F Clipper: Pan Am Jet Age, pale sky and navy tiles */
  .st-clipper{ position:absolute; inset:0; background:#f5f8fa; color:#101418; font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; display:flex; }
  .st-clipper .c-rail{ border-right:1px solid #d7dee3; display:flex; flex-direction:column; flex:none; }
  .st-clipper .c-time{ font-weight:700; color:#0b0e12; line-height:.95; }
  .st-clipper .c-date{ color:#33404c; font-weight:600; }
  .st-clipper .c-rule{ background:#00a3d9; }
  .st-clipper .c-note{ color:#5a6a76; }
  .st-clipper .c-main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .st-clipper .c-word{ font-weight:700; color:#0a1f6e; letter-spacing:-0.01em; line-height:1; }
  .st-clipper .c-word .dot{ color:#00a3d9; }
  .st-clipper .c-sub{ letter-spacing:.34em; color:#0a2a7a; font-weight:600; }
  .st-clipper .c-bank{ }
  .st-clipper .c-bank + .c-bank{ border-top:1px solid #bcd2e8; }
  .st-clipper .c-bankname{ letter-spacing:.30em; color:#0a2a7a; font-weight:700; }
  .st-clipper .c-heads, .st-clipper .c-row{ display:flex; align-items:center; }
  .st-clipper .c-heads{ color:#7c8a96; letter-spacing:.22em; font-weight:600; }
  .st-clipper .c-timecell{ font-weight:700; color:#0b0e12; flex:none; }
  .st-clipper .c-tiles{ display:flex; flex:none; }
  .st-clipper .c-tile{ background:linear-gradient(180deg,#fdfdfb 0%,#f4f4ef 49%,#e9e9e2 50%,#f1f1ea 100%); color:#0a2472; font-weight:600; display:flex; align-items:center; justify-content:center; border:1px solid #d8d8d0; border-radius:2px; position:relative; overflow:hidden; }
  .st-clipper .c-tile::after{ content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(20,30,60,.18); }
  .st-clipper .c-tile.flip{ animation:cflip .16s ease-out; }
  @keyframes cflip{ 0%{ transform:rotateX(55deg); } 100%{ transform:none; } }
  .st-clipper .c-clip{ font-style:italic; color:#20303e; white-space:nowrap; overflow:hidden; }
  .st-clipper .c-rem{ font-weight:700; color:#0a2a7a; letter-spacing:.06em; white-space:nowrap; }
  .st-clipper .c-rem.quiet{ color:#8ba3c9; font-weight:600; }
  .st-clipper .c-rem.final{ color:#0b0e12; }

  /* G Patapata: the white Japanese platform board */
  .st-patapata{ position:absolute; inset:0; background:#fdfdfc; color:#17181a; font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; display:flex; flex-direction:column; }
  .st-patapata .p-jp{ color:#d42b1e; font-weight:700; letter-spacing:.42em; }
  .st-patapata .p-name{ font-weight:800; color:#101114; line-height:1; }
  .st-patapata .p-kata{ color:#8a8d91; font-weight:600; letter-spacing:.18em; }
  .st-patapata .p-disc{ background:#d42b1e; color:#fff; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; flex:none; }
  .st-patapata .p-disc .l{ letter-spacing:.3em; font-weight:600; }
  .st-patapata .p-rule{ background:#d42b1e; flex:none; }
  .st-patapata .p-heads{ display:flex; align-items:center; color:#6d7074; font-weight:700; }
  .st-patapata .p-heads .jp{ color:#17181a; }
  .st-patapata .p-row{ display:flex; align-items:center; border-top:1px solid #e3e4e2; }
  .st-patapata .p-badge{ color:#fff; font-weight:800; letter-spacing:.04em; display:flex; align-items:center; justify-content:center; text-align:center; border-radius:3px; position:relative; overflow:hidden; flex:none; line-height:1.08; box-shadow:inset 0 -14px 18px -14px rgba(0,0,0,.55); }
  .st-patapata .p-badge::after{ content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(0,0,0,.28); }
  .st-patapata .p-time{ font-weight:800; color:#101114; flex:none; }
  .st-patapata .p-dest{ background:linear-gradient(180deg,#26282c,#232529); color:#f4f2ea; font-weight:700; letter-spacing:.10em; display:flex; align-items:center; border-radius:3px; position:relative; overflow:hidden; flex:1; white-space:nowrap; }
  .st-patapata .p-dest.flip{ animation:cflip .22s ease-out; }
  .st-patapata .p-status{ font-weight:700; color:#3c3f44; flex:none; white-space:nowrap; }
  .st-patapata .p-status.alert{ color:#d42b1e; }

  /* H Dator: the Solari clock as the board */
  .st-dator{ position:absolute; inset:0; background:#060606; color:#f2f0e9; font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; display:flex; flex-direction:column; }
  .st-dator .d-top{ display:flex; justify-content:space-between; color:#8f8c85; letter-spacing:.34em; font-weight:600; }
  .st-dator .d-top b{ color:#f2f0e9; font-weight:700; }
  .st-dator .d-stage{ flex:1; display:flex; align-items:center; }
  .st-dator .d-stack{ display:flex; flex-direction:column; flex:none; }
  .st-dator .d-lab{ color:#8f8c85; letter-spacing:.30em; font-weight:600; }
  .st-dator .d-tiles{ display:flex; }
  .st-dator .d-tile{ background:linear-gradient(180deg,#26282c 0%,#1b1c1f 49%,#101112 50%,#1e2023 100%); color:#f5f3ec; font-weight:700; display:flex; align-items:center; justify-content:center; border-radius:4px; position:relative; overflow:hidden; box-shadow:inset 0 0 0 1px #000, 0 2px 5px rgba(0,0,0,.6); }
  .st-dator .d-tile::after{ content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(0,0,0,.65); }
  .st-dator .d-tile.dim{ color:#55534e; }
  .st-dator .d-tile.amb{ color:#ffb43a; }
  .st-dator .d-tile.flip{ animation:cflip .16s ease-out; }
  .st-dator .d-clock{ display:flex; align-items:center; justify-content:center; flex:1; }
  .st-dator .d-dig.min{ font-family:"DejaVu Sans","Liberation Sans",sans-serif; font-weight:600; }
  .st-dator .d-colon{ display:flex; flex-direction:column; align-items:center; justify-content:center; flex:none; }
  .st-dator .d-colon i{ background:#f5f3ec; border-radius:50%; display:block; }
  .st-dator .d-foot{ border-top:1px solid #232323; display:flex; align-items:center; }

  /* J Projekt 1400: Aicher's system, melon yellow and night blue */
  .st-projekt{ position:absolute; inset:0; background:#ffffff; color:#22224a; font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; display:flex; flex-direction:column; }
  .st-projekt .j-head{ background:#f2a900; display:flex; align-items:center; flex:none; }
  .st-projekt .j-logo{ background:#22224a; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none; }
  .st-projekt .j-name{ font-weight:700; color:#22224a; line-height:1; }
  .st-projekt .j-sub{ color:#22224a; }
  .st-projekt .j-clock{ margin-left:auto; text-align:right; flex:none; }
  .st-projekt .j-clock .t{ font-weight:700; line-height:1; }
  .st-projekt .j-heads{ display:flex; align-items:center; color:#22224a; font-weight:600; border-bottom:5px solid #22224a; }
  .st-projekt .j-row{ display:flex; align-items:center; border-bottom:1px solid #d8daea; }
  .st-projekt .j-row.flip{ animation:jflip .3s ease-out; transform-origin:top center; }
  @keyframes jflip{ 0%{ transform:rotateX(70deg); opacity:.4; } 100%{ transform:none; opacity:1; } }
  .st-projekt .j-time{ font-weight:700; flex:none; }
  .st-projekt .j-ziel{ flex:none; white-space:nowrap; overflow:hidden; }
  .st-projekt .j-flug{ color:#5a5e8c; flex:none; white-space:nowrap; }
  .st-projekt .j-pic{ flex:none; display:flex; align-items:center; }
  .st-projekt .j-rem{ white-space:nowrap; overflow:hidden; }
  .st-projekt .j-rem.strong{ font-weight:700; }
  .st-projekt .j-strip{ border-top:5px solid #22224a; display:flex; align-items:center; flex:none; }
  .st-projekt .j-cell{ display:flex; align-items:center; white-space:nowrap; }
  .st-projekt .j-cell .a{ font-weight:700; }
  .st-projekt .j-cell .b{ color:#5a5e8c; }

  .clockbox{ display:flex; align-items:center; gap:.55em; font-size: calc(var(--tile-w) * 1.02); }
  .lamp{ display:block; width:.34em; height:.34em; border-radius:50%; flex:none;
    box-shadow: inset 0 0 3px rgba(0,0,0,.55), 0 0 .22em currentColor; }
  .lamp[hidden]{ display:none; }
  .lamp.ok{ background:#46b96a; color:#46b96a; }
  .lamp.delayed{ background:#e8a33d; color:#e8a33d; }
  .lamp.down{ background:#d8402e; color:#d8402e; }
  .lamp.wait{ background:#8f8c82; color:#8f8c82; }
  /* Fixed TV canvas: the board is always the television's own
     3840x2160 picture, aspect locked. fitStage() scales the whole
     stage to fit whatever screen shows it; the pure black ground
     takes any difference in shape. Never a relayout per viewport. */
  #board{ position:absolute; left:0; top:0; width:3840px; height:2160px; transform-origin:0 0; }
  #lampwrap{ position:absolute; top: calc(var(--pad-y, 2vh) * 0.30); right: var(--pad-x, 2vw);
    z-index:6; pointer-events:none; font-size: calc(var(--tile-w, 18px) * 1.02); }

  /* ============ The demo television page ============
     The board's own CSS above is the live page's, verbatim; what
     follows is this page alone: the plain black page, the one
     television component, and its line. */
  body{ height: auto; overflow: visible; }
  .page{ min-height: 100vh; display: flex; align-items: center; justify-content: center;
         padding: 24px 16px; font-family: "Roboto Mono", ui-monospace, monospace; }
  .tvx{ width: min(1134px, 96vw, calc((100vh - 140px) * 1.78)); margin: 0 auto; }
  .tvx .tv{ width: 100%; margin: 0; }
  .tvx .tv-frame{ background: #101013; border: 1px solid #26262b; border-radius: 20px; padding: 16px;
                  box-shadow: 0 30px 60px -30px rgba(0,0,0,.9); }
  .screen{ position: relative; background: #000; margin: 0 auto; overflow: hidden;
           border-radius: 8px; aspect-ratio: 16 / 9; }
  .tvx .tv-neck{ width: 110px; height: 24px; margin: 0 auto; background: #101013; }
  .tvx .tv-stand{ height: 7px; max-width: 430px; margin: 0 auto; background: #1b1b1f; border-radius: 4px; }
  .tvx-line{ display: flex; flex-direction: row; justify-content: space-between; align-items: flex-start;
             gap: 12px; margin: -26px auto 0; }
  /* the line's colours are the Systems Status console palette, the
     page ground being that same near black: its muted secondary text
     #7d8590 for the word, the separator and the icons at rest, its
     primary text #c9cfd6 for the board name and the hover state */
  .tvx .cap-name{ margin-left: 29px; padding-top: 15px; font-size: 12px; letter-spacing: .2em;
                  text-transform: uppercase; color: #7d8590; white-space: nowrap; }
  .tvx .cap-name b{ color: #c9cfd6; font-weight: 700; }
  /* the controls sit in from the right as the word sits in from the
     left: the icon is centred in its 44px target (14.5px each side),
     so a 14.5px right margin puts the rightmost icon's edge 12px
     inside the screen's right edge (frame border 1px + padding 16px
     + 12px), mirroring the word's 12px past the screen's left edge */
  .tvx-controls{ display: flex; justify-content: flex-end; align-items: flex-start; gap: 8px; flex-wrap: wrap; margin: 0 14.5px 0 0; }
  .tvx-ctl{ background: none; border: none; border-radius: 0; padding: 0; min-width: 44px; min-height: 44px;
            display: inline-flex; align-items: center; justify-content: center; cursor: pointer;
            color: #7d8590; font-family: inherit; }
  .tvx-ctl:hover{ color: #c9cfd6; }
  .tvx-ico{ width: 15px; height: 15px; flex: none; display: block; }
  .tvx-ctl .ico-off{ display: none; }
  .tvx-ctl[data-on="false"] .ico-on{ display: none; }
  .tvx-ctl[data-on="false"] .ico-off{ display: block; }
  /* the bare serving's word is LIVE, and it breathes: a soft glow
     swelling and receding around letters that stay fully legible,
     never snapping off. Under reduced motion it rests steady. */
  .tvx .cap-name .live-word{ animation: livebreath 2s ease-in-out infinite; }
  @keyframes livebreath{
    0%, 100%{ text-shadow: 0 0 0 rgba(201,207,214,0); }
    50%{ text-shadow: 0 0 9px rgba(201,207,214,.8), 0 0 20px rgba(201,207,214,.32); }
  }
  @media (prefers-reduced-motion: reduce){
    .tvx .cap-name .live-word{ animation: none; text-shadow: none; }
  }
  /* the line rides up beside the stand; where the caption or the
     controls would reach the stand at that raised position, the
     line rests under the stand instead, its top 5px below the
     stand's foot. The choice is made by measurement in the page's
     wiring (fitLine), not by a width breakpoint, so it holds for
     any caption length at any size. */
  .tvx-line.rest{ margin-top: 5px; }
</style>
</head>
<body>
<div class="page">
  <div class="tvx">
    <div class="tv">
      <div class="tv-frame">
        <div class="screen" id="demo-screen">
<main id="board" aria-label="Departures board">
  <header>
    <div class="title" id="board-title">THE ISLE <span class="dot">·</span> DEPARTURES</div>
    <div class="clockbox"><span id="lamp" class="lamp ok" hidden></span><div class="clock" id="clock">--:--</div></div>
  </header>
  <div class="colheads" id="colheads"></div>
  <div id="rows"></div>
  <div id="colour" aria-label="Colour board picture"></div>
  <div id="pixcap" aria-label="Next departure"></div>
  <div id="styled" aria-label="Styled board"></div>
  <div id="lampwrap" hidden></div>

/* Append any missing demo boards to a config; never overwrite a user's board.
   Sets liveBoardId only when it is missing or dangling (fresh/empty library). */
function mergeSeeds(cfg){
  if(!cfg || typeof cfg !== "object") cfg = {};
  if(!cfg.boards || typeof cfg.boards !== "object") cfg.boards = {};
  var wasEmpty = Object.keys(cfg.boards).length === 0;
  var changed = false;
  var demos = demoBoards();
  if((cfg.seedVersion || 0) < SEED_VERSION){
    demos.forEach(function(sb){
      var nameTaken = Object.keys(cfg.boards).some(function(id){ return cfg.boards[id].name === sb.name; });
      if(nameTaken) return;
      /* A seed board the user deleted stays deleted: its id is on
         the configuration's deletedSeeds record, and the merge
         never resurrects it. */
      if((cfg.deletedSeeds || []).indexOf(sb.id) >= 0) return;
      if(cfg.boards[sb.id]){ sb.id = sb.id + "-seed"; }
      cfg.boards[sb.id] = sb; changed = true;
    });
    cfg.seedVersion = SEED_VERSION; changed = true;
  }
  /* Field fill-ins for boards stored before kind existed, and the row
     count upgrade: boards stored before the fill rework may carry a
     size value; it is dropped here, because row count is now computed
     from the screen, never stored. User boards and their edits are
     never overwritten. */
  Object.keys(cfg.boards).forEach(function(id){
    var b = cfg.boards[id];
    if(!b) return;
    if(!b.type){ b.type = "departures"; changed = true; }
    if("rows" in b){ delete b.rows; changed = true; }
    if(b.type !== "colour" && !b.kind){
      b.kind = b.shows === "arrivals" ? "arrivals" : "departures"; changed = true;
    }
    if(b.type === "colour" && !b.scene){ b.scene = "walk"; changed = true; }
    if(b.type === "colour" && !(b.night >= 1 && b.night <= 8)){ b.night = 8; changed = true; }
    if(!b.style){ b.style = "isle"; changed = true; }
    if(!b.sceneSounds){ b.sceneSounds = { on:false, level:0.5 }; changed = true; }
    if(!b.flights){ b.flights = []; changed = true; }
    if(!b.lines){ b.lines = []; changed = true; }
  });
  /* The Isle wording migration (user decision, Nov 28, 2026): the
     seed texts that called The Isle a house take The Isle forms in
     stored configurations too. Exact matches only, on the boards
     that carry those seed texts; a board the user has renamed or
     edited carries different strings and is left entirely alone.
     Idempotent: once migrated, no old string remains to match. */
  var migToday = cfg.boards["board-today"];
  if(migToday){
    if(migToday.name === "Today at the House"){ migToday.name = "Today at The Isle"; changed = true; }
    if(migToday.customTitle === "TODAY AT THE HOUSE"){ migToday.customTitle = "TODAY AT THE ISLE"; changed = true; }
  }
  [["board-storm", "HOUSE PLAN \u00b7 OWNER TEXT", "THE ISLE PLAN \u00b7 OWNER TEXT"],
   ["board-welcome", "WI-FI AND HOUSE NOTES: ASK ANY OF US", "WI-FI AND ISLE NOTES: ASK ANY OF US"]].forEach(function(m){
    var mb = cfg.boards[m[0]];
    if(!mb || !mb.lines) return;
    mb.lines.forEach(function(l){
      if(l && l.text === m[1]){ l.text = m[2]; changed = true; }
    });
  });
  if(!cfg.liveBoardId || !cfg.boards[cfg.liveBoardId]){
    cfg.liveBoardId = (wasEmpty && cfg.boards["board-terminal-one"])
      ? "board-terminal-one" : Object.keys(cfg.boards)[0];
    changed = true;
  }
  return { cfg: cfg, changed: changed };
}
function loadConfig(){
  var parsed = null;
  try{
    var raw = localStorage.getItem(CFGKEY);
    if(raw) parsed = JSON.parse(raw);
  }catch(e){}
  var res = mergeSeeds(parsed);
  if(res.changed || !parsed){
    try{ localStorage.setItem(CFGKEY, JSON.stringify(res.cfg)); }catch(e){}
  }
  return res.cfg;
}

/* ============ Carousels ============
   A carousel in the shared configuration rotates the live slot
   through its boards: each board shows for the carousel's interval,
   then the next takes over with the board's normal cascade, looping
   back to the first. The position is worked out from the clock
   alone, so the page never reloads and every screen showing the
   carousel agrees on which board is up. Each board keeps its own
   sounds, style and settings while it is up, unless the carousel
   carries a sound override: then a merged view (the member's
   content and style, the carousel's sound fields) is what plays,
   and the stored member board is never modified. Quiet hours and
   the service lamp follow whichever board is up, as they do for a
   single live board. Publishing a single board clears the live
   carousel, and the rotation stops. */
var carousel = null;
function fillBoardFields(nb){
  if(!nb.type) nb.type = "departures";
  if("rows" in nb) delete nb.rows;
  if(nb.type !== "colour" && !nb.kind) nb.kind = nb.shows === "arrivals" ? "arrivals" : "departures";
  if(!nb.flights) nb.flights = [];
  if(!nb.lines) nb.lines = [];
  if(nb.type === "colour" && !nb.scene) nb.scene = "walk";
  if(nb.type === "colour" && !(nb.night >= 1 && nb.night <= 8)) nb.night = 8;
  if(!nb.style) nb.style = "isle";
  if(!nb.sceneSounds) nb.sceneSounds = { on: false, level: 0.5 };
}
function carouselFrom(cfg){
  if(!cfg) return null;
  var cid = cfg.liveCarouselId;
  if(!cid || !cfg.carousels || !cfg.carousels[cid]) return null;
  var def = cfg.carousels[cid];
  var list = (def.boardIds || []).map(function(id){ return cfg.boards[id]; }).filter(Boolean);
  if(!list.length) return null;
  list.forEach(fillBoardFields);
  return { def: def, list: list, intervalSec: Math.max(10, Math.min(3600, +def.intervalSec || 30)), idx: -1 };
}
function carouselIdx(car){ return Math.floor(Date.now() / (car.intervalSec * 1000)) % car.list.length; }
function effectiveBoard(member, car){
  if(car && car.def.soundOverride && car.def.soundOverride.on && car.def.soundOverride.sound){
    var snd = car.def.soundOverride.sound;
    var m = {};
    for(var k in member) m[k] = member[k];
    ["clackSet", "ambience", "voice", "signal", "announcements", "quietHours", "sceneSounds"].forEach(function(k){
      if(snd[k] !== undefined) m[k] = JSON.parse(JSON.stringify(snd[k]));
    });
    return m;
  }
  return member;
}
function showCarouselBoard(car, idx){
  board = effectiveBoard(car.list[idx], car);
  fitBoard();
  if(AC){ applyLevels(); loadSet(board.clackSet); setupBed(); }
  if(evtNow) stopEvent(true);
  armFirstPa();
  armFirstClack();
  wasQuiet = inQuietHours();
  renderBoardWhenReady();
  renderLamp();
}
carousel = carouselFrom(config);
if(carousel){
  carousel.idx = carouselIdx(carousel);
  board = effectiveBoard(carousel.list[carousel.idx], carousel);
}
setInterval(function(){
  if(!carousel) return;
  var idx = carouselIdx(carousel);
  if(idx !== carousel.idx){ carousel.idx = idx; showCarouselBoard(carousel, idx); }
}, 1000);

/* ============ Flap machinery ============ */
var RING = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-·:";
function ringIdx(ch){ var i = RING.indexOf(ch); return i < 0 ? 0 : i; }
function cleanRaw(text){
  text = String(text == null ? "" : text).toUpperCase();
  var out = "";
  for(var i=0;i<text.length;i++) out += RING.indexOf(text[i]) >= 0 ? text[i] : " ";
  return out;
}
function clean(text, len){
  text = String(text == null ? "" : text).toUpperCase();
  var out = "";
  for(var i=0;i<text.length;i++) out += RING.indexOf(text[i]) >= 0 ? text[i] : " ";
  return (out + " ".repeat(len)).slice(0, len);

function drawLevel(g, W, H, st, t, dt){
  var i; for(i = 0; i < W * H; i++) g[i] = SKY;
  var TS = Math.max(3, Math.round(H / LV_TILES_Y));
  var gy = 7 * TS;
  if(!st.lv) st.lv = { off: 0, wy: 0, vy: 0, air: false, shellWX: 30 * TS, shellV: 0 };
  var s = st.lv;
  /* --- physics, in tile units --- */
  var spd = 3.0; /* tiles per second */
  s.off += spd * TS * dt;
  var wxT = (s.off + W * 0.22) / TS; /* walker world x, tiles */
  var frontTx = Math.floor(wxT + 0.9);
  if(!s.air){
    if(lvGroundTop(frontTx) < 0){ s.air = true; s.vy = 0; }
    else if(lvGroundTop(Math.floor(wxT + 1.6)) < 0){ s.air = true; s.vy = -12.5; }
  }
  if(s.air){
    s.wy += s.vy * dt; s.vy += 20 * dt;
    if(s.wy >= 0){
      if(lvGroundTop(frontTx) >= 0){ s.wy = 0; s.air = false; s.vy = 0; }
      else if(s.wy > 3){ s.wy = 0; s.vy = -12.5; } /* safety hop over a long fall */
    }
  }
  var walkerWX = s.off + W * 0.22;
  if(s.shellV > 0.4 * TS){
    s.shellWX += s.shellV * dt;
    s.shellV *= Math.pow(0.35, dt);
    var stx = Math.floor((s.shellWX + 6) / TS);
    if(lvTile(stx, 6) || lvPit(stx)) s.shellV = 0;
  } else if(!s.air && walkerWX + 9 >= s.shellWX && walkerWX < s.shellWX + 4 && s.shellWX < LV_WORLD * TS - 20 * TS){
    s.shellV = 7 * TS;
  }
  if(lvPit(Math.floor(s.shellWX / TS)) && s.shellV <= 0.4 * TS) s.shellWX = walkerWX + 42 * TS;
  if(s.off > LV_WORLD * TS - W - TS){ s.off = 0; s.shellWX = 30 * TS; s.shellV = 0; s.wy = 0; s.air = false; }
  /* --- scenery behind the tiles --- */
  var off = s.off;
  hill(g, W, H, Math.round(6 * TS - off), gy, 6 * TS, Math.round(H * 0.34), "#00a800", "#007800");
  hill(g, W, H, Math.round(60 * TS - off), gy, 4 * TS, Math.round(H * 0.20), "#00a800", "#007800");
  var cw2 = [[8, 1], [30, 0], [58, 1], [84, 0], [120, 1], [150, 0]];
  for(i = 0; i < cw2.length; i++)
    cloud(g, W, H, Math.round(cw2[i][0] * TS - off + TS / 2), Math.round(cw2[i][1] * TS + TS * 0.6), Math.max(0.8, TS / 3.4), "#fcfcfc");
  var bushX = [12, 66, 112];
  for(i = 0; i < bushX.length; i++)
    ellipse(g, W, H, Math.round(bushX[i] * TS - off), gy - 1, Math.round(TS * 1.6), Math.max(1, Math.round(TS * 0.55)), "#00a800");
  /* --- tiles --- */
  var tx0 = Math.floor(off / TS);
  for(var tx = tx0; tx <= tx0 + Math.ceil(W / TS) + 1; tx++){
    for(var ty = 0; ty < LV_TILES_Y; ty++){
      var kind = lvTile(tx, ty);
      if(kind) lvTileDraw(g, W, H, Math.round(tx * TS - off), ty * TS, TS, kind);
    }
  }
  /* --- flag --- */
  var flagX = Math.round(146 * TS - off + TS / 2);
  if(flagX > -8 && flagX < W + 8){
    rect(g, W, H, flagX, TS, 1, gy - TS, "#0c930c");
    circle(g, W, H, flagX, TS - 1, 1, "#f8b800");
    for(var fr = 0; fr < 4; fr++) rect(g, W, H, flagX - 1 - (3 - fr), TS + 1 + fr, 1, 1, "#00a800");
    rect(g, W, H, flagX - 2, TS + 4, 3, 1, "#00a800");
  }
  /* --- shell and walker --- */
  var shellSX = Math.round(s.shellWX - off);
  if(shellSX > -10 && shellSX < W + 4) stamp(g, W, H, SHELL_SM, SHELL_PAL, shellSX, gy - 5);

  var frame = (Math.floor(t * 8) % 2 === 0) ? RUNNER_A : RUNNER_B;

function stampMark(g, W, H, cx, baseY, wCells, colI, colT, colC, swayAmp, t, spd){
  var hCells = Math.max(4, Math.round(wCells * MARK_H / MARK_W));
  var x0 = Math.round(cx - wCells / 2), y0 = baseY - hCells + 1;
  for(var dy = 0; dy < hCells; dy++){
    var frac = hCells <= 1 ? 0 : (hCells - 1 - dy) / (hCells - 1); /* 0 at the shore, 1 at the crown top */
    var shift = Math.round(Math.sin(t * spd + frac * 2.0) * swayAmp * frac * frac);
    var sy0 = Math.floor(dy * MARK_H / hCells), sy1 = Math.max(sy0 + 1, Math.floor((dy + 1) * MARK_H / hCells));

      var sx0 = Math.floor(dx * MARK_W / wCells), sx1 = Math.max(sx0 + 1, Math.floor((dx + 1) * MARK_W / wCells));
      var cC = 0, cT = 0, cI = 0, tot = 0;
      for(var sy = sy0; sy < sy1 && sy < MARK_H; sy++){
        var row = MARK_ROWS[sy];
        for(var sx = sx0; sx < sx1 && sx < MARK_W; sx++){
          var ch = row.charAt(sx); tot++;
          if(ch === "C") cC++; else if(ch === "T") cT++; else if(ch === "I") cI++;
        }
      }
      if(!tot) continue;
      var fC = cC / tot, fT = cT / tot, fI = cI / tot, col = null;
      if(fC >= 0.13 && fC >= fT && fC >= fI) col = colC;
      else if(fT >= 0.13 && fT >= fI) col = colT;
      else if(fI >= 0.34) col = colI;
      if(col) put(g, W, H, x0 + dx + shift, y0 + dy, col);
    }
  }
  return hCells;
}

function drawPalm(g, W, H, st, t, P){
  var horizon = Math.round(H * 0.64), x, y, i;
  for(y = 0; y < horizon; y++){
    var f = y / Math.max(1, horizon - 1);
    g[y * W] = P.sky[0];
    var c = f < 0.5 ? P.sky[0] : P.sky[1];
    if(f >= 0.82) c = P.sky[2];
    for(x = 0; x < W; x++) g[y * W + x] = c;
  }
  if(P.stars){
    for(i = 0; i < 260; i++){
      var sx = Math.floor(H2(i * 3.7) * W), sy = Math.floor(H2(i * 9.1) * horizon * 0.92);
      if(H2(i * 1.3 + Math.floor(t * 1.6)) > 0.35) put(g, W, H, sx, sy, "#dfe8f4");
    }
  }
  if(P.sun){
    var scx = Math.round(W * P.sun[0]);
    var scy = P.sun[1] < 0 ? horizon - Math.round(H * P.sun[3]) + 2 : Math.round(H * P.sun[1]);
    circle(g, W, H, scx, scy, Math.max(2, Math.round(H * P.sun[3])), P.sun[2]);
    circle(g, W, H, scx, scy, Math.max(1, Math.round(H * P.sun[3] * 0.62)), "#fff6c8");
  }
  if(P.moon){
    circle(g, W, H, Math.round(W * 0.82), Math.round(H * 0.16), Math.max(2, Math.round(H * 0.07)), "#e8ecf2");
    circle(g, W, H, Math.round(W * 0.82) + Math.max(1, Math.round(H * 0.03)), Math.round(H * 0.16) - 1, Math.max(1, Math.round(H * 0.055)), P.sky[1]);
  }
  if(P.rainbow){
    var rcx = Math.round(W * 0.74), rb = ["#d86a5e", "#e89a4e", "#ecd06a", "#6ab46a", "#5e8ad8"];
    for(var b2 = 0; b2 < 5; b2++){
      var rr = H * (0.52 + b2 * 0.045);
      for(var a2 = Math.PI * 1.02; a2 < Math.PI * 1.98; a2 += 0.012)
        put(g, W, H, Math.round(rcx + rr * Math.cos(a2)), Math.round(horizon + rr * Math.sin(a2) * 0.62), rb[b2]);
    }
  }
  var cw = W + 30;
  for(i = 0; i < P.clouds; i++){
    var ccx = Math.round(((t * P.cspd * (1.6 + i * 0.7) + i * W * 0.37) % cw) - 15);
    var ccy = Math.round(H * 0.10 + (i % 3) * H * 0.085);
    cloud(g, W, H, ccx, ccy, Math.max(0.7, W / 60), P.cloudC);
  }
  for(y = horizon; y < H; y++){
    var wf = (y - horizon) / Math.max(1, H - horizon - 1);
    var wc = wf < 0.34 ? P.water[0] : (wf < 0.75 ? P.water[1] : P.water[1]);
    for(x = 0; x < W; x++) g[y * W + x] = wc;
  }
  /* sun or moon glitter path on the water */
  if(P.sun || P.moon){
    var gx = Math.round(W * (P.sun ? P.sun[0] : 0.82));
    for(y = horizon + 1; y < H; y++){
      var gw = 1 + Math.round((y - horizon) * 0.35);
      for(x = gx - gw; x <= gx + gw; x++)
        if(H2(x * 3.3 + y * 17.7 + Math.floor(t * 2.5) * 41) > 0.62) put(g, W, H, x, y, P.water[2]);
    }
  }
  /* general shimmer, drifting */
  for(y = horizon + 1; y < H; y++)
    for(x = 0; x < W; x++)
      if(H2(x * 1.9 + y * 23.3 + Math.floor(t * 2.2) * 67) > 0.955) put(g, W, H, x, y, P.water[2]);
  /* the island and palm are the Isle mark itself, traced from the
     master artwork and stamped by stampMark: the island in the
     scene's sand, the trunk and crown in the scene's own colours */
  var ix = Math.round(W * 0.52), irx = Math.round(W * 0.155), iry = Math.max(2, Math.round(H * 0.05));
  var markW = Math.round(W * 0.54);
  stampMark(g, W, H, ix, horizon + iry, markW, P.sand, P.trunk, P.frond, W * 0.006 * P.wind, t, P.wspd * 1.4);
  /* shimmer rings running around the island */
  for(var ring = 0; ring < 2; ring++){
    var phase = ((t * 0.45 + ring * 0.5) % 1);
    var rrx = irx + 2 + phase * W * 0.05, rry = iry + 1 + phase * H * 0.03;
    for(var a3 = 0; a3 < Math.PI * 2; a3 += 0.05){
      if(H2(Math.floor(a3 * 9) + Math.floor(t * 3)) > 0.4)
        put(g, W, H, Math.round(ix + rrx * Math.cos(a3)), Math.round(horizon + 1 + rry * Math.sin(a3)), P.water[2]);
    }
  }
  if(P.rain){
    var drops = W;
    for(i = 0; i < drops; i++){
      var dx = Math.floor(H2(i * 13.7) * W);
      var dy = Math.floor((H2(i * 7.3) * H + t * H * 1.35 * (0.8 + H2(i * 3.1) * 0.4)) % H);
      put(g, W, H, dx, dy, "#a8c8d8"); put(g, W, H, dx - 1, dy + 1, "#a8c8d8");
    }
  }
  if(P.mist){
    for(var mb = 0; mb < 3; mb++){
      var byy = horizon - 2 - mb * Math.round(H * 0.13) + Math.round(Math.sin(t * 0.3 + mb * 1.7) * 1.5);
      for(y = byy; y < byy + 3 && y >= 0 && y < H; y++)
        for(x = 0; x < W; x++)
          if(H2(x * 5.1 + y * 31.7 + Math.floor(t * 2)) > 0.22) put(g, W, H, x, y, "#dfe6e6");
    }
  }
  if(P.lightning){
    if(t > st.nextFlash){ st.flashStart = t; st.nextFlash = t + 4 + H2(t * 7.7) * 6; }
    var ft = t - st.flashStart;
    if(ft < 0.09 || (ft > 0.16 && ft < 0.30)){
      for(y = 0; y < horizon; y++) for(x = 0; x < W; x++) g[y * W + x] = "#c8d4de";
      var bx = Math.round(W * (0.2 + H2(Math.floor(st.flashStart * 10)) * 0.5)), byy2 = Math.round(H * 0.10);
      var seg = (horizon - byy2) / 6;
      for(var bs = 0; bs < 6; bs++){
        var nx = bx + Math.round((H2(bs * 3.3 + st.flashStart) - 0.5) * W * 0.035);
        line(g, W, H, bx, Math.round(byy2 + bs * seg), nx, Math.round(byy2 + (bs + 1) * seg), "#ffffff", 0);
        bx = nx;
      }
    }
  }
}

    return effLines().map(function(l){
      return { time: "", destination: String(l.text || "").toUpperCase(), flight: "", gate: "", remarks: "", black: !!l.black };
    });
  }
  return effFlights().map(function(f){
    return { time: f.time || "", destination: String(f.destination || "").toUpperCase(), flight: f.flight || "", gate: f.gate || "", remarks: String(f.remarks || "").toUpperCase(), black: !!f.black };
  });
}
var RING_LO = " abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-·:";
function stFlipTiles(jobs, opts){
  opts = opts || {};
  var ring = opts.ring || RING, stepMs = opts.stepMs || 85;
  var quiet = inQuietHours();
  jobs.forEach(function(j){
    if(!j.el) return;
    var from = j.el.dataset.ch || " ";
    var fi = ring.indexOf(from); if(fi < 0) fi = 0;
    var ti = ring.indexOf(j.to); if(ti < 0) ti = 0;
    var steps = (ti - fi + ring.length) % ring.length;
    if(steps === 0){ j.el.textContent = j.to; j.el.dataset.ch = j.to; return; }
    stTimeout(function(){
      var pos = fi, remaining = steps, pan = elPan(j.el);
      var iv = setInterval(function(){
        pos = (pos + 1) % ring.length;
        j.el.textContent = ring[pos];
        j.el.classList.remove("flip"); void j.el.offsetWidth; j.el.classList.add("flip");
        var idx = steps - remaining;
        if(opts.sound && !quiet){
          if(steps > 24 && remaining > 3){ if(idx === 0) playRunSegment(pan); }
          else if(Math.random() > 0.4) playStep(pan);
        }
        if(--remaining <= 0){
          clearInterval(iv);
          j.el.textContent = j.to; j.el.dataset.ch = j.to;
          if(opts.sound && !quiet) playFlap(pan);
        }
      }, stepMs);
      styledState.ivs.push(iv);
    }, j.delay || 0);
  });
}
function showStyled(st, cascade){

var G_CHARSET = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:.-/&'";

function gWrap(text, width){
  text = String(text || "").replace(/\s+/g, " ").trim();
  if(!text) return [];
  var words = text.split(" "), lines = [], cur = "";
  words.forEach(function(w){
    while(w.length > width){ if(cur){ lines.push(cur); cur = ""; } lines.push(w.slice(0, width)); w = w.slice(width); }

    else if(cur.length + 1 + w.length <= width) cur += " " + w;
    else { lines.push(cur); cur = w; }
  });

}
function gCells(text){

}
function gCompose(){
  var rows = [];

    if(f.black){ rows.push(""); return; }

    var wrapped = gWrap(s.toUpperCase(), 22);
    if(!wrapped.length) wrapped = [""];
    /* orphan control: a flight never leaves a stub of three characters
       or fewer alone on its last wrapped row when the row above can
       spare its last word */
    if(wrapped.length > 1 && wrapped[wrapped.length - 1].length <= 3){
      var prevWords = wrapped[wrapped.length - 2].split(" ");
      if(prevWords.length > 1){
        var cand = prevWords[prevWords.length - 1] + " " + wrapped[wrapped.length - 1];
        if(cand.length <= 22){
          wrapped[wrapped.length - 2] = prevWords.slice(0, -1).join(" ");
          wrapped[wrapped.length - 1] = cand;

  });

  for(i = 0; i < rows.length; i += 5) pages.push(rows.slice(i, i + 5));
  if(!pages.length) pages.push([]);

  if(boardKind() === "weather" && data.length){ notice = data[data.length - 1].destination.slice(0, 22); lead = "O"; }
  if(boardKind() === "art"){ notice = "MADE OF FLAPS"; lead = "R"; }

    var pr = [];
    for(var r = 0; r < 5; r++) pr.push(gCells(pg[r] || ""));
    return { rows: pr, notice: { text: notice, lead: lead } };
  });
  if(boardKind() === "art"){
    var art = [".....RRR.RRR..........", "....RRRRRRRRR.........", "....RRRRRRRRR.........", ".....RRRRRRR..........", "......RRR............."];
    out.push({
      rows: art.map(function(s){ return s.split("").map(function(ch){ return ch === "R" ? { t: "col", v: "R" } : { t: "ch", v: " " }; }); }),
      notice: { text: "MADE OF FLAPS", lead: "R" }

function gSetCell(el, tg){

var gLastTick = 0;

     measured as built, and the panel's own padding and foot are
     accounted in the height budget with a small safety allowance
     (a plaque measured before its fonts settle can grow a little),

/* Clipper's fixed height, priced component by component from the
   rendered board (see the note in buildClipper): everything except
   the rows themselves, for a given bank count and row count. */
function clipperFixedH(W, H, nBanks, nRows){
  return H * 0.048 + W * 0.030 + H * 0.010 + W * 0.0095 * 1.16
    + nBanks * (H * 0.016 + W * 0.0085 * 1.16 + H * 0.008 + W * 0.0075 * 1.16 + H * 0.006)

   completed by blank rows at the standard gap. */

/* ---------- Scene sounds: waves under every palm, rain and thunder ----------
   A separate bus on the ambience pattern: its own switch and level in the
   board's sound configuration, off by default, 3 s class fade-in and 2 s
   fade-out, ducked with the bed under announcements and cascades, and
   silenced by quiet hours. Loops are minutes long and seamless. */
var sceneBus = null, sceneTarget = 0, sceneDuckF = 1, sceneEls = [], sceneKey = "";
var PALM_SCENES = ["palm", "palm-night", "palm-sunrise", "palm-sunset", "palm-cloudy", "palm-rain", "palm-storm", "palm-rainbow", "palm-mist"];
function sceneSoundFiles(){
  if(!board.sceneSounds || !board.sceneSounds.on) return null;
  var sc = boardStyle() === "flappix" ? "pix" : (board.scene || "");
  if(board.type !== "colour" && boardStyle() !== "flappix") return null;
  if(PALM_SCENES.indexOf(sc) < 0) return null;
  var files = ["../assets/audio/scenes/scene-waves.mp3"];
  if(sc === "palm-rain") files.push("../assets/audio/scenes/scene-rain.mp3");
  if(sc === "palm-storm") files.push("../assets/audio/scenes/scene-thunder.mp3");

function updateSceneSounds(qNow){
  if(!AC) return;
  if(!sceneBus){ sceneBus = AC.createGain(); sceneBus.gain.value = 0; sceneBus.connect(compNode || AC.destination); }
  var want = qNow ? null : sceneSoundFiles();
  var lvl = board.sceneSounds ? (board.sceneSounds.level || 0) : 0;
  var key = want ? want.join(",") + "|" + lvl : "";
  if(key === sceneKey){
    sceneTarget = want ? lvl * 0.9 : 0;
    sceneBus.gain.setTargetAtTime(sceneTarget * sceneDuckF, AC.currentTime, 0.8);
    return;
  }
  sceneKey = key;
  var old = sceneEls; sceneEls = [];
  old.forEach(function(rec){
    try{
      rec.gain.gain.setTargetAtTime(0, AC.currentTime, 0.6);
      var el = rec.el;
      setTimeout(function(){ try{ el.pause(); }catch(e){} }, 2200);
    }catch(e){}
  });
  if(want){
    want.forEach(function(url){
      var el = new Audio(); el.src = url; el.loop = true; el.preload = "auto";
      var src = AC.createMediaElementSource(el);
      var gn = AC.createGain(); gn.gain.value = 0;
      src.connect(gn); gn.connect(sceneBus);
      el.play().catch(function(){});
      gn.gain.setTargetAtTime(1, AC.currentTime + 0.1, 1.0);
      sceneEls.push({ el: el, gain: gn });
    });

  sceneBus.gain.setTargetAtTime(sceneTarget * sceneDuckF, AC.currentTime, 1.0);

/* ============ Fit the board to the screen ============ */
/* Board insets: the board box sits INSIDE the viewport on every side, in
   windowed and fullscreen modes alike. 2% of width at left/right and 2.5%
   of height at top/bottom: past the ~1.5%/2% design target, the extra
   ~0.5% is the allowance for TV overscan (many sets crop 1-3% of the
   picture in their default picture mode), so the outermost tiles and the
   header stay on the visible glass even with modest overscan. */
var INSET_X = 0.02, INSET_Y = 0.025;
function boardPads(fs, iw, ih){
  return { x: fs ? iw * 0.006 : iw * 0.012, y: fs ? ih * 0.008 : ih * 0.014 };
}
function fitColour(){
  colourDims();
  var root = document.documentElement;
  var iw = VW, ih = VH;
  var fs = !!document.fullscreenElement;
  var pad = boardPads(fs, iw, ih);
  root.style.setProperty("--pad-x", pad.x + "px");
  root.style.setProperty("--pad-y", pad.y + "px");
  var g = colourGridFor(boardStyle() === "flappix", iw, ih, fs);
  root.style.setProperty("--px", Math.max(4, g.px) + "px"); /* .px is square: width == height */
  if(pxEls.length && (builtCW !== CW || builtCH !== CH)) buildColour();
}
function fitBoard(){
  var fst = boardStyle();
  if(fst === "flappix" || board.type === "colour"){ fitColour(); return; }
  if(fst !== "isle"){ fitStyled(); return; }
  var root = document.documentElement;
  var fs = !!document.fullscreenElement;
  var iw = VW, ih = VH;
  var rows = boardRows();
  var boardW = iw * (1 - 2 * INSET_X);
  var boardH = ih * (1 - 2 * INSET_Y);
  var pad = boardPads(fs, iw, ih);
  /* The padding is the settled inset PLUS the inner pad. The sizing
     formulas below work inside the frame (iw*(1-2*INSET_X) wide), so
     the frame's edges have to be part of the padding: with the inner
     pad alone the composition starts at the canvas's own edge and
     the whole board sits one inset left of, and above, centre. */
  root.style.setProperty("--pad-x", (iw * INSET_X + pad.x) + "px");
  root.style.setProperty("--pad-y", (ih * INSET_Y + pad.y) + "px");
  /* Tile size in the fill model: the width alone sets it, from the
     columns across the frame, at the FIXED 1.42 aspect (height /
     width) the --tile-h calc holds. The row count is computed from
     that size (boardRows), never the other way round, so tiles are
     never shrunk to make a preset count fit. Leftover height beyond
     whole rows is spread into the row pitch, a fine adjustment only:
     boardRows chose the count that leaves the least of it. */
  var HEADER_ETC = isTextBoard() ? 1.85 : 2.52; /* header block (+ column headings for flight boards), in tile widths */
  var PITCH = 1.53;      /* row pitch incl. base row padding, in tile widths */
  var w = Math.max(4, isleTileW(iw, ih, fs));
  root.style.setProperty("--tile-w", w + "px");
  if(rowsBuilt && builtRowCount !== rows) renderBoard(false);
  /* Tiles that fit across a text-board line at this tile width. Lines
     longer than this are truncated to the grid, never clipped mid-tile. */
  var colsFit = Math.max(8, Math.floor(((boardW - 2 * pad.x) / w + 0.14) / 1.14));
  if(colsFit !== TEXT_COLS){
    TEXT_COLS = colsFit;
    if(rowsBuilt && isTextBoard()) renderBoard(false);
  }
  var rowsAvail = boardH - 2 * pad.y - 2 - HEADER_ETC * w;
  var leftover = Math.max(0, rowsAvail - rows * PITCH * w);
  var rowPad = w * 0.055 + leftover / (rows * 2);
  root.style.setProperty("--row-pad", rowPad + "px");
}
document.addEventListener("fullscreenchange", function(){
  fitBoard();
});
fitBoard();
window.addEventListener("resize", fitBoard);
/* Scale the fixed 3840x2160 stage to fit the showing screen, centred,
   aspect locked; the black ground takes the difference in shape. */
function fitStage(){
  var el = document.getElementById("board");
  if(!el) return;
  var sc = Math.min(demoBoxW() / VW, demoBoxH() / VH);
  var x = Math.round((demoBoxW() - VW * sc) / 2), y = Math.round((demoBoxH() - VH * sc) / 2);
  el.style.transform = "translate(" + x + "px," + y + "px) scale(" + sc + ")";
}

window.addEventListener("resize", fitStage);
document.addEventListener("fullscreenchange", fitStage);

/* ============ Live data layer ============
   Browser-side feeders over free sources only: no keys, no server, so
   the layer works on the public site today and inside the television
   renderer later. It fetches on load and refreshes every 10 minutes.
   Every failure is silent: the board keeps its stored lines and
   remarks. Nothing is drawn on the board to mark live data; the
   display stays clean.
   NOAA stands behind the weather and the water, one roof:
   - Weather for The Isle (Land O'Lakes area, Pasco County, Florida,
     28.2189, -82.4576; coordinates only, no street address anywhere):
     the National Weather Service API, api.weather.gov. A points
     lookup gives the forecast (today's high and low, period wind) and
     the nearest observation stations; the latest observation gives
     current temperature, conditions, wind and humidity. Sunrise and
     sunset are computed locally from the coordinates with the NOAA
     solar algorithm, checked against the published times.
   - Tides for The Isle: NOAA CO-OPS tide predictions, station
     8726917, Anclote Key, southern end. Verified against NOAA's
     station list: the reference station (type R) for the Anclote /
     Tarpon Springs reach, on the Gulf side a short way offshore from
     The Isle. Datum MLLW, high/low intervals, station local time.
   - North Shore: NOAA station 1612668, Haleiwa, Waialua Bay (also
     verified in the station list), same predictions product; NDBC
     buoy 51201, Waimea Bay, realtime text for swell height, dominant
     period, swell direction and water temperature; Haleiwa wind from
     the NWS (Honolulu gridpoint stations, forecast wind as fallback)
     and Haleiwa sunset computed locally like The Isle's.
   Markets, live now on a free feed:
   - The Markets board reads Yahoo's keyless chart feed
     (query2.finance.yahoo.com/v8/finance/chart) from the browser.
     Symbols come from the board's own lines wherever a line begins
     with a ticker; a board with no symbols of its own falls back to
     the house set SPX and DJI (index form) plus AAPL, MSFT and NVDA.
     While live figures show, the board's samples labelling line is
     replaced by a delayed labelling line, because free feeds are
     delayed; when the feed is unreachable the board falls back to its
     stored lines with the samples labelling intact.
   - Alpaca slot (the settled server-side future, unchanged): the
     Markets board's eventual higher grade source is Alpaca Markets'
     IEX feed, which needs the account's API key pair. A secret key
     must never be embedded in these public pages, so nothing here
     calls Alpaca and no key appears anywhere in this build. When a
     server-side feeder on Lighthouse, holding the key, publishes
     market state, it fills this same LIVE.markets map and supersedes
     the Yahoo lines.
   Aircraft, on the free OpenSky feed:
   - One OpenSky Network fetch per cycle over a Southeast region box
     (latitude 23.5 to 32.5, longitude -90.0 to -77.0: Florida and its
     approaches, wide enough to catch Tampa traffic in and out). It
     feeds two boards that were made for live data: the Overhead board
     (the same states filtered to the house box over Pasco County and
     the Tampa Bay approaches, 27.85 to 28.55 N, 82.95 to 82.25 W,
     airborne only) and the Tracked Flights board's remark matching.
     Anonymous tier; the 10 minute cycle stays inside its rate
     limits. OpenSky asks users of its data to credit The OpenSky
     Network (opensky-network.org): the credit lives in this note and
     in the build record, never on the board itself.
   - The tracked-flights principle: the traditional board is a
     composed experience, by design. Live matching NEVER touches the
     traditional departures and arrivals boards or any board's
     composed rows; their flights and remarks stay exactly as written,
     permanently. Live data belongs to the boards made for it. Only
     the Tracked Flights demo board (id board-tracked) has its
     remarks updated, and only for a row whose flight callsign, in
     the board's spoken form (AA 2241, WN 3048), maps to a callsign
     in the feed (AAL2241, SWA3048). Unmatched rows keep their
     composed remark exactly. The house flight IS 808 has no feed
     designator and always stays composed. */
var LIVE = { weather: null, isleTides: null, nsTides: null, nsWx: null,
             buoy: null, region: null, sky: null, markets: null, feeds: {}, sig: "" };
var ISLE_LAT = 28.2189, ISLE_LON = -82.4576;
var NOAA_API = "https://api.tidesandcurrents.noaa.gov/api/prod/datagetter";
var NWS_API = "https://api.weather.gov";
var COMPASS16 = ["N","NNE","NE","ENE","E","ESE","SE","SSE","S","SSW","SW","WSW","W","WNW","NW","NNW"];
function compass16(deg){ if(deg == null || isNaN(deg)) return ""; return COMPASS16[Math.round(deg / 22.5) % 16]; }
function liveGetOnce(url){
  try{
    var ctl = ("AbortController" in window) ? new AbortController() : null;
    var to = ctl ? setTimeout(function(){ ctl.abort(); }, 9000) : null;
    return fetch(url, ctl ? { signal: ctl.signal } : {}).then(function(r){
      if(to) clearTimeout(to);
      return (r && r.ok) ? r.text() : null;
    }).catch(function(){ if(to) clearTimeout(to); return null; });
  }catch(e){ return Promise.resolve(null); }
}
function liveGet(url){
  /* One retry after a short pause: a feed counts as down only when
     both attempts fail on the cycle. */
  return liveGetOnce(url).then(function(t){
    if(t != null) return t;
    return new Promise(function(res){ setTimeout(res, 1200); }).then(function(){ return liveGetOnce(url); });
  });
}
function liveGetJson(url){
  return liveGet(url).then(function(t){
    if(!t) return null;
    try{ return JSON.parse(t); }catch(e){ return null; }
  });
}
function tzDateStr(tz, addDays){
  var d = new Date(Date.now() + (addDays || 0) * 86400000);
  try{
    var y = "", m = "", dd = "";
    new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" })
      .formatToParts(d).forEach(function(p){
        if(p.type === "year") y = p.value;
        if(p.type === "month") m = p.value;
        if(p.type === "day") dd = p.value;
      });
    if(y) return y + "-" + m + "-" + dd;
  }catch(e){}
  return d.toISOString().slice(0, 10);
}
function tzNowMins(tz){
  try{
    var h = 0, m = 0;
    new Intl.DateTimeFormat("en-US", { timeZone: tz, hour12: false, hour: "2-digit", minute: "2-digit" })
      .formatToParts(new Date()).forEach(function(p){
        if(p.type === "hour") h = +p.value;
        if(p.type === "minute") m = +p.value;
      });
    return (h % 24) * 60 + m;
  }catch(e){ var d = new Date(); return d.getHours() * 60 + d.getMinutes(); }
}
function fmtH12(mins){ /* house line style: "5 33 PM" */
  var h = Math.floor(mins / 60), m = mins % 60, ap = h >= 12 ? "PM" : "AM", h12 = h % 12;
  if(h12 === 0) h12 = 12;
  return h12 + " " + pad2(m) + " " + ap;
}
function fmtH24(mins){ return Math.floor(mins / 60) + ":" + pad2(mins % 60); }
function heightTxt(v){ return (Math.round(v * 10) / 10).toFixed(1).replace(".", " "); }

/* Sunrise and sunset, computed locally (NOAA solar algorithm). */
function sunMinutesUTC(lat, lon, y, m, d){
  var doy = Math.floor((Date.UTC(y, m - 1, d) - Date.UTC(y, 0, 0)) / 86400000);
  var lngHour = lon / 15;
  function calc(isRise){
    var t = doy + ((isRise ? 6 : 18) - lngHour) / 24;
    var M = (0.9856 * t) - 3.289;
    var L = (M + 1.916 * Math.sin(M * Math.PI / 180) + 0.020 * Math.sin(2 * M * Math.PI / 180) + 282.634) % 360;
    if(L < 0) L += 360;
    var RA = Math.atan(0.91764 * Math.tan(L * Math.PI / 180)) * 180 / Math.PI;
    RA = (RA + (Math.floor(L / 90) * 90 - Math.floor(RA / 90) * 90)) / 15;
    var sinDec = 0.39782 * Math.sin(L * Math.PI / 180);
    var cosDec = Math.cos(Math.asin(sinDec));
    var cosH = (Math.cos(90.833 * Math.PI / 180) - sinDec * Math.sin(lat * Math.PI / 180)) /
               (cosDec * Math.cos(lat * Math.PI / 180));
    if(cosH > 1 || cosH < -1) return null;
    var H = (isRise ? 360 - Math.acos(cosH) * 180 / Math.PI : Math.acos(cosH) * 180 / Math.PI) / 15;
    var UT = (H + RA - 0.06571 * t - 6.622 - lngHour) % 24;
    if(UT < 0) UT += 24;
    return UT * 60;
  }
  return { rise: calc(true), set: calc(false) };
}
function sunToTz(utcMin, y, m, d, tz){
  if(utcMin == null) return null;
  var h = 0, mi = 0;
  new Intl.DateTimeFormat("en-US", { timeZone: tz, hour12: false, hour: "2-digit", minute: "2-digit" })
    .formatToParts(new Date(Date.UTC(y, m - 1, d) + utcMin * 60000)).forEach(function(p){
      if(p.type === "hour") h = +p.value;
      if(p.type === "minute") mi = +p.value;
    });
  return (h % 24) * 60 + mi;
}
function sunTimesFor(lat, lon, tz){
  var y = 0, m = 0, d = 0;
  new Intl.DateTimeFormat("en-CA", { timeZone: tz, year: "numeric", month: "2-digit", day: "2-digit" })
    .formatToParts(new Date()).forEach(function(p){
      if(p.type === "year") y = +p.value;
      if(p.type === "month") m = +p.value;
      if(p.type === "day") d = +p.value;
    });
  var s = sunMinutesUTC(lat, lon, y, m, d);
  return { rise: sunToTz(s.rise, y, m, d, tz), set: sunToTz(s.set, y, m, d, tz) };
}

/* ---- NOAA tides ---- */
function parseTides(j, tz){
  if(!j || !j.predictions || !j.predictions.length) return null;
  var today = tzDateStr(tz, 0), tomorrow = tzDateStr(tz, 1), nowM = tzNowMins(tz);
  var evs = j.predictions.map(function(p){
    var hm = String(p.t).slice(11, 16).split(":");
    return { date: String(p.t).slice(0, 10), mins: (+hm[0]) * 60 + (+hm[1]),
             type: p.type, v: parseFloat(p.v) };
  });
  var todays = evs.filter(function(e){ return e.date === today; });
  var tomorrowFirst = null, next = null;
  evs.forEach(function(e){
    if(e.date === tomorrow && !tomorrowFirst) tomorrowFirst = e;
    if(!next && (e.date > today || (e.date === today && e.mins > nowM))) next = e;
  });
  return { today: todays, tomorrowFirst: tomorrowFirst, next: next };
}
function fetchTides(station, tz){
  var b = tzDateStr(tz, -1).replace(/-/g, ""), e = tzDateStr(tz, 1).replace(/-/g, "");
  var url = NOAA_API + "?product=predictions&application=isle_board&begin_date=" + b +
            "&end_date=" + e + "&datum=MLLW&station=" + station +
            "&time_zone=lst_ldt&units=english&interval=hilo&format=json";
  return liveGetJson(url).then(function(j){ return parseTides(j, tz); });
}

/* ---- NWS weather ---- */
function nwsCond(text){
  var t = String(text || "").toUpperCase().replace("SLIGHT CHANCE", "CHANCE");
  if(t.length <= 18) return t;
  var words = t.split(" "), out = "";
  for(var i = 0; i < words.length; i++){
    if(out && (out + " " + words[i]).length > 18) break;
    out = out ? out + " " + words[i] : words[i];
  }
  return out || t.slice(0, 18);
}
function parseNwsWind(p){
  var nums = String((p && p.windSpeed) || "").match(/\d+/g);
  var mph = null;
  if(nums && nums.length){
    var sum = 0; nums.forEach(function(n){ sum += +n; });
    mph = sum / nums.length;
  }
  return { dir: String((p && p.windDirection) || ""), kt: mph == null ? null : Math.round(mph * 0.868976) };
}
function fetchNwsBundle(lat, lon){

    return Promise.all([liveGetJson(p.properties.forecast), liveGetJson(p.properties.observationStations)])
      .then(function(res){

        var ids = [];

          res[1].features.slice(0, 3).forEach(function(f){ ids.push(f.properties.stationIdentifier); });
        var chain = Promise.resolve(null);

            if(cur && cur.properties && cur.properties.temperature && cur.properties.temperature.value != null) return cur;
            return liveGetJson(NWS_API + "/stations/" + id + "/observations/latest");

function fetchBuoy(){
  return liveGet("https://www.ndbc.noaa.gov/data/realtime2/51201.txt").then(function(txt){
    if(!txt){ feedMark("buoy", false); return; }
    var rows = txt.split("\n");
    for(var i = 0; i < rows.length; i++){
      var s = rows[i].trim();
      if(!s || s.charAt(0) === "#") continue;
      var c = s.split(/\s+/);
      if(c.length < 15) continue;
      var wvht = parseFloat(c[8]);
      if(isNaN(wvht)) continue; /* keep scanning for a row with a wave report */
      var dpd = parseFloat(c[9]), mwd = parseFloat(c[11]),
          wdir = parseFloat(c[5]), wspd = parseFloat(c[6]), wtmp = parseFloat(c[14]);
      LIVE.buoy = {
        ft: Math.round(wvht * 3.28084),
        period: isNaN(dpd) ? null : Math.round(dpd),
        dir: compass16(mwd),
        windDir: compass16(wdir),
        windKt: isNaN(wspd) ? null : Math.round(wspd * 1.94384),
        wtmpF: isNaN(wtmp) ? null : Math.round(wtmp * 9 / 5 + 32)
      };
      var bts = Date.UTC(2000 + (+c[0]), (+c[1]) - 1, +c[2], +c[3], +c[4]);
      feedMark("buoy", true, (Date.now() - bts) > 3 * 3600 * 1000);
      return;
    }
    /* The buoy answered but no row carries a wave report: the data
       is stale for our purpose, so the feed reads delayed. */
    feedMark("buoy", true, true);
  });

   generator makes its departures from the wall clock alone. It is a

   the same board at the same moment, with no server and no shared

   departures, one every 8 to 12 minutes; at any moment the board
   shows the flights leaving in the next three hours, plus any that
   left in the last ten minutes, marked DEPARTED. Remarks follow the
   revised time: ON TIME or DELAYED beyond 40 minutes out, BOARDING

  { dest: "FRANKFURT",    carrier: "LH", lo: 400,  hi: 999,  gate: "",  glo: 5, ghi: 30, w: 7 },
  { dest: "NEW YORK",     carrier: "B6", lo: 100,  hi: 999,  gate: "",  glo: 1, ghi: 25, w: 9 },
  { dest: "CHARLOTTE",    carrier: "AA", lo: 1000, hi: 1999, gate: "C", glo: 1, ghi: 30, w: 7 },
  { dest: "DALLAS",       carrier: "AA", lo: 1000, hi: 2499, gate: "C", glo: 1, ghi: 30, w: 7 },
  { dest: "HOUSTON",      carrier: "UA", lo: 1000, hi: 1999, gate: "A", glo: 1, ghi: 30, w: 7 },
  { dest: "THE ISLE",     carrier: "IS", lo: 800,  hi: 899,  gate: "",  glo: 1, ghi: 9,  w: 6 },
  { dest: "KEY WEST",     carrier: "IS", lo: 800,  hi: 899,  gate: "",  glo: 1, ghi: 9,  w: 4 },
  { dest: "NASSAU",       carrier: "IS", lo: 800,  hi: 899,  gate: "",  glo: 1, ghi: 9,  w: 4 },
  { dest: "SAN JUAN",     carrier: "IS", lo: 800,  hi: 899,  gate: "",  glo: 1, ghi: 9,  w: 4 },
  { dest: "GRAND CAYMAN", carrier: "IS", lo: 800,  hi: 899,  gate: "",  glo: 1, ghi: 9,  w: 3 }

function simHash(a, b){
  var h = (a >>> 0) ^ 0x9e3779b9;

/* The remark ladder itself, one definition shared by the simulation
   and by composed boards (see the evolution block below): CANCELLED
   before everything; beyond 40 minutes out, DELAYED for a delayed
   flight and ON TIME otherwise; BOARDING inside 40; FINAL CALL
   inside 15; DEPARTED from the departure time. In the simulation a
   flight leaves the board ten minutes after its time; a composed
   line stays on its board, and its clock rolls to the next day's
   departure at that same ten minute mark. */
function simLadder(delta, delayed, cancelled){
  if(cancelled) return "CANCELLED";
  if(delta > 40 * 60000) return delayed ? "DELAYED" : "ON TIME";
  if(delta > 15 * 60000) return "BOARDING";
  if(delta > 0) return "FINAL CALL";
  return "DEPARTED";
}
function simFlightsFor(b, nowMs){
  var now = new Date(nowMs);
  var found = [];
  for(var off = -1; off <= 1; off++){
    var day = new Date(now.getFullYear(), now.getMonth(), now.getDate() + off);
    var dayStart = day.getTime();
    simDayFlights(day).forEach(function(f){
      var depAbs = dayStart + f.depMin * 60000;
      var delta = depAbs - nowMs;
      if(delta <= -10 * 60000 || delta > 3 * 3600000) return;
      var remarks = simLadder(delta, f.delayed, f.cancelled);
      found.push({ depAbs: depAbs, row: { time: simHHMM(depAbs), destination: f.dest,

    });

/* ================= end simulation ================= */
/* ================= Composed remark evolution =================
   A composed departures or arrivals board (stored timed lines, not
   the simulation, not a live-feed board, not the tracked board)
   derives each timed line's remark from the wall clock by time to
   departure, through the simulation's own ladder (simLadder above),
   so the board lives and flips through the day. The stored remark
   carries the flight's character into the ladder: a line stored
   CANCELLED stays CANCELLED, a line stored DELAYED is the ladder's
   delayed flight, and any other ladder status (ON TIME, BOARDING,
   FINAL CALL, DEPARTED, and for arrivals EXPECTED and LANDED) is an
   on-time flight whose remark the clock now speaks for. A timed
   line whose stored remark is none of those words is written text,
   not a status, and keeps it; a line without a parseable time keeps
   its stored remark untouched. The line's time is read as a daily
   time: once a departure is ten minutes past, the next one is
   tomorrow's, exactly where the simulation's DEPARTED window ends,
   so after the last threshold the remark returns to the top of the
   ladder for the next day. Arrivals speak their own standing words
   over the same clock: EXPECTED while an on-time arrival is still
   to come, DELAYED while a delayed one is, and LANDED in the
   DEPARTED slot, from the arrival time through the same ten
   minutes. The evolution is computed at render and on the 30 second
   signature tick; stored board data is never rewritten. */
function ladderRemarkFor(f, kind, nowMs){
  var m = /^(\d{1,2}):(\d{2})$/.exec(String(f.time || "").trim());
  if(!m) return null;

  var delayed = stored.indexOf("DELAYED") === 0;
  var cancelled = stored.indexOf("CANCELLED") === 0;
  if(!cancelled && !delayed
     && ["", "ON TIME", "BOARDING", "FINAL CALL", "DEPARTED", "EXPECTED", "LANDED"].indexOf(stored) < 0)
    return null;
  var now = new Date(nowMs);
  var dep = new Date(now.getFullYear(), now.getMonth(), now.getDate(), +m[1], +m[2]).getTime();
  if(nowMs - dep > 10 * 60000) dep += 24 * 3600000;
  var delta = dep - nowMs;
  if(cancelled) return "CANCELLED";
  if(kind === "arrivals"){
    if(delta <= 0) return "LANDED";
    return delayed ? "DELAYED" : "EXPECTED";
  }
  return simLadder(delta, delayed, false);
}
function evolveFlights(b, rows, nowMs){
  if(!b || b.simulation || b.id === "board-tracked") return rows;
  var kind = b.kind || (b.shows === "arrivals" ? "arrivals" : "departures");
  if(kind !== "departures" && kind !== "arrivals") return rows;
  return rows.map(function(f){
    if(!f || f.black) return f;
    var r = ladderRemarkFor(f, kind, nowMs);
    if(r === null || r === f.remarks) return f;
    var c = {}; for(var k in f) c[k] = f[k]; c.remarks = r; return c;
  });
}
function composedSignature(b, nowMs){
  return evolveFlights(b, (b && b.flights) || [], nowMs).map(function(f){
    return (f.black ? "#" : "") + f.time + " " + f.destination + " " + f.flight + " " + f.gate + " " + f.remarks;
  }).join("|");
}
/* ================= end composed remark evolution ================= */
function effFlights(){
  if(board && board.simulation) return simFlightsFor(board, Date.now());
  if(board && board.id === "board-tracked") return trackedFlights(board);
  return evolveFlights(board, (board && board.flights) || [], Date.now());
