<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Isle · Flight Board</title>
<style>
  :root{
    --tile-w: clamp(18px, 2.05vw, 84px);
    --tile-h: calc(var(--tile-w) * 1.42);
    --gap: calc(var(--tile-w) * 0.14);
    --px: 24px;
    --ink: #f2ede1;
    --amber: #e8a33d;
    --board-bg: #000000;
    --tile-bg: #17181a;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html,body{ background:#000; height:100%; }
  body{
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
  }
  #board{
    background: var(--board-bg);
    padding: var(--pad-y, 2vh) var(--pad-x, 2vw);
  }
  header{
    display:flex; align-items:baseline; justify-content:space-between;
    padding: 0 0 calc(var(--tile-w) * 0.32);
    border-bottom: 1px solid #101011;
    margin-bottom: calc(var(--tile-w) * 0.34);
  }
  header .title{
    font-size: calc(var(--tile-w) * 1.02); line-height: 1.1;
    font-weight: 700; letter-spacing: .34em; text-transform: uppercase;
    white-space: nowrap;
  }
  header .title .dot{ color: var(--amber); letter-spacing: 0; }
  header .clock{
    font-size: calc(var(--tile-w) * 1.02); line-height: 1.1;
    font-weight: 700; letter-spacing: .18em; font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  @media (max-width: 760px){
    header .title{ font-size: 15px; letter-spacing: .16em; }
    header .clock{ font-size: 15px; letter-spacing: .1em; }
    #board{ padding: var(--pad-y, 2vh) var(--pad-x, 2vw); }
    .colheads .cell span{ font-size: 8px; letter-spacing: .12em; }
  }
  .colheads, .row{ display:flex; align-items:center; }
  .colheads{ padding: 0 0 calc(var(--tile-w) * 0.22); }
  .colheads span{
    font-size: calc(var(--tile-w) * 0.44); line-height: 1.1; letter-spacing: .3em;
    color:#8f8c82; text-transform: uppercase; font-weight: 600;
  }
  .row{ padding: var(--row-pad, 0.55vh) 0; }
  /* ---- fullscreen: the board fills the frame, and a real board has no footer ---- */
  body.fullscreen #sound-hint, body.fullscreen #chrome{ display: none !important; }
  .cell{ display:flex; gap: var(--gap); }
  .spacer{ width: calc(var(--tile-w) * 1.15); flex: none; }
  .tile{
    width: var(--tile-w); height: var(--tile-h); flex: none;
    background: linear-gradient(to bottom, #1d1e21 0%, #17181a 49.4%, #060607 49.6%, #060607 50.4%, #131416 50.6%, #101112 100%);
    border-radius: calc(var(--tile-w) * 0.09);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.045), inset 0 -6px 10px rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center;
    font-size: calc(var(--tile-w) * 0.94);
    font-weight: 700; line-height: 1; color: var(--ink);
    text-shadow: 0 1px 0 rgba(0,0,0,.6);
    transform-origin: 50% 50%;
    user-select:none;
  }
  .tile.flip{ animation: tileflip 85ms ease-in; }
  @keyframes tileflip{
    0%{ transform: perspective(300px) rotateX(0deg); }
    55%{ transform: perspective(300px) rotateX(-38deg); filter: brightness(1.25); }
    100%{ transform: perspective(300px) rotateX(0deg); }
  }
  .tile.land{ animation: tileland 130ms ease-out; }
  @keyframes tileland{
    0%{ transform: scale(1.035); } 100%{ transform: scale(1); }
  }
  .row .remarks .tile{ color: var(--ink); }
  .row .remarks .tile.hot{ color: var(--amber); }
  /* ---- colour board ---- */
  #colour{ display:none; }
  #colour .pxgrid{ display:grid; gap: 2px; justify-content:center; }
  .px{
    width: var(--px); height: var(--px);
    border-radius: calc(var(--px) * 0.08);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
  }
  .px.shimmer{ animation: pxflip 170ms ease-out; }
  @keyframes pxflip{
    0%{ transform: perspective(220px) rotateX(0deg); }
    50%{ transform: perspective(220px) rotateX(-42deg); filter: brightness(1.35); }
    100%{ transform: perspective(220px) rotateX(0deg); }
  }
  #demo-marker{
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    background: var(--amber); color:#111; font-weight:700; letter-spacing:.25em;
    font-size: 13px; padding: 6px 16px 6px 19px; border-radius: 4px; display:none; z-index: 40;
  }
  #chrome{
    position: fixed; right: 2vw; bottom: 16px; display:flex; gap:10px; align-items:center; z-index: 40;
  }
  #chrome button{
    background: rgba(20,20,22,.85); color:#cfccc2; border:1px solid #33343a;
    font: 600 12px/1 "Helvetica Neue", Arial, sans-serif; letter-spacing:.14em;
    height: 34px; padding: 0 14px; border-radius: 6px; cursor: pointer; text-transform: uppercase;
  }
  #chrome button:hover{ color:#fff; border-color:#55565e; }
  #sound-hint{
    position: fixed; left: 2vw; bottom: 16px; height: 34px; z-index: 40;
    display:flex; align-items:center;
    color:#7d7a70; font-size: 12px; letter-spacing:.18em; text-transform: uppercase;
  }
  @media (max-width: 760px){
    #chrome{ gap: 6px; }
    #chrome button{ height: 30px; padding: 0 8px; font-size: 10px; letter-spacing: .1em; }
    #sound-hint{ height: 30px; font-size: 9px; letter-spacing: .1em; }
  }
</style>
</head>

/* Append any missing demo boards to a config; never overwrite a user's board.
   Sets liveBoardId only when it is missing or dangling (fresh/empty library). */
function mergeSeeds(cfg){
  if(!cfg || typeof cfg !== "object") cfg = {};
  if(!cfg.boards || typeof cfg.boards !== "object") cfg.boards = {};
  var wasEmpty = Object.keys(cfg.boards).length === 0;
  var changed = false;
  var demos = demoBoards();
  if((cfg.seedVersion || 0) < SEED_VERSION){
    demos.forEach(function(sb){
      var nameTaken = Object.keys(cfg.boards).some(function(id){ return cfg.boards[id].name === sb.name; });
      if(nameTaken) return;
      if(cfg.boards[sb.id]){ sb.id = sb.id + "-seed"; }
      cfg.boards[sb.id] = sb; changed = true;
    });
    cfg.seedVersion = SEED_VERSION; changed = true;
  }
  /* Field fill-ins for boards stored before rows/kind existed: a board whose
     name matches a demo board takes that demo's row count; anything else
     defaults to 14. User boards and their edits are never overwritten. */
  Object.keys(cfg.boards).forEach(function(id){
    var b = cfg.boards[id];
    if(!b) return;
    if(!b.type){ b.type = "departures"; changed = true; }
    if(b.rows !== 5 && b.rows !== 14){
      var demo = null;
      demos.forEach(function(d){ if(d.name === b.name) demo = d; });
      b.rows = demo && demo.rows ? demo.rows : 14; changed = true;
    }
    if(b.type !== "colour" && !b.kind){
      b.kind = b.shows === "arrivals" ? "arrivals" : "departures"; changed = true;
    }
    if(b.type === "colour" && !b.scene){ b.scene = "walk"; changed = true; }
    if(b.type === "colour" && !(b.night >= 1 && b.night <= 8)){ b.night = 8; changed = true; }
    if(!b.flights){ b.flights = []; changed = true; }
    if(!b.lines){ b.lines = []; changed = true; }
  });
  if(!cfg.liveBoardId || !cfg.boards[cfg.liveBoardId]){
    cfg.liveBoardId = (wasEmpty && cfg.boards["board-terminal-one"])
      ? "board-terminal-one" : Object.keys(cfg.boards)[0];
    changed = true;
  }
  return { cfg: cfg, changed: changed };
}
function loadConfig(){
  var parsed = null;
  try{
    var raw = localStorage.getItem("isle-board-config-v1");
    if(raw) parsed = JSON.parse(raw);
  }catch(e){}
  var res = mergeSeeds(parsed);
  if(res.changed || !parsed){
    try{ localStorage.setItem("isle-board-config-v1", JSON.stringify(res.cfg)); }catch(e){}
  }
  return res.cfg;
}
function stagedBoard(){
  try{
    var raw = localStorage.getItem("isle-board-demo-v1");
    if(!raw) return null;
    var parsed = JSON.parse(raw);
    if(!parsed || !parsed.boards) return null;
    var res = mergeSeeds(parsed);
    if(res.changed){
      try{ localStorage.setItem("isle-board-demo-v1", JSON.stringify(res.cfg)); }catch(e){}
    }
    /* The staged config names the board being edited (demoBoardId, written
       by settings on every staged save): a demo shows THAT board, not
       whichever board happens to be live. Staged configs saved before the
       field existed fall back to the live board. */
    return res.cfg.boards[res.cfg.demoBoardId] || res.cfg.boards[res.cfg.liveBoardId] || null;
  }catch(e){}
  return null;
}

/* ============ Mode and state ============ */

if(DEMO){ board = stagedBoard(); if(board) document.getElementById("demo-marker").style.display = "block"; }
if(!board) board = config.boards[config.liveBoardId] || demoBoards()[0];

/* ============ Flap machinery ============ */
var RING = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-·:";
function ringIdx(ch){ var i = RING.indexOf(ch); return i < 0 ? 0 : i; }
function cleanRaw(text){
  text = String(text == null ? "" : text).toUpperCase();
  var out = "";
  for(var i=0;i<text.length;i++) out += RING.indexOf(text[i]) >= 0 ? text[i] : " ";
  return out;
}
function clean(text, len){
  text = String(text == null ? "" : text).toUpperCase();

/* Shared backdrop for the outdoor scenes: sky, sun, birds, hills, ground */
function buildBackdrop(t){
  var vf = field(SKY);

  vcircle(vf, 172, 14, 7, SUN); vcircle(vf, 172, 14, 4, SUN_IN);
  [18, 27].forEach(function(by, bi){
    var bx = Math.floor(((t * 0.5 + bi * 70) % (VW + 24)) - 12);
    vput(vf, bx, by, BIRD); vput(vf, bx - 2, by - 1, BIRD); vput(vf, bx + 2, by - 1, BIRD);
  });

    var mid = (x0 + x1) / 2, half = (x1 - x0) / 2;
    for(x = x0; x <= x1; x++){
      var q = (x - mid) / half;
      var h = Math.max(0, Math.round(peak * (1 - q * q)));
      for(y = 0; y < h; y++) vput(vf, x, VGY - 1 - y, x > mid ? HILL_DARK : HILL);

    vput(vf, x, VGY, GROUND_TOP);

/* Menorah: nine branches on a dark ground, gold arms, the shamash taller
   in the middle. Night n lights the shamash plus the n candles placed
   from the right; the rest are drawn unlit. Flames flicker per frame. */
function drawMenorah(){
  var vf = field(DARK);
  var t = anim.t;
  var night = (board.night >= 1 && board.night <= 8) ? Math.floor(board.night) : 8;
  var cx = 96, topY = 38, shamY = 28, baseY = 90;
  var i, bx;
  /* arms: a rising curve from the central stem to each branch */
  for(i = 0; i < 9; i++){
    if(i === 4) continue;
    bx = cx + (i - 4) * 16;
    for(var s2 = 0; s2 <= 24; s2++){
      var f = s2 / 24;
      var px = Math.round(cx + (bx - cx) * f);
      var py = Math.round(76 - (76 - (topY + 6)) * Math.pow(f, 1.6));
      vrect(vf, px - 1, py - 1, 3, 3, GOLD);
    }
    vrect(vf, bx - 1, topY + 2, 3, 6, GOLD); /* branch neck */
  }
  /* central stem and stepped base */
  vrect(vf, cx - 1, shamY + 2, 3, baseY - shamY, GOLD);
  vrect(vf, cx - 9, baseY, 19, 3, GOLD);
  vrect(vf, cx - 14, baseY + 3, 29, 3, GOLD);
  vrect(vf, cx - 19, baseY + 6, 39, 2, GOLD);
  vrect(vf, cx - 19, baseY + 6, 39, 1, GOLD_LT);
  /* candles, cups and flames: night n lights the shamash plus the n
     candles placed from the right (order 8,7,6,5,3,2,1,0) */
  var placeOrder = [8, 7, 6, 5, 3, 2, 1, 0];
  var litSet = { 4: true };
  for(var oi = 0; oi < night; oi++) litSet[placeOrder[oi]] = true;
  for(i = 0; i < 9; i++){
    bx = cx + (i - 4) * 16;
    var cTop = (i === 4) ? shamY : topY;
    vrect(vf, bx - 2, cTop, 5, 2, GOLD_LT); /* cup */
    vrect(vf, bx - 1, cTop - 7, 3, 7, CANDLE); /* candle */
    vput(vf, bx, cTop - 8, EYE); /* wick */
    var lit = !!litSet[i];
    if(lit){
      var fl = Math.floor(t / 2);
      var hgt = 4 + Math.floor(hash2(i, fl) * 3); /* 4..6 */
      var lean = Math.floor(hash2(i, fl + 40) * 3) - 1;
      for(var fy = 0; fy < hgt; fy++){
        var wdt = fy === hgt - 1 ? 1 : (fy === 0 ? 2 : 3);
        var fx = bx + (fy >= hgt - 2 ? lean : 0);
        vrect(vf, fx - Math.floor(wdt / 2), cTop - 9 - fy, wdt, 1, fy < 2 ? FLAME_O : FLAME_Y);
      }
      vput(vf, bx, cTop - 10, FLAME_C);
      vput(vf, bx, cTop - 11, FLAME_C);
    }
  }

}
/* Dreidel: spinning on the ground line; its body squeezes as it turns and
   the face cycles nun, gimmel, hey, shin. */
function drawDreidel(){
  var vf = buildBackdrop(anim.t);
  var t = anim.t;
  var cx = 96, tipY = VGY - 1;
  var phase = t * 0.22;
  var squeeze = 0.45 + 0.55 * Math.abs(Math.cos(phase));
  var bodyW = Math.max(10, Math.round(30 * squeeze));
  var bodyH = 25, tipH = 10;
  var bob = Math.round(Math.sin(t * 0.3) * 1);
  var bodyTop = tipY - tipH - bodyH + bob;

  /* handle and knob */
  vrect(vf, cx - 3, bodyTop - 6 + bob, 6, 6, GOLD);
  vrect(vf, cx - 5, bodyTop - 8 + bob, 10, 2, GOLD_LT);
  /* body with gold trim */
  vrect(vf, x0, bodyTop, bodyW, bodyH, OVERALL);
  vrect(vf, x0, bodyTop, bodyW, 2, GOLD_LT);
  vrect(vf, x0, bodyTop + bodyH - 2, bodyW, 2, GOLD_LT);
  /* tip: triangle down to the ground line */
  for(var yy = 0; yy < tipH; yy++){
    var w2 = Math.max(1, Math.round(bodyW * 0.6 * (1 - yy / tipH)));
    vrect(vf, cx - Math.floor(w2 / 2), bodyTop + bodyH + yy, w2, 1, GOLD);
  }

     it; strokes drawn 3 thick on a 2 stride so they survive sampling */

    var glyph = GLYPHS[DREIDEL_LETTERS[Math.floor(t / 7) % 4]];
    var gx = cx - 7, gy = bodyTop + 3;
    for(var ry = 0; ry < glyph.length; ry++)
      for(var rx = 0; rx < glyph[ry].length; rx++)

/* Star of David: two gold triangles on a dark ground, with a highlight

  var pts = [];

    var a = -Math.PI / 2 + k * Math.PI / 3;
    pts.push([Math.round(cx + R * Math.cos(a)), Math.round(cy + R * Math.sin(a))]);
  }
  function tri(p, q, r){ vline(vf, p[0], p[1], q[0], q[1], GOLD, 1); vline(vf, q[0], q[1], r[0], r[1], GOLD, 1); vline(vf, r[0], r[1], p[0], p[1], GOLD, 1); }
  tri(pts[0], pts[2], pts[4]);
  tri(pts[1], pts[3], pts[5]);
  var idx = Math.floor(anim.t / 6) % 6;
  vcircle(vf, pts[idx][0], pts[idx][1], 4, SUN_IN);
  vcircle(vf, pts[idx][0], pts[idx][1], 2, FLAME_C);
  var idx2 = (idx + 1) % 6;
  vcircle(vf, pts[idx2][0], pts[idx2][1], 2, GOLD_LT);

}

  var sc = board.scene || "walk";

         : sc === "dreidel" ? drawDreidel()
         : sc === "star" ? drawStar()
         : drawWalk();

/* Sample the virtual field down to the grid by plurality vote per block
   among non-background colours, so small features (flames, glyphs, the
   walker's cap) survive at the chunkier grid; changing tiles shimmer. */
function commitField(vf, bg){
  var bw = VW / CW, bh = VH / CH;
  for(var gy = 0; gy < CH; gy++){
    for(var gx = 0; gx < CW; gx++){
      var counts = {}, best = bg, bestN = 0;
      for(var byy = 0; byy < bh; byy++){
        for(var bxx = 0; bxx < bw; bxx++){
          var c = vf[(gy * bh + byy) * VW + gx * bw + bxx];
          if(c === bg) continue;
          var n = (counts[c] || 0) + 1; counts[c] = n;
          if(n > bestN){ best = c; bestN = n; }
        }
      }
      var col2 = best;
      var idx = gy * CW + gx;
      if(col2 !== pxState[idx]){
        pxState[idx] = col2;
        pxEls[idx].style.background = col2;

        }

    if(s.shellV > 0.05){
      s.shellX += s.shellV; s.shellV *= 0.96;
      if(s.shellX > VW - 14){ s.shellX = VW - 14; s.shellV = 0; }

/* ============ Audio engine ============ */
var AC = null, clackBus = null, eventBus = null, ambBus = null, paBus = null;
var stepBufs = [], flapBufs = [], buffersReady = false;
var bedEl = null, bedBaseGain = 0, duckUntil = 0;
function initAudio(){
  if(AC) { if(AC.state === "suspended") AC.resume(); return; }
  try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return; }
  clackBus = AC.createGain(); clackBus.connect(AC.destination);
  eventBus = AC.createGain(); eventBus.connect(AC.destination);
  ambBus   = AC.createGain(); ambBus.connect(AC.destination);
  paBus    = AC.createGain(); paBus.connect(AC.destination);
  applyLevels();
  loadSet(board.clackSet);
  setupBed();
  document.getElementById("sound-hint").style.display = "none";
}
function applyLevels(){
  if(!AC) return;
  var L = board.ambience.levels;
  clackBus.gain.value = 0.9 * L.clack;
  eventBus.gain.value = 0.9 * L.events;
  paBus.gain.value = L.announcements;
  bedBaseGain = board.ambience.on ? 0.5 * L.bed : 0;
  ambBus.gain.setTargetAtTime(bedBaseGain * (Date.now() < duckUntil ? 0.4 : 1), AC.currentTime, 0.4);
}
function loadSet(setName){
  stepBufs = []; flapBufs = []; buffersReady = false;
  if(!AC) return;
  var files = SET_FILES[setName] || SET_FILES.pragotron;
  var pending = 0;
  function grab(url, arr){
    pending++;
    fetch(url).then(function(r){ return r.arrayBuffer(); })
      .then(function(ab){ return AC.decodeAudioData(ab); })
      .then(function(buf){ arr.push(buf); })
      .catch(function(){})
      .then(function(){ if(--pending === 0) buffersReady = true; });
  }
  files.steps.forEach(function(i){ grab("assets/audio/sets/" + setName + "/step-" + pad2(i) + ".mp3", stepBufs); });
  files.flaps.forEach(function(i){ grab("assets/audio/sets/" + setName + "/flap-" + pad2(i) + ".mp3", flapBufs); });
}
/* Round-robin bags: shuffled, never an immediate repeat */
function makeBag(n){ var a = []; for(var i=0;i<n;i++) a.push(i); for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
var stepBag = [], flapBag = [], lastStep = -1, lastFlap = -1;
function nextFrom(bagName, pool){
  var bag = bagName === "step" ? stepBag : flapBag;
  if(!bag.length){ bag = makeBag(pool.length); var last = bagName === "step" ? lastStep : lastFlap;
    if(bag.length > 1 && bag[bag.length-1] === last){ var t = bag[0]; bag[0] = bag[bag.length-1]; bag[bag.length-1] = t; }
    if(bagName === "step") stepBag = bag; else flapBag = bag; }
  var idx = bag.pop();
  if(bagName === "step") lastStep = idx; else lastFlap = idx;
  return pool[idx];
}
var activeVoices = 0;
function playBuf(buf, bus, when, rate, gainMul){
  if(!AC || !buf || activeVoices >= 24) return;
  var src = AC.createBufferSource(); src.buffer = buf;
  src.playbackRate.value = rate;
  var g = AC.createGain(); g.gain.value = gainMul;
  src.connect(g); g.connect(bus);
  src.onended = function(){ activeVoices--; };
  activeVoices++;
  src.start(when);
}
var IMPACT_LEAD = 0.045; /* the design point: a slice's impact sounds 45 ms after its start */
/* Each buffer's loudest point (its impact) is measured once, when first
   played. The pragotron slices carry their impact at the design 45 ms,
   but slices cut from whole-board hall recordings peak wherever the
   loudest flap in the slice happens to sit (measured spread: the peak
   lands anywhere from 2 ms to 170 ms into the slice). Scheduling starts
   each buffer early or late by the difference, so every set's impact
   lands at the same point of the tile's fall: the fall's end. */
var peakCache = (typeof WeakMap === "function") ? new WeakMap() : null;
function peakOf(buf){
  if(!buf) return IMPACT_LEAD;
  if(peakCache){
    var hit = peakCache.get(buf);
    if(hit !== undefined) return hit;
  }
  var d = buf.getChannelData(0), mi = 0, mv = 0;
  for(var i = 0; i < d.length; i++){ var a = Math.abs(d[i]); if(a > mv){ mv = a; mi = i; } }
  var t = mi / buf.sampleRate;
  if(peakCache) peakCache.set(buf, t);
  return t;
}
function impactWhen(buf){
  /* start the buffer so its measured impact sounds at tick + 90 ms:
     the 45 ms lead plus the impact's own 45 ms design offset */
  return AC.currentTime + Math.max(0.005, 2 * IMPACT_LEAD - peakOf(buf));
}
function playStep(colFrac){
  if(!AC || !buffersReady || !stepBufs.length) return;
  var buf = nextFrom("step", stepBufs);
  playBuf(buf, clackBus, impactWhen(buf), 0.97 + Math.random()*0.06, 0.85 + Math.random()*0.3);
}
function playFlap(){
  if(!AC || !buffersReady || !flapBufs.length) return;
  var buf = nextFrom("flap", flapBufs);
  playBuf(buf, eventBus, impactWhen(buf), 0.97 + Math.random()*0.06, 0.9 + Math.random()*0.25);
}
function duck(ms){
  if(!AC) return;
  duckUntil = Date.now() + ms;
  ambBus.gain.setTargetAtTime(bedBaseGain * 0.4, AC.currentTime, 0.25);
  setTimeout(function(){
    if(AC && Date.now() >= duckUntil) ambBus.gain.setTargetAtTime(bedBaseGain, AC.currentTime, 0.8);
  }, ms + 60);
}

/* Ambience bed: one looping element under everything, never paused
   once on. It starts and stops the way the ambience design specifies:
   a 3 second fade-in and a 2 second fade-out, on the bed's own gain
   node, so the ambience bus keeps carrying the level and duck settings
   untouched and a change of bed crossfades instead of cutting. */
var bedGain = null;
function retireBed(){
  var el = bedEl, g = bedGain;
  bedEl = null; bedGain = null;
  if(!el) return;
  if(g && AC){
    var t = AC.currentTime;
    try{
      g.gain.cancelScheduledValues(t);
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.linearRampToValueAtTime(0, t + 2); /* 2 s fade-out */
    }catch(e){}
    setTimeout(function(){
      try{ el.pause(); }catch(e){}
      try{ el.remove(); }catch(e){}
      try{ g.disconnect(); }catch(e){}
    }, 2100);
  } else {
    try{ el.pause(); }catch(e){}
    try{ el.remove(); }catch(e){}
  }
}
function setupBed(){
  var bedFile = null;
  BEDS.forEach(function(b){ if(b[0] === board.ambience.bed) bedFile = b[2]; });
  retireBed();
  if(!bedFile) return;
  if(!board.ambience.on || inQuietHours()) { applyLevels(); return; }
  bedEl = new Audio("assets/audio/beds/" + bedFile);
  bedEl.loop = true; bedEl.crossOrigin = "anonymous";
  try{
    var src = AC.createMediaElementSource(bedEl);
    bedGain = AC.createGain();
    bedGain.gain.value = 0;
    bedGain.gain.linearRampToValueAtTime(1, AC.currentTime + 3); /* 3 s fade-in */
    src.connect(bedGain); bedGain.connect(ambBus);
  }catch(e){ bedEl.volume = 0.4; }
  bedEl.play().catch(function(){});
  applyLevels();
}

/* ============ Signals and announcements ============ */
function tone(freq, t0, dur, gain){
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(paBus); o.start(t0); o.stop(t0 + dur + 0.05);
}
function playSignal(kind){
  if(!AC || kind === "none") return Promise.resolve();
  var t = AC.currentTime + 0.05, dur;
  if(kind === "cdg"){ /* modelled multi-note gesture */
    var notes = [1318.5, 1046.5, 783.99, 1046.5];
    notes.forEach(function(f, i){ tone(f, t + i*0.22, 0.5, 0.22); });
    dur = notes.length * 0.22 + 0.55;
  }else{ /* international double dong: high then low */
    tone(830.61, t, 0.7, 0.25); tone(622.25, t + 0.28, 0.9, 0.25);
    dur = 1.35;
  }
  return new Promise(function(res){ setTimeout(res, dur * 1000); });
}
function paFileFor(scriptId){
  for(var i=0;i<LIVE_PA.length;i++) if(LIVE_PA[i][0] === scriptId) return "assets/audio/pa/" + LIVE_PA[i][2];
  return "assets/audio/pa/" + scriptId + "--" + board.voice + ".mp3";
}
var paPlaying = false;
function playAnnouncement(scriptId){
  if(!AC || paPlaying) return;
  paPlaying = true;
  duck(12000);
  playSignal(board.signal).then(function(){
    var a = new Audio(paFileFor(scriptId));
    a.crossOrigin = "anonymous";
    try{ var s = AC.createMediaElementSource(a); s.connect(paBus); }catch(e){ a.volume = 0.9; }
    a.onended = paDone;
    a.onerror = paDone;
    a.play().catch(paDone);
  });
}
/* The configured interval is the pause BETWEEN announcements, so the
   next one is scheduled from the moment this one ends. (Scheduling
   from the start instead made the pause shrink by the announcement's
   own length, and vanish entirely whenever a render ran longer than
   the interval.) */
function paDone(){
  if(!paPlaying) return;
  paPlaying = false;
  var ann = board.announcements || {};
  var lo = +ann.minSec || 420, hi = +ann.maxSec || 1200;
  var span = Math.max(0, hi - lo);
  nextPaAt = Date.now() + (lo + Math.random()*span) * 1000;
}
var nextPaAt = Date.now() + 20000, paIdx = 0;
var wasQuiet = inQuietHours();
setInterval(function(){
  /* Quiet hours begin and end on their own clock: when the board
     crosses into them the bed fades out, and when they end the bed
     fades back in, without waiting for a board change or a publish. */
  var qNow = inQuietHours();
  if(AC && qNow !== wasQuiet){
    if(qNow) retireBed();
    else if(board.ambience.on) setupBed();
  }
  wasQuiet = qNow;
  if(!AC || DEMO) return;
  if(!board.announcements.on || inQuietHours() || paPlaying) return;
  if(Date.now() < nextPaAt) return;
  var rot = board.announcements.rotation && board.announcements.rotation.length
    ? board.announcements.rotation : SCRIPTS.map(function(s){ return s[0]; });
  playAnnouncement(rot[paIdx % rot.length]); paIdx++;
  /* nextPaAt is set by paDone() when this announcement ends */
}, 1000);

/* ============ Quiet hours ============ */
function inQuietHours(){
  var q = board.quietHours; if(!q || !q.on) return false;
  var now = new Date(), mins = now.getHours()*60 + now.getMinutes();
  function parse(s){ var p = String(s||"0:0").split(":"); return (+p[0])*60 + (+p[1]||0); }
  var a = parse(q.start), b = parse(q.end);
  return a <= b ? (mins >= a && mins < b) : (mins >= a || mins < b);
}

/* ============ Cascade rendering ============ */
var STEP_MS = 85;
function renderBoard(cascade){
  if(board.type === "colour"){ showColour(); return; }
  stopColour();
  applyHeadings();
  var text = isTextBoard();
  headEl.style.display = text ? "none" : "";
  buildRows();
  rowsBuilt = true;
  var jobs = []; /* {tile, from, to, steps, delay, silent} */
  var count = boardRows(), r;
  if(text){
    var lines = board.lines || [];
    for(r = 0; r < count; r++){
      var ln = lines[r] || { text:"", black:false };
      var full = cleanRaw(ln.text);
      if(!ln.black && full.length > TEXT_COLS)
        console.warn("Flight Board: line " + (r + 1) + " is " + full.length +
                     " tiles wide; truncated to " + TEXT_COLS + " to fit the grid.");
      var targetLine = ln.black ? "" : full;
      targetLine = (targetLine + " ".repeat(TEXT_COLS)).slice(0, TEXT_COLS);
      for(var k = 0; k < TEXT_COLS; k++){
        var tt = tileGrid[r][0][k];
        var fromL = tt.dataset.ch || " ";
        var stepsL = (ringIdx(targetLine[k]) - ringIdx(fromL) + RING.length) % RING.length;
        if(!cascade) stepsL = 0;
        jobs.push({ tile: tt, from: fromL, to: targetLine[k], steps: stepsL,
                    delay: r * 55 + k * 26 + Math.random() * 22, silent: !!ln.black });
      }
    }
  } else {
    var fl = board.flights || [];
    for(r = 0; r < count; r++){
      var f = fl[r] || null;
      var silent = !f || !!f.black; /* blank and black rows make no clack of their own */
      COLS.forEach(function(c, ci){
        var target = (!f || f.black) ? "" : clean(f[c.key], c.width);
        target = (target + " ".repeat(c.width)).slice(0, c.width);
        for(var k2 = 0; k2 < c.width; k2++){
          var tile = tileGrid[r][ci][k2];
          var from = tile.dataset.ch || " ";
          var steps = (ringIdx(target[k2]) - ringIdx(from) + RING.length) % RING.length;
          if(!cascade) steps = 0;
          jobs.push({ tile: tile, from: from, to: target[k2], steps: steps,
                      delay: r * 55 + ci * 130 + k2 * 26 + Math.random() * 22, silent: silent });
        }
      });
    }
  }
  var totalSteps = 0; jobs.forEach(function(j){ totalSteps += j.steps; });
  if(cascade && totalSteps > 40) duck(Math.min(9000, totalSteps * 9));
  var quiet = inQuietHours();
  jobs.forEach(function(j){
    if(j.steps === 0){ j.tile.textContent = j.to; j.tile.dataset.ch = j.to; return; }
    var thinning = Math.min(0.92, 0.25 + totalSteps / 260); /* dense cascades: fewer, softer ticks */
    setTimeout(function(){
      var pos = ringIdx(j.from), remaining = j.steps;
      var iv = setInterval(function(){
        pos = (pos + 1) % RING.length;
        var ch = RING[pos];
        j.tile.textContent = ch;
        j.tile.classList.remove("flip"); void j.tile.offsetWidth; j.tile.classList.add("flip");
        if(!quiet && !j.silent && Math.random() > thinning) playStep();
        if(--remaining <= 0){
          clearInterval(iv);
          j.tile.dataset.ch = j.to;
          j.tile.classList.remove("land"); void j.tile.offsetWidth; j.tile.classList.add("land");
          if(!quiet && !j.silent) playFlap();
        }
      }, STEP_MS);
    }, j.delay);
  });
}

/* ============ Fit the board to the screen ============ */
/* Board insets: the board box sits INSIDE the viewport on every side, in
   windowed and fullscreen modes alike. 2% of width at left/right and 2.5%
   of height at top/bottom: past the ~1.5%/2% design target, the extra
   ~0.5% is the allowance for TV overscan (many sets crop 1-3% of the
   picture in their default picture mode), so the outermost tiles and the
   header stay on the visible glass even with modest overscan. */
var INSET_X = 0.02, INSET_Y = 0.025;
function boardPads(fs, iw, ih){
  return { x: fs ? iw * 0.006 : iw * 0.012, y: fs ? ih * 0.008 : ih * 0.014 };
}
function fitColour(){
  colourDims();
  var root = document.documentElement;
  var iw = window.innerWidth, ih = window.innerHeight;
  var fs = !!document.fullscreenElement;
  var pad = boardPads(fs, iw, ih);
  root.style.setProperty("--pad-x", pad.x + "px");
  root.style.setProperty("--pad-y", pad.y + "px");
  var boardW = iw * (1 - 2 * INSET_X), boardH = ih * (1 - 2 * INSET_Y);
  var tw = Math.min(84, Math.max(18, iw * 0.0205)); /* :root --tile-w clamp, drives header size */
  var headBlock = 2.52 * tw + 2;
  var gapTotalW = (CW - 1) * 2, gapTotalH = (CH - 1) * 2;
  var px = Math.floor(Math.min((boardW - 2 * pad.x - gapTotalW) / CW,
                               (boardH - 2 * pad.y - headBlock - gapTotalH) / CH));
  root.style.setProperty("--px", Math.max(4, px) + "px"); /* .px is square: width == height */
}
function fitBoard(){
  if(board.type === "colour"){ fitColour(); return; }
  var root = document.documentElement;
  var fs = !!document.fullscreenElement;
  var iw = window.innerWidth, ih = window.innerHeight;
  var units = 43 + 38 * 0.14 + 4 * 1.15; /* tiles + in-cell gaps + spacers, in tile widths */
  var rows = boardRows();
  var boardW = iw * (1 - 2 * INSET_X);
  var boardH = ih * (1 - 2 * INSET_Y);
  var pad = boardPads(fs, iw, ih);
  root.style.setProperty("--pad-x", pad.x + "px");
  root.style.setProperty("--pad-y", pad.y + "px");
  /* Vertical metrics in tile-width units. The tile aspect is FIXED at
     1.42 (height / width) by the --tile-h calc and never stretched:
     tiles grow only in true proportion. The board renders exactly
     `rows` rows (the chosen board size); leftover height is spread
     into the row pitch so the board fills the frame inside the insets. */
  var HEADER_ETC = isTextBoard() ? 1.85 : 2.52; /* header block (+ column headings for flight boards), in tile widths */
  var PITCH = 1.53;      /* row pitch incl. base row padding, in tile widths */
  var wByWidth = (boardW - 2 * pad.x) / units;
  var wByHeight = (boardH - 2 * pad.y - 2) / (HEADER_ETC + rows * PITCH);
  var w = Math.max(4, Math.min(wByWidth, wByHeight * 0.998));
  root.style.setProperty("--tile-w", w + "px");
  /* Tiles that fit across a text-board line at this tile width. Lines
     longer than this are truncated to the grid, never clipped mid-tile. */
  var colsFit = Math.max(8, Math.floor(((boardW - 2 * pad.x) / w + 0.14) / 1.14));
  if(colsFit !== TEXT_COLS){
    TEXT_COLS = colsFit;
    if(rowsBuilt && isTextBoard()) renderBoard(false);
  }
  var rowsAvail = boardH - 2 * pad.y - 2 - HEADER_ETC * w;
  var leftover = Math.max(0, rowsAvail - rows * PITCH * w);
  var rowPad = w * 0.055 + leftover / (rows * 2);
  root.style.setProperty("--row-pad", rowPad + "px");
}
document.addEventListener("fullscreenchange", function(){
  document.body.classList.toggle("fullscreen", !!document.fullscreenElement);
  fitBoard();
});
fitBoard();
window.addEventListener("resize", fitBoard);

/* ============ Clock, wiring, live updates ============ */
function tickClock(){
  var d = new Date();
  document.getElementById("clock").textContent =
    String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
tickClock(); setInterval(tickClock, 1000);
renderBoard(false);
setTimeout(function(){ renderBoard(true); }, 600); /* opening cascade */

document.addEventListener("pointerdown", initAudio);
document.getElementById("btn-full").addEventListener("click", function(ev){
  ev.stopPropagation();
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
});
document.getElementById("btn-cascade").addEventListener("click", function(ev){
  ev.stopPropagation(); initAudio();
  if(board.type === "colour"){ anim = freshScene(); drawScene(); return; }
  tileGrid.forEach(function(row){ row.forEach(function(cell){ cell.forEach(function(t){ t.dataset.ch = " "; t.textContent = " "; }); }); });
  renderBoard(true);
});
if(!DEMO){
  window.addEventListener("storage", function(e){
    if(e.key !== "isle-board-config-v1" || !e.newValue) return;
    try{
      config = JSON.parse(e.newValue);
      var nb = config.boards[config.liveBoardId];
      if(!nb) return;
      if(!nb.type) nb.type = "departures";
      if(nb.rows !== 5 && nb.rows !== 14) nb.rows = 14;
      if(nb.type !== "colour" && !nb.kind) nb.kind = nb.shows === "arrivals" ? "arrivals" : "departures";
      if(!nb.flights) nb.flights = [];
      if(!nb.lines) nb.lines = [];
      if(nb.type === "colour" && !nb.scene) nb.scene = "walk";
      if(nb.type === "colour" && !(nb.night >= 1 && nb.night <= 8)) nb.night = 8;
      var setChanged = nb.clackSet !== board.clackSet;
      var bedChanged = nb.ambience.bed !== board.ambience.bed || nb.ambience.on !== board.ambience.on;
      board = nb;
      fitBoard();
      if(AC){ applyLevels(); if(setChanged) loadSet(board.clackSet); if(bedChanged) setupBed(); }
      renderBoard(true);
    }catch(err){}
  });
}
