<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<script>
/* One-time on-device storage reset (Nov 27, 2026). Earlier builds stored
   board data under the two keys below; on the first load of this build
   that old data is cleared so nothing stale carries over, and the page
   seeds fresh. The marker makes the reset fire once only, so boards made
   afterwards persist across visits. */
(function(){
  var RESET_EPOCH = "20261127";
  try{
    if(localStorage.getItem("isle-board-reset") !== RESET_EPOCH){
      localStorage.removeItem("isle-board-config-v1");
      localStorage.removeItem("isle-board-demo-v1");
      localStorage.setItem("isle-board-reset", RESET_EPOCH);
    }
  }catch(e){}
})();
</script>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon.png" />
<link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
<link rel="mask-icon" href="/assets/safari-pinned-tab.svg" color="#1d2a3b" />
<title>The Isle · Flight Board</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --panel:#141416; --line:#2a2b30; --ink:#f2ede1; --mut:#9a978c; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#0a0a0b; color:var(--ink);
        font-family:"Roboto Mono", ui-monospace, monospace; }
  .wrap{ max-width:640px; margin:0 auto; padding:48px 16px 64px; }
  .mark{ display:block; width:min(340px, 78vw); height:auto; margin:8px auto 10px; }
  h1{ font-size:13px; font-weight:500; letter-spacing:.24em; text-transform:uppercase;
      color:var(--mut); text-align:center; margin:0 0 34px; }
  /* The menu. Future size pages join this list as their own rows when
     they exist; nothing else belongs on this page. */
  .menu{ border-top:1px solid var(--line); }
  .menu a{ display:flex; align-items:center; gap:14px; min-height:64px;
           padding:14px 6px; border-bottom:1px solid var(--line);
           color:var(--ink); text-decoration:none; }
  .menu a:hover, .menu a:focus-visible{ background:var(--panel); }
  .menu a:focus-visible{ outline:2px solid var(--ink); outline-offset:-2px; }
  .menu .name{ font-size:16px; font-weight:700; letter-spacing:.14em;
               text-transform:uppercase; white-space:nowrap; }
  .menu .line{ font-size:13px; color:var(--mut); margin-left:auto;
               text-align:right; }
  .menu .arr{ font-size:16px; color:var(--mut); }
  .nowplaying{ margin-top:26px; font-size:13px; color:var(--mut);
               text-align:center; letter-spacing:.08em; }
  .nowplaying .np-label{ text-transform:uppercase; letter-spacing:.24em;
                         margin-right:10px; }
  .nowplaying .np-name{ color:var(--ink); }
  .page-footer{ margin-top:22px; font-size:12px; color:var(--mut); text-align:center;
         letter-spacing:.08em; }
</style>
</head>
<body>
<div class="wrap">
  <header class="page-header">
    <img class="mark" src="/assets/the-isle-vertical-silver-colourtree.png" alt="The Isle" />
    <h1>Flight Board</h1>
  </header>
  <nav class="menu">
    <a href="/board/live?fs=1" target="_blank" rel="noopener">
      <span class="name">Live board</span>
      <span class="line">The running board</span>
      <span class="arr">&rarr;</span>
    </a>
    <a href="/board/demo">
      <span class="name">Demo board</span>
      <span class="line">The live board on the television</span>
      <span class="arr">&rarr;</span>
    </a>
    <a href="/board/settings">
      <span class="name">Settings</span>
      <span class="line">Boards, sounds, announcements and publishing</span>
      <span class="arr">&rarr;</span>
    </a>
  </nav>
  <div class="nowplaying"><span class="np-label">Now playing</span><span class="np-name" id="np-name"></span></div>
  <footer class="page-footer">THE ISLE &middot; FLIGHT BOARD</footer>
</div>
<script>
/* The currently playing line: what the live stream is running now,
   read from the same live configuration the live page uses. A single
   live board shows its name; a live carousel shows the carousel's
   name and the member board up at this moment, worked out from the
   clock on the same epoch basis as the live page, and the line is
   refreshed on an interval so it follows the rotation while the
   menu sits open. With no configuration stored yet, the seeded
   default board is what the live page would run. */
(function(){
  var el = document.getElementById("np-name");
  if(!el) return;
  function compute(){
    var cfg = null;
    try{
      var raw = localStorage.getItem("isle-board-config-v1");
      if(raw) cfg = JSON.parse(raw);
    }catch(e){}
    if(!cfg || !cfg.boards || !Object.keys(cfg.boards).length) return "Terminal One";
    var cid = cfg.liveCarouselId;
    if(cid && cfg.carousels && cfg.carousels[cid]){
      var def = cfg.carousels[cid];
      var ids = (def.boardIds || []).filter(function(id){ return !!cfg.boards[id]; });
      if(ids.length){
        var iv = Math.max(10, Math.min(3600, +def.intervalSec || 30));
        var idx = Math.floor(Date.now() / (iv * 1000)) % ids.length;
        var member = cfg.boards[ids[idx]];
        return (def.name || "Carousel") + " · " + (member && member.name ? member.name : "");
      }
    }
    var b = cfg.boards[cfg.liveBoardId];
    if(b && b.name) return b.name;
    var first = Object.keys(cfg.boards)[0];
    return (first && cfg.boards[first].name) || "Terminal One";
  }
  function tick(){ el.textContent = compute(); }
  tick();
  setInterval(tick, 1000);
  window.addEventListener("storage", tick);
})();
</script>
</body>
</html>
