<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Isle · Flight Board</title>
<style>
  :root{
    --tile-w: clamp(18px, 2.05vw, 84px);
    --tile-h: calc(var(--tile-w) * 1.42);
    --gap: calc(var(--tile-w) * 0.14);
    --ink: #f2ede1;
    --amber: #e8a33d;
    --board-bg: #0a0a0b;
    --tile-bg: #17181a;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html,body{ background:#000; height:100%; }
  body{
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
  }
  #board{
    background: var(--board-bg);
    padding: 3.2vh 3.4vw 3.6vh;
    border-radius: 10px;
    box-shadow: 0 0 0 1px #1d1e20, 0 30px 80px rgba(0,0,0,.8);
    max-width: 100vw;
  }
  header{
    display:flex; align-items:baseline; justify-content:space-between;
    padding: 0 0.4vw 2.2vh;
    border-bottom: 2px solid #26272a;
    margin-bottom: 2.4vh;
  }
  header .title{
    font-size: clamp(20px, 2.5vw, 96px);
    font-weight: 700; letter-spacing: .34em; text-transform: uppercase;
  }
  header .title .dot{ color: var(--amber); letter-spacing: 0; }
  header .clock{
    font-size: clamp(20px, 2.5vw, 96px);
    font-weight: 700; letter-spacing: .18em; font-variant-numeric: tabular-nums;
  }
  .colheads, .row{ display:flex; align-items:center; }
  .colheads{ padding: 0 0 1.4vh; }
  .colheads span{
    font-size: clamp(10px, 0.95vw, 36px); letter-spacing: .3em;
    color:#8f8c82; text-transform: uppercase; font-weight: 600;
  }
  .row{ padding: 0.55vh 0; }
  .cell{ display:flex; gap: var(--gap); }
  .spacer{ width: calc(var(--tile-w) * 1.15); flex: none; }
  .tile{
    width: var(--tile-w); height: var(--tile-h); flex: none;
    background: linear-gradient(to bottom, #1d1e21 0%, #17181a 49.4%, #060607 49.6%, #060607 50.4%, #131416 50.6%, #101112 100%);
    border-radius: calc(var(--tile-w) * 0.09);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.045), inset 0 -6px 10px rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center;
    font-size: calc(var(--tile-w) * 0.94);
    font-weight: 700; line-height: 1; color: var(--ink);
    text-shadow: 0 1px 0 rgba(0,0,0,.6);
    transform-origin: 50% 50%;
    user-select:none;
  }
  .tile.flip{ animation: tileflip 85ms ease-in; }
  @keyframes tileflip{
    0%{ transform: perspective(300px) rotateX(0deg); }
    55%{ transform: perspective(300px) rotateX(-38deg); filter: brightness(1.25); }
    100%{ transform: perspective(300px) rotateX(0deg); }
  }
  .tile.land{ animation: tileland 130ms ease-out; }
  @keyframes tileland{
    0%{ transform: scale(1.035); } 100%{ transform: scale(1); }
  }
  .row .remarks .tile{ color: var(--ink); }
  .row .remarks .tile.hot{ color: var(--amber); }
  #demo-marker{
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    background: var(--amber); color:#111; font-weight:700; letter-spacing:.25em;
    font-size: 13px; padding: 6px 16px 6px 19px; border-radius: 4px; display:none; z-index: 40;
  }
  #chrome{
    position: fixed; right: 18px; bottom: 16px; display:flex; gap:10px; align-items:center; z-index: 40;
  }
  #chrome button{
    background: rgba(20,20,22,.85); color:#cfccc2; border:1px solid #33343a;
    font: 600 12px/1 "Helvetica Neue", Arial, sans-serif; letter-spacing:.14em;
    padding: 10px 14px; border-radius: 6px; cursor: pointer; text-transform: uppercase;
  }
  #chrome button:hover{ color:#fff; border-color:#55565e; }
  #sound-hint{
    position: fixed; left: 18px; bottom: 16px; z-index: 40;
    color:#7d7a70; font-size: 12px; letter-spacing:.18em; text-transform: uppercase;
  }
</style>
</head>
<body>
<div id="demo-marker">DEMO</div>
<main id="board" aria-label="Departures board">
  <header>
    <div class="title">THE ISLE <span class="dot">·</span> DEPARTURES</div>
    <div class="clock" id="clock">--:--</div>
  </header>
  <div class="colheads" id="colheads"></div>
  <div id="rows"></div>
</main>
<div id="sound-hint">Tap anywhere for sound</div>
<div id="chrome">
  <button id="btn-cascade" type="button">Refresh board</button>
  <button id="btn-full" type="button">Fullscreen</button>
</div>
<script>
"use strict";
/* ============ Shared catalogue (keep in step with settings page) ============ */
var VOICES = [
  ["aria","Aria · American (F)"],["helio","Helio · American (M)"],
  ["isabella","Isabella · British (F)"],["magnus","Magnus · British (M)"],
  ["sunny","Sunny · Australian (F)"],["conor","Conor · Irish (M)"],
  ["thai","Thai (F)"],["singaporean","Singaporean (F)"],["japanese","Japanese (F)"]
];
var SCRIPTS = [
  ["the-isle-final","The Isle · final call"],["the-isle-boarding","The Isle · boarding"],
  ["honolulu","Honolulu · boarding"],["bora-bora","Bora Bora · boarding"],
  ["phuket","Phuket · final call"],["miami-test","Miami · final call"],
  ["page-cakes","Page · Cakes to The Isle Lounge"],
  ["page-party-waiting","Page · your party is waiting"],
  ["page-mrs-silver","Page · Mrs. Silver to the lounge"]
];
var LIVE_PA = [
  ["live-frankfurt","Live recording · Frankfurt (German/English)","pa-frankfurt.mp3"],
  ["live-boarding","Live recording · Boarding call (CC0)","pa-boarding-cc0.mp3"],
  ["live-midway","Live recording · Chicago Midway","pa-midway.mp3"]
];
var SETS = [["pragotron","Pragotron module"],["frankfurt","Frankfurt hall"],
            ["barcelona","Barcelona Sants"],["madeira","Madeira airport"]];
var BEDS = [["manchester","Manchester Airport","ambience-manchester-airport.mp3"],
            ["kualalumpur","Kuala Lumpur Airport","ambience-kualalumpur-calm.mp3"],
            ["lanzarote","Lanzarote Airport","ambience-lanzarote-airport.mp3"],
            ["rdu","Raleigh-Durham Terminal","ambience-rdu-terminal.mp3"]];
var SET_STEPS = { pragotron:24, frankfurt:24, barcelona:24, madeira:24 };
var SET_FLAPS = { pragotron:3, frankfurt:4, barcelona:4, madeira:4 };

function defaultBoard(){
  return {
    id: "board-departures", name: "Departures",
    flights: [
      {time:"08:05", destination:"THE ISLE",  flight:"IS 808",  gate:"7",  remarks:"BOARDING"},
      {time:"08:20", destination:"MIAMI",     flight:"AA 2241", gate:"C3", remarks:"FINAL CALL"},
      {time:"09:15", destination:"HONOLULU",  flight:"HA 51",   gate:"12", remarks:"ON TIME"},
      {time:"10:40", destination:"BORA BORA", flight:"VT 442",  gate:"4",  remarks:"ON TIME"},
      {time:"11:30", destination:"PHUKET",    flight:"TG 910",  gate:"9",  remarks:"ON TIME"},
      {time:"12:05", destination:"SINGAPORE", flight:"SQ 25",   gate:"21", remarks:"ON TIME"},
      {time:"13:45", destination:"LONDON",    flight:"BA 117",  gate:"15", remarks:"DELAYED"},
      {time:"15:10", destination:"TOKYO",     flight:"NH 105",  gate:"18", remarks:"ON TIME"},
      {time:"16:25", destination:"SYDNEY",    flight:"QF 8",    gate:"11", remarks:"ON TIME"}
    ],
    clackSet: "pragotron",
    ambience: { on:false, bed:"manchester",
                levels:{ bed:0.5, events:0.7, announcements:0.9, clack:0.8 } },
    voice: "isabella", signal: "dong",
    announcements: { on:false, minSec:420, maxSec:1200,
                     rotation:["the-isle-boarding","honolulu","bora-bora","phuket","the-isle-final"] },
    quietHours: { on:true, start:"23:00", end:"07:00" }
  };
}
function defaultConfig(){
  var b = defaultBoard();
  var cfg = { liveBoardId: b.id, boards: {} };
  cfg.boards[b.id] = b;
  return cfg;
}
function loadConfig(){
  try{
    var raw = localStorage.getItem("isle-board-config-v1");
    if(raw){ var cfg = JSON.parse(raw); if(cfg && cfg.boards && cfg.liveBoardId) return cfg; }
  }catch(e){}
  var fresh = defaultConfig();
  try{ localStorage.setItem("isle-board-config-v1", JSON.stringify(fresh)); }catch(e){}
  return fresh;
}
function stagedBoard(){
  try{
    var raw = localStorage.getItem("isle-board-demo-v1");
    if(!raw) return null;
    var cfg = JSON.parse(raw);
    if(cfg && cfg.boards) return cfg.boards[cfg.liveBoardId] || null;
  }catch(e){}
  return null;
}

/* ============ Mode and state ============ */
var DEMO = new URLSearchParams(location.search).get("demo") === "1";
var config = loadConfig();
var board = null;
if(DEMO){ board = stagedBoard(); if(board) document.getElementById("demo-marker").style.display = "block"; }
if(!board) board = config.boards[config.liveBoardId] || defaultBoard();

/* ============ Flap machinery ============ */
var RING = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-·:";
function ringIdx(ch){ var i = RING.indexOf(ch); return i < 0 ? 0 : i; }
function clean(text, len){
  text = String(text == null ? "" : text).toUpperCase();
  var out = "";
  for(var i=0;i<text.length;i++) out += RING.indexOf(text[i]) >= 0 ? text[i] : " ";
  return (out + " ".repeat(len)).slice(0, len);
}
var COLS = [
  {key:"time",        label:"TIME",        width:5},
  {key:"destination", label:"DESTINATION", width:14},
  {key:"flight",      label:"FLIGHT",      width:8},
  {key:"gate",        label:"GATE",        width:4},
  {key:"remarks",     label:"REMARKS",     width:12}
];
var rowsEl = document.getElementById("rows");
var headEl = document.getElementById("colheads");
(function buildHeads(){
  COLS.forEach(function(c, i){
    if(i) { var s = document.createElement("div"); s.className = "spacer"; headEl.appendChild(s); }
    var cell = document.createElement("div"); cell.className = "cell";
    cell.style.width = "calc(var(--tile-w) * " + c.width + " + var(--gap) * " + (c.width-1) + ")";
    var sp = document.createElement("span"); sp.textContent = c.label; cell.appendChild(sp);
    headEl.appendChild(cell);
  });
})();
var tileGrid = []; /* [row][col] -> [tile elements] */
function buildRows(flights){
  rowsEl.innerHTML = ""; tileGrid = [];
  flights.forEach(function(f){
    var rowEl = document.createElement("div"); rowEl.className = "row";
    var gridRow = [];
    COLS.forEach(function(c, ci){
      if(ci){ var s = document.createElement("div"); s.className = "spacer"; rowEl.appendChild(s); }
      var cell = document.createElement("div"); cell.className = "cell " + c.key;
      var tiles = [];
      for(var k=0;k<c.width;k++){
        var t = document.createElement("div"); t.className = "tile"; t.textContent = " ";
        t.dataset.ch = " ";
        if(c.key === "remarks" && /FINAL|DELAY|CANCEL/.test(f.remarks||"")) t.classList.add("hot");
        cell.appendChild(t); tiles.push(t);
      }
      rowEl.appendChild(cell); gridRow.push(tiles);
    });
    rowsEl.appendChild(rowEl); tileGrid.push(gridRow);
  });
}

/* ============ Audio engine ============ */
var AC = null, clackBus = null, eventBus = null, ambBus = null, paBus = null;
var stepBufs = [], flapBufs = [], buffersReady = false;
var bedEl = null, bedBaseGain = 0, duckUntil = 0;
function initAudio(){
  if(AC) { if(AC.state === "suspended") AC.resume(); return; }
  try{ AC = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return; }
  clackBus = AC.createGain(); clackBus.connect(AC.destination);
  eventBus = AC.createGain(); eventBus.connect(AC.destination);
  ambBus   = AC.createGain(); ambBus.connect(AC.destination);
  paBus    = AC.createGain(); paBus.connect(AC.destination);
  applyLevels();
  loadSet(board.clackSet);
  setupBed();
  document.getElementById("sound-hint").style.display = "none";
}
function applyLevels(){
  if(!AC) return;
  var L = board.ambience.levels;
  clackBus.gain.value = 0.9 * L.clack;
  eventBus.gain.value = 0.9 * L.events;
  paBus.gain.value = L.announcements;
  bedBaseGain = board.ambience.on ? 0.5 * L.bed : 0;
  ambBus.gain.setTargetAtTime(bedBaseGain * (Date.now() < duckUntil ? 0.4 : 1), AC.currentTime, 0.4);
}
function loadSet(setName){
  stepBufs = []; flapBufs = []; buffersReady = false;
  if(!AC) return;
  var pending = 0;
  function grab(url, arr){
    pending++;
    fetch(url).then(function(r){ return r.arrayBuffer(); })
      .then(function(ab){ return AC.decodeAudioData(ab); })
      .then(function(buf){ arr.push(buf); })
      .catch(function(){})
      .then(function(){ if(--pending === 0) buffersReady = true; });
  }
  var n = SET_STEPS[setName] || 24, f = SET_FLAPS[setName] || 4, i;
  for(i=0;i<n;i++) grab("assets/audio/sets/" + setName + "/step-" + String(i).padStart(2,"0") + ".mp3", stepBufs);
  for(i=0;i<f;i++) grab("assets/audio/sets/" + setName + "/flap-" + String(i).padStart(2,"0") + ".mp3", flapBufs);
}
/* Round-robin bags: shuffled, never an immediate repeat */
function makeBag(n){ var a = []; for(var i=0;i<n;i++) a.push(i); for(var i=a.length-1;i>0;i--){ var j = Math.floor(Math.random()*(i+1)); var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
var stepBag = [], flapBag = [], lastStep = -1, lastFlap = -1;
function nextFrom(bagName, pool){
  var bag = bagName === "step" ? stepBag : flapBag;
  if(!bag.length){ bag = makeBag(pool.length); var last = bagName === "step" ? lastStep : lastFlap;
    if(bag.length > 1 && bag[bag.length-1] === last){ var t = bag[0]; bag[0] = bag[bag.length-1]; bag[bag.length-1] = t; }
    if(bagName === "step") stepBag = bag; else flapBag = bag; }
  var idx = bag.pop();
  if(bagName === "step") lastStep = idx; else lastFlap = idx;
  return pool[idx];
}
var activeVoices = 0;
function playBuf(buf, bus, when, rate, gainMul){
  if(!AC || !buf || activeVoices >= 24) return;
  var src = AC.createBufferSource(); src.buffer = buf;
  src.playbackRate.value = rate;
  var g = AC.createGain(); g.gain.value = gainMul;
  src.connect(g); g.connect(bus);
  src.onended = function(){ activeVoices--; };
  activeVoices++;
  src.start(when);
}
var IMPACT_LEAD = 0.045; /* impact sits ~45 ms into each slice */
function playStep(colFrac){
  if(!AC || !buffersReady || !stepBufs.length) return;
  var buf = nextFrom("step", stepBufs);
  var pan = AC.createStereoPanner ? null : null;
  playBuf(buf, clackBus, AC.currentTime + IMPACT_LEAD, 0.97 + Math.random()*0.06, 0.85 + Math.random()*0.3);
}
function playFlap(){
  if(!AC || !buffersReady || !flapBufs.length) return;
  playBuf(nextFrom("flap", flapBufs), eventBus, AC.currentTime + IMPACT_LEAD, 0.97 + Math.random()*0.06, 0.9 + Math.random()*0.25);
}
function duck(ms){
  if(!AC) return;
  duckUntil = Date.now() + ms;
  ambBus.gain.setTargetAtTime(bedBaseGain * 0.4, AC.currentTime, 0.25);
  setTimeout(function(){
    if(AC && Date.now() >= duckUntil) ambBus.gain.setTargetAtTime(bedBaseGain, AC.currentTime, 0.8);
  }, ms + 60);
}

/* Ambience bed: one looping element under everything, never paused once on */
function setupBed(){
  var bedFile = null;
  BEDS.forEach(function(b){ if(b[0] === board.ambience.bed) bedFile = b[2]; });
  if(!bedFile) return;
  if(bedEl){ bedEl.pause(); bedEl.remove(); bedEl = null; }
  if(!board.ambience.on || inQuietHours()) { applyLevels(); return; }
  bedEl = new Audio("assets/audio/beds/" + bedFile);
  bedEl.loop = true; bedEl.crossOrigin = "anonymous";
  try{
    var src = AC.createMediaElementSource(bedEl);
    src.connect(ambBus);
  }catch(e){ bedEl.volume = 0.4; }
  bedEl.play().catch(function(){});
  applyLevels();
}

/* ============ Signals and announcements ============ */
function tone(freq, t0, dur, gain){
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(paBus); o.start(t0); o.stop(t0 + dur + 0.05);
}
function playSignal(kind){
  if(!AC || kind === "none") return Promise.resolve();
  var t = AC.currentTime + 0.05, dur;
  if(kind === "cdg"){ /* modelled multi-note gesture */
    var notes = [1318.5, 1046.5, 783.99, 1046.5];
    notes.forEach(function(f, i){ tone(f, t + i*0.22, 0.5, 0.22); });
    dur = notes.length * 0.22 + 0.55;
  }else{ /* international double dong: high then low */
    tone(830.61, t, 0.7, 0.25); tone(622.25, t + 0.28, 0.9, 0.25);
    dur = 1.35;
  }
  return new Promise(function(res){ setTimeout(res, dur * 1000); });
}
function paFileFor(scriptId){
  for(var i=0;i<LIVE_PA.length;i++) if(LIVE_PA[i][0] === scriptId) return "assets/audio/pa/" + LIVE_PA[i][2];
  return "assets/audio/pa/" + scriptId + "--" + board.voice + ".mp3";
}
var paPlaying = false;
function playAnnouncement(scriptId){
  if(!AC || paPlaying) return;
  paPlaying = true;
  duck(12000);
  playSignal(board.signal).then(function(){
    var a = new Audio(paFileFor(scriptId));
    a.crossOrigin = "anonymous";
    try{ var s = AC.createMediaElementSource(a); s.connect(paBus); }catch(e){ a.volume = 0.9; }
    a.onended = function(){ paPlaying = false; };
    a.onerror = function(){ paPlaying = false; };
    a.play().catch(function(){ paPlaying = false; });
  });
}
var nextPaAt = Date.now() + 20000, paIdx = 0;
setInterval(function(){
  if(!AC || DEMO) return;
  if(!board.announcements.on || inQuietHours() || paPlaying) return;
  if(Date.now() < nextPaAt) return;
  var rot = board.announcements.rotation && board.announcements.rotation.length
    ? board.announcements.rotation : SCRIPTS.map(function(s){ return s[0]; });
  playAnnouncement(rot[paIdx % rot.length]); paIdx++;
  var span = Math.max(5, board.announcements.maxSec - board.announcements.minSec);
  nextPaAt = Date.now() + (board.announcements.minSec + Math.random()*span) * 1000;
}, 1000);

/* ============ Quiet hours ============ */
function inQuietHours(){
  var q = board.quietHours; if(!q || !q.on) return false;
  var now = new Date(), mins = now.getHours()*60 + now.getMinutes();
  function parse(s){ var p = String(s||"0:0").split(":"); return (+p[0])*60 + (+p[1]||0); }
  var a = parse(q.start), b = parse(q.end);
  return a <= b ? (mins >= a && mins < b) : (mins >= a || mins < b);
}

/* ============ Cascade rendering ============ */
var STEP_MS = 85;
function renderBoard(cascade){
  buildRows(board.flights);
  var jobs = []; /* {tile, from, to, delay} */
  board.flights.forEach(function(f, r){
    COLS.forEach(function(c, ci){
      var target = clean(f[c.key], c.width);
      for(var k=0;k<c.width;k++){
        var tile = tileGrid[r][ci][k];
        var from = tile.dataset.ch || " ";
        var steps = (ringIdx(target[k]) - ringIdx(from) + RING.length) % RING.length;
        if(!cascade) steps = 0;
        jobs.push({ tile: tile, from: from, to: target[k], steps: steps,
                    delay: r*55 + ci*130 + k*26 + Math.random()*22 });
      }
    });
  });
  var totalSteps = 0; jobs.forEach(function(j){ totalSteps += j.steps; });
  if(cascade && totalSteps > 40) duck(Math.min(9000, totalSteps * 9));
  var quiet = inQuietHours();
  jobs.forEach(function(j){
    if(j.steps === 0){ j.tile.textContent = j.to; j.tile.dataset.ch = j.to; return; }
    var thinning = Math.min(0.92, 0.25 + totalSteps / 260); /* dense cascades: fewer, softer ticks */
    setTimeout(function(){
      var pos = ringIdx(j.from), remaining = j.steps;
      var iv = setInterval(function(){
        pos = (pos + 1) % RING.length;
        var ch = RING[pos];
        j.tile.textContent = ch;
        j.tile.classList.remove("flip"); void j.tile.offsetWidth; j.tile.classList.add("flip");
        if(!quiet && Math.random() > thinning) playStep();
        if(--remaining <= 0){
          clearInterval(iv);
          j.tile.dataset.ch = j.to;
          j.tile.classList.remove("land"); void j.tile.offsetWidth; j.tile.classList.add("land");
          if(!quiet) playFlap();
        }
      }, STEP_MS);
    }, j.delay);
  });
}

/* ============ Fit the board to the screen ============ */
function fitBoard(){
  var units = 43 + 42 * 0.14 + 4 * 1.15; /* tiles + gaps + spacers, in tile widths */
  var availW = Math.min(window.innerWidth * 0.965, window.innerWidth - 24);
  var availH = (window.innerHeight * 0.94) / (9 * 1.42 + 3.4); /* rows + header, rough */
  var w = Math.max(10, Math.min(availW / units, availH, 96));
  document.documentElement.style.setProperty("--tile-w", w + "px");
}
fitBoard();
window.addEventListener("resize", fitBoard);

/* ============ Clock, wiring, live updates ============ */
function tickClock(){
  var d = new Date();
  document.getElementById("clock").textContent =
    String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
}
tickClock(); setInterval(tickClock, 1000);
renderBoard(false);
setTimeout(function(){ renderBoard(true); }, 600); /* opening cascade */

document.addEventListener("pointerdown", initAudio);
document.getElementById("btn-full").addEventListener("click", function(ev){
  ev.stopPropagation();
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
});
document.getElementById("btn-cascade").addEventListener("click", function(ev){
  ev.stopPropagation(); initAudio();
  tileGrid.forEach(function(row){ row.forEach(function(cell){ cell.forEach(function(t){ t.dataset.ch = " "; t.textContent = " "; }); }); });
  renderBoard(true);
});
if(!DEMO){
  window.addEventListener("storage", function(e){
    if(e.key !== "isle-board-config-v1" || !e.newValue) return;
    try{
      config = JSON.parse(e.newValue);
      var nb = config.boards[config.liveBoardId];
      if(!nb) return;
      var setChanged = nb.clackSet !== board.clackSet;
      var bedChanged = nb.ambience.bed !== board.ambience.bed || nb.ambience.on !== board.ambience.on;
      board = nb;
      if(AC){ applyLevels(); if(setChanged) loadSet(board.clackSet); if(bedChanged) setupBed(); }
      renderBoard(true);
    }catch(err){}
  });
}
</script>
</body>
