<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon.png" />
<link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
<link rel="mask-icon" href="/assets/safari-pinned-tab.svg" color="#1d2a3b" />
<title>The Isle · Flight Board</title>
<style>
  :root{
    --tile-w: clamp(18px, 2.05vw, 84px);
    --tile-h: calc(var(--tile-w) * 1.42);
    --gap: calc(var(--tile-w) * 0.14);
    --px: 24px;
    --ink: #f2ede1;
    --amber: #e8a33d;
    --board-bg: #000000;
    --tile-bg: #17181a;
  }
  *{ box-sizing: border-box; margin:0; padding:0; }
  html,body{ background:#000; height:100%; }
  body{
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    color: var(--ink);
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; overflow:hidden;
  }
  #board{
    background: var(--board-bg);
    padding: var(--pad-y, 2vh) var(--pad-x, 2vw);
  }
  header{
    display:flex; align-items:baseline; justify-content:space-between;
    padding: 0 0 calc(var(--tile-w) * 0.32);
    border-bottom: 1px solid #101011;
    margin-bottom: calc(var(--tile-w) * 0.34);
  }
  header .title{
    font-size: calc(var(--tile-w) * 1.02); line-height: 1.1;
    font-weight: 700; letter-spacing: .34em; text-transform: uppercase;
    white-space: nowrap;
  }
  header .title .dot{ color: var(--amber); letter-spacing: 0; }
  header .clock{
    font-size: calc(var(--tile-w) * 1.02); line-height: 1.1;
    font-weight: 700; letter-spacing: .18em; font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  @media (max-width: 760px){
    header .title{ font-size: 15px; letter-spacing: .16em; }
    header .clock{ font-size: 15px; letter-spacing: .1em; }
    #board{ padding: var(--pad-y, 2vh) var(--pad-x, 2vw); }
    .colheads .cell span{ font-size: 8px; letter-spacing: .12em; }
  }
  .colheads, .row{ display:flex; align-items:center; }
  .colheads{ padding: 0 0 calc(var(--tile-w) * 0.22); }
  .colheads span{
    font-size: calc(var(--tile-w) * 0.44); line-height: 1.1; letter-spacing: .3em;
    color:#8f8c82; text-transform: uppercase; font-weight: 600;
  }
  .row{ padding: var(--row-pad, 0.55vh) 0; }
  /* ---- fullscreen: the board fills the frame, and a real board has no footer ---- */
  body.fullscreen #sound-hint, body.fullscreen #chrome{ display: none !important; }
  .cell{ display:flex; gap: var(--gap); }
  .spacer{ width: calc(var(--tile-w) * 1.15); flex: none; }
  .tile{
    width: var(--tile-w); height: var(--tile-h); flex: none;
    background: linear-gradient(to bottom, #1d1e21 0%, #17181a 49.4%, #060607 49.6%, #060607 50.4%, #131416 50.6%, #101112 100%);
    border-radius: calc(var(--tile-w) * 0.09);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.045), inset 0 -6px 10px rgba(0,0,0,.55);
    display:flex; align-items:center; justify-content:center;
    font-size: calc(var(--tile-w) * 0.94);
    font-weight: 700; line-height: 1; color: var(--ink);
    text-shadow: 0 1px 0 rgba(0,0,0,.6);
    transform-origin: 50% 50%;
    user-select:none;
  }
  .tile.flip{ animation: tileflip 85ms ease-in; }
  @keyframes tileflip{
    0%{ transform: perspective(300px) rotateX(0deg); }
    55%{ transform: perspective(300px) rotateX(-38deg); filter: brightness(1.25); }
    100%{ transform: perspective(300px) rotateX(0deg); }
  }
  .tile.land{ animation: tileland 130ms ease-out; }
  @keyframes tileland{
    0%{ transform: scale(1.035); } 100%{ transform: scale(1); }
  }
  .row .remarks .tile{ color: var(--ink); }
  .row .remarks .tile.hot{ color: var(--amber); }
  /* ---- colour board ---- */
  #colour{ display:none; }
  #colour .pxgrid{ display:grid; gap: 2px; justify-content:center; }
  .px{
    width: var(--px); height: var(--px);
    border-radius: calc(var(--px) * 0.08);
    box-shadow: inset 0 0 0 1px rgba(255,255,255,.04);
  }
  .px.shimmer{ animation: pxflip 170ms ease-out; }
  @keyframes pxflip{
    0%{ transform: perspective(220px) rotateX(0deg); }
    50%{ transform: perspective(220px) rotateX(-42deg); filter: brightness(1.35); }
    100%{ transform: perspective(220px) rotateX(0deg); }
  }
  #demo-marker{
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    background: var(--amber); color:#111; font-weight:700; letter-spacing:.25em;
    font-size: 13px; padding: 6px 16px 6px 19px; border-radius: 4px; display:none; z-index: 40;
  }
  #chrome{
    position: fixed; right: 2vw; bottom: 16px; display:flex; gap:10px; align-items:center; z-index: 40;
  }
  #chrome button{
    background: rgba(20,20,22,.85); color:#cfccc2; border:1px solid #33343a;
    font: 600 12px/1 "Helvetica Neue", Arial, sans-serif; letter-spacing:.14em;
    height: 34px; padding: 0 14px; border-radius: 6px; cursor: pointer; text-transform: uppercase;
  }
  #chrome button:hover{ color:#fff; border-color:#55565e; }
  #sound-hint{
    position: fixed; left: 2vw; bottom: 16px; height: 34px; z-index: 40;
    display:flex; align-items:center;
    color:#7d7a70; font-size: 12px; letter-spacing:.18em; text-transform: uppercase;
  }
  @media (max-width: 760px){
    #chrome{ gap: 6px; }
    #chrome button{ height: 30px; padding: 0 8px; font-size: 10px; letter-spacing: .1em; }
    #sound-hint{ height: 30px; font-size: 9px; letter-spacing: .1em; }
  }

  /* ============ Board styles: per-board display languages ============ */
  #styled{ display:none; width:100%; height:100%; position:relative; overflow:hidden; }
  #pixcap{ display:none; align-items:center; margin: 0 auto; padding-top: 1.2vh; }
  #pixcap .pc-tiles{ display:flex; gap:3px; flex:none; }
  #pixcap .pc-tile{ background:linear-gradient(180deg,#26282c 0%,#1b1c1f 49%,#101112 50%,#1e2023 100%); color:#f2efe3; font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; font-weight:600; display:flex; align-items:center; justify-content:center; border-radius:2px; position:relative; overflow:hidden; width:1.55vw; height:2.35vw; font-size:1.02vw; box-shadow: inset 0 0 0 1px #000; }
  #pixcap .pc-tile::after{ content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(0,0,0,.6); }
  #pixcap .pc-msg{ color:#e8e6df; letter-spacing:.14em; font-weight:600; white-space:nowrap; overflow:hidden; font-size:1.02vw; margin-left:1.1vw; font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; }
  #pixcap .pc-msg b{ color:#ffb43a; }
  #pixcap .pc-clock{ margin-left:auto; color:#e8e6df; font-weight:600; letter-spacing:.1em; font-size:1.02vw; font-family:"Helvetica Neue", Helvetica, Arial, sans-serif; }

  /* Gallery Six: the board as furniture on a gallery wall */
  .st-gallery{ position:absolute; inset:0; background:linear-gradient(180deg,#e9e3d5 0%,#e3dac6 55%,#ded5c2 100%); font-family:"Source Sans 3","Helvetica Neue",Arial,sans-serif; color:#26241f; display:flex; flex-direction:column; }
  .st-gallery .g-plaque{ display:flex; align-items:flex-end; justify-content:space-between; }
  .st-gallery .g-title{ font-family:Fraunces, Georgia, serif; font-weight:600; color:#221f1a; line-height:1.02; }
  .st-gallery .g-sub{ letter-spacing:.30em; color:#7a7261; font-weight:600; }
  .st-gallery .g-clock{ text-align:right; }
  .st-gallery .g-clock .t{ font-family:Fraunces, Georgia, serif; font-weight:600; color:#221f1a; line-height:1; }
  .st-gallery .g-clock .l{ letter-spacing:.26em; color:#7a7261; font-weight:600; }
  .st-gallery .g-board{ background:linear-gradient(180deg,#1d1d1c,#101010); border:1px solid #2c2c2c; border-radius:10px; box-shadow:0 30px 60px -18px rgba(30,25,15,.45), 0 90px 140px -60px rgba(30,25,15,.35); margin:0 auto; }
  .st-gallery .g-grid{ display:grid; }
  .st-gallery .g-tile{ background:linear-gradient(180deg,#262624 0%,#1b1b1a 49%,#141413 50%,#1e1e1d 100%); color:#f2efe3; font-family:Archivo,"Helvetica Neue",sans-serif; font-weight:600; display:flex; align-items:center; justify-content:center; border-radius:3px; position:relative; overflow:hidden; width:100%; height:100%; }
  .st-gallery .g-tile::after{ content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(0,0,0,.6); }
  .st-gallery .g-tile.settle{ animation:gsettle .18s ease-out; }
  @keyframes gsettle{ 0%{ transform:translateY(-6%); } 60%{ transform:translateY(2%); } 100%{ transform:none; } }
  .st-gallery .g-foot{ display:flex; align-items:center; justify-content:space-between; color:#8f887a; letter-spacing:.24em; font-weight:600; }
  .st-gallery .g-dots{ display:flex; }
  .st-gallery .g-dots i{ border-radius:50%; display:block; }

  /* F Clipper: Pan Am Jet Age, pale sky and navy tiles */
  .st-clipper{ position:absolute; inset:0; background:#f5f8fa; color:#101418; font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; display:flex; }
  .st-clipper .c-rail{ border-right:1px solid #d7dee3; display:flex; flex-direction:column; flex:none; }
  .st-clipper .c-time{ font-weight:700; color:#0b0e12; line-height:.95; }
  .st-clipper .c-date{ color:#33404c; font-weight:600; }
  .st-clipper .c-rule{ background:#00a3d9; }
  .st-clipper .c-note{ color:#5a6a76; }
  .st-clipper .c-main{ flex:1; display:flex; flex-direction:column; min-width:0; }
  .st-clipper .c-word{ font-weight:700; color:#0a1f6e; letter-spacing:-0.01em; line-height:1; }
  .st-clipper .c-word .dot{ color:#00a3d9; }
  .st-clipper .c-sub{ letter-spacing:.34em; color:#0a2a7a; font-weight:600; }
  .st-clipper .c-bank{ }
  .st-clipper .c-bank + .c-bank{ border-top:1px solid #bcd2e8; }
  .st-clipper .c-bankname{ letter-spacing:.30em; color:#0a2a7a; font-weight:700; }
  .st-clipper .c-heads, .st-clipper .c-row{ display:flex; align-items:center; }
  .st-clipper .c-heads{ color:#7c8a96; letter-spacing:.22em; font-weight:600; }
  .st-clipper .c-timecell{ font-weight:700; color:#0b0e12; flex:none; }
  .st-clipper .c-tiles{ display:flex; flex:none; }
  .st-clipper .c-tile{ background:linear-gradient(180deg,#fdfdfb 0%,#f4f4ef 49%,#e9e9e2 50%,#f1f1ea 100%); color:#0a2472; font-weight:600; display:flex; align-items:center; justify-content:center; border:1px solid #d8d8d0; border-radius:2px; position:relative; overflow:hidden; }
  .st-clipper .c-tile::after{ content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(20,30,60,.18); }
  .st-clipper .c-tile.flip{ animation:cflip .16s ease-out; }
  @keyframes cflip{ 0%{ transform:rotateX(55deg); } 100%{ transform:none; } }
  .st-clipper .c-clip{ font-style:italic; color:#20303e; white-space:nowrap; overflow:hidden; }
  .st-clipper .c-rem{ font-weight:700; color:#0a2a7a; letter-spacing:.06em; white-space:nowrap; }
  .st-clipper .c-rem.quiet{ color:#8ba3c9; font-weight:600; }
  .st-clipper .c-rem.final{ color:#0b0e12; }

  /* G Patapata: the white Japanese platform board */
  .st-patapata{ position:absolute; inset:0; background:#fdfdfc; color:#17181a; font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; display:flex; flex-direction:column; }
  .st-patapata .p-jp{ color:#d42b1e; font-weight:700; letter-spacing:.42em; }
  .st-patapata .p-name{ font-weight:800; color:#101114; line-height:1; }
  .st-patapata .p-kata{ color:#8a8d91; font-weight:600; letter-spacing:.18em; }
  .st-patapata .p-disc{ background:#d42b1e; color:#fff; border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center; flex:none; }
  .st-patapata .p-disc .l{ letter-spacing:.3em; font-weight:600; }
  .st-patapata .p-rule{ background:#d42b1e; flex:none; }
  .st-patapata .p-heads{ display:flex; align-items:center; color:#6d7074; font-weight:700; }
  .st-patapata .p-heads .jp{ color:#17181a; }
  .st-patapata .p-row{ display:flex; align-items:center; border-top:1px solid #e3e4e2; }
  .st-patapata .p-badge{ color:#fff; font-weight:800; letter-spacing:.04em; display:flex; align-items:center; justify-content:center; text-align:center; border-radius:3px; position:relative; overflow:hidden; flex:none; line-height:1.08; box-shadow:inset 0 -14px 18px -14px rgba(0,0,0,.55); }
  .st-patapata .p-badge::after{ content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(0,0,0,.28); }
  .st-patapata .p-time{ font-weight:800; color:#101114; flex:none; }
  .st-patapata .p-dest{ background:linear-gradient(180deg,#26282c,#232529); color:#f4f2ea; font-weight:700; letter-spacing:.10em; display:flex; align-items:center; border-radius:3px; position:relative; overflow:hidden; flex:1; white-space:nowrap; }
  .st-patapata .p-dest.flip{ animation:cflip .22s ease-out; }
  .st-patapata .p-status{ font-weight:700; color:#3c3f44; flex:none; white-space:nowrap; }
  .st-patapata .p-status.alert{ color:#d42b1e; }

  /* H Dator: the Solari clock as the board */
  .st-dator{ position:absolute; inset:0; background:#060606; color:#f2f0e9; font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; display:flex; flex-direction:column; }
  .st-dator .d-top{ display:flex; justify-content:space-between; color:#8f8c85; letter-spacing:.34em; font-weight:600; }
  .st-dator .d-top b{ color:#f2f0e9; font-weight:700; }
  .st-dator .d-stage{ flex:1; display:flex; align-items:center; }
  .st-dator .d-stack{ display:flex; flex-direction:column; flex:none; }
  .st-dator .d-lab{ color:#8f8c85; letter-spacing:.30em; font-weight:600; }
  .st-dator .d-tiles{ display:flex; }
  .st-dator .d-tile{ background:linear-gradient(180deg,#26282c 0%,#1b1c1f 49%,#101112 50%,#1e2023 100%); color:#f5f3ec; font-weight:700; display:flex; align-items:center; justify-content:center; border-radius:4px; position:relative; overflow:hidden; box-shadow:inset 0 0 0 1px #000, 0 2px 5px rgba(0,0,0,.6); }
  .st-dator .d-tile::after{ content:""; position:absolute; left:0; right:0; top:50%; height:1px; background:rgba(0,0,0,.65); }
  .st-dator .d-tile.dim{ color:#55534e; }
  .st-dator .d-tile.amb{ color:#ffb43a; }
  .st-dator .d-tile.flip{ animation:cflip .16s ease-out; }
  .st-dator .d-clock{ display:flex; align-items:center; justify-content:center; flex:1; }
  .st-dator .d-dig.min{ font-family:"DejaVu Sans","Liberation Sans",sans-serif; font-weight:600; }
  .st-dator .d-colon{ display:flex; flex-direction:column; align-items:center; justify-content:center; flex:none; }
  .st-dator .d-colon i{ background:#f5f3ec; border-radius:50%; display:block; }
  .st-dator .d-foot{ border-top:1px solid #232323; display:flex; align-items:center; }

  /* J Projekt 1400: Aicher's system, melon yellow and night blue */
  .st-projekt{ position:absolute; inset:0; background:#ffffff; color:#22224a; font-family:"Helvetica Neue",Helvetica,Arial,sans-serif; display:flex; flex-direction:column; }
  .st-projekt .j-head{ background:#f2a900; display:flex; align-items:center; flex:none; }
  .st-projekt .j-logo{ background:#22224a; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none; }
  .st-projekt .j-name{ font-weight:700; color:#22224a; line-height:1; }
  .st-projekt .j-sub{ color:#22224a; }
  .st-projekt .j-clock{ margin-left:auto; text-align:right; flex:none; }
  .st-projekt .j-clock .t{ font-weight:700; line-height:1; }
  .st-projekt .j-heads{ display:flex; align-items:center; color:#22224a; font-weight:600; border-bottom:5px solid #22224a; }
  .st-projekt .j-row{ display:flex; align-items:center; border-bottom:1px solid #d8daea; }
  .st-projekt .j-row.flip{ animation:jflip .3s ease-out; transform-origin:top center; }
  @keyframes jflip{ 0%{ transform:rotateX(70deg); opacity:.4; } 100%{ transform:none; opacity:1; } }
  .st-projekt .j-time{ font-weight:700; flex:none; }
  .st-projekt .j-ziel{ flex:none; white-space:nowrap; overflow:hidden; }
  .st-projekt .j-flug{ color:#5a5e8c; flex:none; white-space:nowrap; }
  .st-projekt .j-pic{ flex:none; display:flex; align-items:center; }
  .st-projekt .j-rem{ white-space:nowrap; overflow:hidden; }
  .st-projekt .j-rem.strong{ font-weight:700; }
  .st-projekt .j-strip{ border-top:5px solid #22224a; display:flex; align-items:center; flex:none; }
  .st-projekt .j-cell{ display:flex; align-items:center; white-space:nowrap; }
  .st-projekt .j-cell .a{ font-weight:700; }
  .st-projekt .j-cell .b{ color:#5a5e8c; }
</style>

<body>
<div id="demo-marker">DEMO</div>
<main id="board" aria-label="Departures board">
  <header>
    <div class="title" id="board-title">THE ISLE <span class="dot">·</span> DEPARTURES</div>
    <div class="clock" id="clock">--:--</div>
  </header>
  <div class="colheads" id="colheads"></div>
  <div id="rows"></div>
  <div id="colour" aria-label="Colour board picture"></div>
  <div id="pixcap" aria-label="Next departure"></div>
  <div id="styled" aria-label="Styled board"></div>
</main>
<div id="sound-hint">Tap anywhere for sound</div>
<div id="chrome">
  <button id="btn-cascade" type="button">Refresh board</button>
  <button id="btn-full" type="button">Fullscreen</button>
</div>
<script>
"use strict";
/* ============ Shared catalogue (keep in step with settings page) ============ */
var VOICES = [
  ["aria","Aria · American (F)"],["helio","Helio · American (M)"],
  ["isabella","Isabella · British (F)"],["magnus","Magnus · British (M)"],
  ["sunny","Sunny · Australian (F)"],["conor","Conor · Irish (M)"],
  ["thai","Thai (F)"],["singaporean","Singaporean (F)"],["japanese","Japanese (F)"]
];
var SCRIPTS = [
  ["the-isle-final","The Isle · final call"],["the-isle-boarding","The Isle · boarding"],
  ["honolulu","Honolulu · boarding"],["bora-bora","Bora Bora · boarding"],
  ["phuket","Phuket · final call"],["miami-test","Miami · final call"],
  ["page-cakes","Page · Cakes to The Isle Lounge"],
  ["page-party-waiting","Page · your party is waiting"],
  ["page-mrs-silver","Page · Mrs. Silver to the lounge"]
];
var LIVE_PA = [
  ["live-frankfurt","Live recording · Frankfurt (German/English)","pa-frankfurt.mp3"],
  ["live-boarding","Live recording · Boarding call (CC0)","pa-boarding-cc0.mp3"],
  ["live-midway","Live recording · Chicago Midway","pa-midway.mp3"],
  ["live-bangkok-airasia","Live recording · Bangkok Don Mueang · AirAsia arrival (Thai/English/Chinese)","pa-bangkok-arrival-airasia.mp3"],
  ["live-bangkok-lion-chiangmai","Live recording · Bangkok Don Mueang · Lion Air arrival, Chiang Mai (Thai/English/Chinese)","pa-bangkok-arrival-lion-chiangmai.mp3"],
  ["live-bangkok-lion","Live recording · Bangkok Don Mueang · Lion Air arrival (Thai/English/Chinese)","pa-bangkok-arrival-lion.mp3"],
  ["live-bangkok-tiger","Live recording · Bangkok Don Mueang · Tiger Air arrival (Thai/English/Chinese)","pa-bangkok-arrival-tiger.mp3"],
  ["live-bangkok-belongings","Live recording · Bangkok Don Mueang · Do not leave belongings (Thai/English/Chinese)","pa-bangkok-belongings.mp3"],
  ["live-bangkok-powerbank","Live recording · Bangkok Don Mueang · Power bank notice (Thai/English/Chinese)","pa-bangkok-powerbank.mp3"]
];
var SETS = [["pragotron","Pragotron module"],["frankfurt","Frankfurt hall"],
            ["barcelona","Barcelona Sants"],["madeira","Madeira airport"],
            ["philadelphia","Philadelphia big board"]];
var BEDS = [["manchester","Manchester Airport","ambience-manchester-airport.mp3"],
            ["kualalumpur","Kuala Lumpur Airport","ambience-kualalumpur-calm.mp3"],
            ["lanzarote","Lanzarote Airport","ambience-lanzarote-airport.mp3"],
            ["rdu","Raleigh-Durham Terminal","ambience-rdu-terminal.mp3"],
            ["zurich","Zurich Airport","ambience-zurich-airport.mp3"],
            ["schiphol","Schiphol Airport","ambience-schiphol-airport.mp3"],
            ["heathrow","Heathrow Airport","ambience-heathrow-airport.mp3"]];
/* Exact sample files on disk per set (pragotron steps are every third slice) */
function range(n){ var a = []; for(var i=0;i<n;i++) a.push(i); return a; }
var SET_FILES = {

/* Append any missing demo boards to a config; never overwrite a user's board.
   Sets liveBoardId only when it is missing or dangling (fresh/empty library). */
function mergeSeeds(cfg){
  if(!cfg || typeof cfg !== "object") cfg = {};
  if(!cfg.boards || typeof cfg.boards !== "object") cfg.boards = {};
  var wasEmpty = Object.keys(cfg.boards).length === 0;
  var changed = false;
  var demos = demoBoards();
  if((cfg.seedVersion || 0) < SEED_VERSION){
    demos.forEach(function(sb){
      var nameTaken = Object.keys(cfg.boards).some(function(id){ return cfg.boards[id].name === sb.name; });
      if(nameTaken) return;
      if(cfg.boards[sb.id]){ sb.id = sb.id + "-seed"; }
      cfg.boards[sb.id] = sb; changed = true;
    });
    cfg.seedVersion = SEED_VERSION; changed = true;
  }
  /* Field fill-ins for boards stored before rows/kind existed: a board whose
     name matches a demo board takes that demo's row count; anything else
     defaults to 14. User boards and their edits are never overwritten. */
  Object.keys(cfg.boards).forEach(function(id){
    var b = cfg.boards[id];
    if(!b) return;
    if(!b.type){ b.type = "departures"; changed = true; }
    if(b.rows !== 5 && b.rows !== 14){
      var demo = null;
      demos.forEach(function(d){ if(d.name === b.name) demo = d; });
      b.rows = demo && demo.rows ? demo.rows : 14; changed = true;
    }
    if(b.type !== "colour" && !b.kind){
      b.kind = b.shows === "arrivals" ? "arrivals" : "departures"; changed = true;
    }
    if(b.type === "colour" && !b.scene){ b.scene = "walk"; changed = true; }
    if(b.type === "colour" && !(b.night >= 1 && b.night <= 8)){ b.night = 8; changed = true; }
    if(!b.style){ b.style = "isle"; changed = true; }
    if(!b.sceneSounds){ b.sceneSounds = { on:false, level:0.5 }; changed = true; }
    if(!b.flights){ b.flights = []; changed = true; }
    if(!b.lines){ b.lines = []; changed = true; }
  });
  if(!cfg.liveBoardId || !cfg.boards[cfg.liveBoardId]){
    cfg.liveBoardId = (wasEmpty && cfg.boards["board-terminal-one"])
      ? "board-terminal-one" : Object.keys(cfg.boards)[0];
    changed = true;
  }
  return { cfg: cfg, changed: changed };
}
function loadConfig(){
  var parsed = null;
  try{
    var raw = localStorage.getItem("isle-board-config-v1");
    if(raw) parsed = JSON.parse(raw);
  }catch(e){}
  var res = mergeSeeds(parsed);
  if(res.changed || !parsed){
    try{ localStorage.setItem("isle-board-config-v1", JSON.stringify(res.cfg)); }catch(e){}
  }
  return res.cfg;
}
function stagedBoard(){
  try{
    var raw = localStorage.getItem("isle-board-demo-v1");
    if(!raw) return null;
    var parsed = JSON.parse(raw);
    if(!parsed || !parsed.boards) return null;
    var res = mergeSeeds(parsed);
    if(res.changed){
      try{ localStorage.setItem("isle-board-demo-v1", JSON.stringify(res.cfg)); }catch(e){}
    }
    /* The staged config names the board being edited (demoBoardId, written
       by settings on every staged save): a demo shows THAT board, not
       whichever board happens to be live. Staged configs saved before the
       field existed fall back to the live board. */
    return res.cfg.boards[res.cfg.demoBoardId] || res.cfg.boards[res.cfg.liveBoardId] || null;
  }catch(e){}
  return null;
}

}
function hill(g, W, H, cx, gy, hw, hh, c, dk){
  for(var x = -hw; x <= hw; x++){
    var f = 1 - (x / hw) * (x / hw);
    var top = Math.round(gy - hh * f);
    for(var y = top; y < gy; y++){
      put(g, W, H, cx + x, y, c);
      if(H2((cx + x) * 3.1 + y * 7.7) > 0.93) put(g, W, H, cx + x, y, dk);

  }
}
function cloud(g, W, H, cx, cy, s, c){

  ellipse(g, W, H, cx - Math.round(4 * s), cy + 1, Math.round(4 * s), Math.round(1.8 * s), c);
  ellipse(g, W, H, cx + Math.round(4 * s), cy + 1, Math.round(4.5 * s), Math.round(1.9 * s), c);
  ellipse(g, W, H, cx + Math.round(1 * s), cy - Math.round(1.6 * s), Math.round(3.6 * s), Math.round(1.7 * s), c);

function backdrop(g, W, H, t, sky, grn, dk, cloudC, sunC){
  var i, gy = Math.round(H * 0.78);
  for(i = 0; i < W * H; i++) g[i] = sky;
  if(sunC) circle(g, W, H, Math.round(W * 0.86), Math.round(H * 0.16), Math.max(2, Math.round(H * 0.09)), sunC);
  hill(g, W, H, Math.round(W * 0.16), gy, Math.round(W * 0.15), Math.round(H * 0.30), grn, dk);
  hill(g, W, H, Math.round(W * 0.62), gy, Math.round(W * 0.10), Math.round(H * 0.20), grn, dk);
  var cw = W + 30;
  cloud(g, W, H, Math.round(((t * 1.1) % cw) - 15), Math.round(H * 0.15), Math.max(0.7, W / 64), cloudC);
  cloud(g, W, H, Math.round(((t * 0.6 + W * 0.5) % cw) - 15), Math.round(H * 0.32), Math.max(0.55, W / 80), cloudC);
  rect(g, W, H, 0, gy, W, H - gy, grn);
  for(var x = 0; x < W; x += 4) put(g, W, H, x, gy + 2, dk);
  return gy;
}

/* ---------- menorah (ported) ---------- */
function drawMenorah(g, W, H, t, night){
  var i; for(i = 0; i < W * H; i++) g[i] = DARK;
  var GOLD = "#c9a227", IVORY = "#f2ead8", FLAME = "#f4a81c", CORE = "#ffe9a8";
  var cx = Math.floor(W / 2), sp = Math.max(3, Math.round(W / 13));
  var baseY = H - 3, armBaseY = Math.round(H * 0.66), stemTopY = Math.round(H * 0.60);
  var order = [8, 7, 6, 5, 3, 2, 1, 0];
  var lit = { 4: true };
  for(i = 0; i < night && i < 8; i++) lit[order[i]] = true;
  var p, k, x;
  for(p = 0; p < 9; p++){
    k = p - 4; x = cx + k * sp;
    var hgt = Math.round((H * 0.30) * Math.pow(Math.abs(k) / 4, 1.6));
    var armTopY = armBaseY - hgt;
    /* arm: a curve from the stem out and up to the candle column */
    for(var s2 = 0; s2 <= 1.0001; s2 += 0.08){
      var ax = cx + (x - cx) * s2;
      var ay = stemTopY + (armTopY - stemTopY) * (s2 * s2);
      put(g, W, H, Math.round(ax), Math.round(ay), GOLD);
      put(g, W, H, Math.round(ax), Math.round(ay) + 1, GOLD);
    }
    var candleH = (p === 4) ? Math.round(H * 0.20) : Math.round(H * 0.15);
    var topY = armTopY - candleH;
    rect(g, W, H, x, topY, 1, candleH, IVORY);
    put(g, W, H, x - 1, armTopY, GOLD); put(g, W, H, x + 1, armTopY, GOLD);
    if(lit[p]){
      var fl = H2(Math.floor(t * 7) * 13 + p * 29) > 0.5 ? 1 : 0;
      put(g, W, H, x, topY - 1, FLAME);
      put(g, W, H, x + fl, topY - 2, FLAME);
      put(g, W, H, x, topY - 2, CORE);
    }
  }
  rect(g, W, H, cx, stemTopY, 1, baseY - stemTopY, GOLD);
  rect(g, W, H, cx - Math.round(sp * 0.9), baseY - 1, Math.round(sp * 1.8), 1, GOLD);
  rect(g, W, H, cx - Math.round(sp * 1.3), baseY, Math.round(sp * 2.6), 1, GOLD);
  rect(g, W, H, cx - Math.round(sp * 1.7), baseY + 1, Math.round(sp * 3.4), 1, GOLD);
}

var DREIDEL_LETTERS = ["nun", "gimmel", "hey", "shin"];
function drawDreidel(g, W, H, t){
  var gy = backdrop(g, W, H, t, SKY, "#00a800", "#007800", "#fcfcfc", "#fcfc54");
  var cx = Math.floor(W / 2), topY = Math.round(H * 0.14);
  var bodyH = Math.round(H * 0.44), maxW = Math.round(W * 0.42);
  var phase = t * 2.4, wF = Math.abs(Math.cos(phase));
  var bw = Math.max(3, Math.round(3 + (maxW - 3) * wF));
  var bx = cx - Math.floor(bw / 2), by = topY + Math.round(H * 0.08);
  rect(g, W, H, cx - 1, topY, 2, Math.round(H * 0.08), "#8a5a20");
  rect(g, W, H, bx, by, bw, bodyH, "#2456c8");
  rect(g, W, H, bx, by, bw, 1, "#7ea4f2");
  var tipY = by + bodyH, tipH = Math.max(2, Math.round(H * 0.10));
  for(var r2 = 0; r2 < tipH; r2++){
    var tw = Math.max(1, Math.round(bw * (1 - r2 / tipH) / 2));
    rect(g, W, H, cx - tw, tipY + r2, tw * 2, 1, "#2456c8");
  }
  if(bw >= 9 && tipY < gy + 2){
    var letter = DREIDEL_LETTERS[Math.floor(phase / (Math.PI / 2)) % 4];

/* ---------- level: an original first level in the NES manner ---------- */
var LV_TILES_Y = 9, LV_WORLD = 172;
var LV_PIPES = [{ x: 18, h: 2 }, { x: 52, h: 3 }, { x: 100, h: 2 }];
var LV_PITS = [[38, 40], [88, 90]];
var LV_SPANS = [[6, 10], [24, 27], [44, 46], [70, 74], [96, 99], [118, 121]];
function lvPit(tx){
  for(var i = 0; i < LV_PITS.length; i++) if(tx >= LV_PITS[i][0] && tx <= LV_PITS[i][1]) return true;
  return false;
}
function lvTile(tx, ty){
  if(tx < 0 || tx >= LV_WORLD) return 0;
  if(ty >= 7){ return lvPit(tx) ? 0 : (ty === 7 ? "G" : "g"); }
  var i;
  for(i = 0; i < LV_PIPES.length; i++){
    var p = LV_PIPES[i];
    if(tx === p.x || tx === p.x + 1){
      if(ty === 7 - p.h) return "P";
      if(ty > 7 - p.h) return "p";
    }
  }
  for(i = 0; i < 4; i++){
    if(tx === 128 + i && ty >= 7 - (i + 1)) return "B";
    if(tx === 133 + i && ty >= 7 - (4 - i)) return "B";
  }
  if(ty === 3){
    for(i = 0; i < LV_SPANS.length; i++){
      if(tx >= LV_SPANS[i][0] && tx <= LV_SPANS[i][1]) return ((tx - LV_SPANS[i][0]) % 2 === 0) ? "?" : "B";
    }
  }
  if(tx >= 154 && tx <= 157 && ty >= 4){
    if(ty === 4 && tx !== 155 && tx !== 156) return "B";
    if(ty >= 5) return "B";
  }
  return 0;
}
function lvTileDraw(g, W, H, sx, sy, TS, kind){
  var x, y;
  if(kind === "G" || kind === "g"){
    rect(g, W, H, sx, sy, TS, TS, "#c84c0c");
    if(kind === "G") rect(g, W, H, sx, sy, TS, 1, "#fca044");
    for(y = 1; y < TS; y += 2) for(x = 0; x < TS; x += 2)
      if(H2((sx + x) * 1.7 + (sy + y) * 3.1) > 0.6) put(g, W, H, sx + x, sy + y, "#7c3806");
  } else if(kind === "B"){
    rect(g, W, H, sx, sy, TS, TS, "#c84c0c");
    rect(g, W, H, sx, sy, TS, 1, "#5e2403");
    rect(g, W, H, sx, sy + Math.floor(TS / 2), TS, 1, "#5e2403");
    put(g, W, H, sx + Math.floor(TS / 2), sy, "#5e2403");
    put(g, W, H, sx + 1, sy + Math.floor(TS / 2), "#5e2403");
    put(g, W, H, sx + TS - 1, sy + Math.floor(TS / 2), "#5e2403");
  } else if(kind === "?"){
    rect(g, W, H, sx, sy, TS, TS, "#f8b800");
    rect(g, W, H, sx, sy, TS, 1, "#9c5a00"); rect(g, W, H, sx, sy + TS - 1, TS, 1, "#9c5a00");
    rect(g, W, H, sx, sy, 1, TS, "#9c5a00"); rect(g, W, H, sx + TS - 1, sy, 1, TS, "#9c5a00");
    put(g, W, H, sx + Math.floor(TS / 2), sy + Math.floor(TS / 2), "#9c5a00");
    put(g, W, H, sx + 1, sy + 1, "#9c5a00"); put(g, W, H, sx + TS - 2, sy + 1, "#9c5a00");
    put(g, W, H, sx + 1, sy + TS - 2, "#9c5a00"); put(g, W, H, sx + TS - 2, sy + TS - 2, "#9c5a00");
  } else if(kind === "P" || kind === "p"){
    rect(g, W, H, sx, sy, TS, TS, "#00a800");
    rect(g, W, H, sx, sy, Math.max(1, Math.floor(TS / 3)), TS, "#80d010");
    rect(g, W, H, sx + TS - 1, sy, 1, TS, "#005800");
    if(kind === "P"){ rect(g, W, H, sx - 1, sy, TS + 2, 1, "#005800"); rect(g, W, H, sx - 1, sy + TS - 1, TS + 2, 1, "#005800"); }
  }
}
var RUNNER_A = [
  ".rrrrr..","rrrrrrr.","ssssss..","ssssss..","rbbbbbr.",".bbbb...",".bb.bb..","hh...hh."
];
var RUNNER_B = [
  ".rrrrr..","rrrrrrr.","ssssss..","ssssss..","rbbbbbr.",".bbbb...","..bbb...",".hh.hh.."
];
var SHELL_SM = [".llll.","lwwwwl","gggggg",".gggg.","..gg.."];
function lvGroundTop(tx){ return lvPit(tx) ? -1 : 7; }
function drawLevel(g, W, H, st, t, dt){
  var i; for(i = 0; i < W * H; i++) g[i] = SKY;
  var TS = Math.max(3, Math.round(H / LV_TILES_Y));
  var gy = 7 * TS;
  if(!st.lv) st.lv = { off: 0, wy: 0, vy: 0, air: false, shellWX: 30 * TS, shellV: 0 };
  var s = st.lv;
  /* --- physics, in tile units --- */
  var spd = 3.0; /* tiles per second */
  s.off += spd * TS * dt;
  var wxT = (s.off + W * 0.22) / TS; /* walker world x, tiles */
  var frontTx = Math.floor(wxT + 0.9);
  if(!s.air){
    if(lvGroundTop(frontTx) < 0){ s.air = true; s.vy = 0; }
    else if(lvGroundTop(Math.floor(wxT + 1.6)) < 0){ s.air = true; s.vy = -12.5; }
  }
  if(s.air){
    s.wy += s.vy * dt; s.vy += 20 * dt;
    if(s.wy >= 0){
      if(lvGroundTop(frontTx) >= 0){ s.wy = 0; s.air = false; s.vy = 0; }
      else if(s.wy > 3){ s.wy = 0; s.vy = -12.5; } /* safety hop over a long fall */
    }
  }
  var walkerWX = s.off + W * 0.22;
  if(s.shellV > 0.4 * TS){
    s.shellWX += s.shellV * dt;
    s.shellV *= Math.pow(0.35, dt);
    var stx = Math.floor((s.shellWX + 6) / TS);
    if(lvTile(stx, 6) || lvPit(stx)) s.shellV = 0;
  } else if(!s.air && walkerWX + 9 >= s.shellWX && walkerWX < s.shellWX + 4 && s.shellWX < LV_WORLD * TS - 20 * TS){
    s.shellV = 7 * TS;
  }
  if(lvPit(Math.floor(s.shellWX / TS)) && s.shellV <= 0.4 * TS) s.shellWX = walkerWX + 42 * TS;
  if(s.off > LV_WORLD * TS - W - TS){ s.off = 0; s.shellWX = 30 * TS; s.shellV = 0; s.wy = 0; s.air = false; }
  /* --- scenery behind the tiles --- */
  var off = s.off;
  hill(g, W, H, Math.round(6 * TS - off), gy, 6 * TS, Math.round(H * 0.34), "#00a800", "#007800");
  hill(g, W, H, Math.round(60 * TS - off), gy, 4 * TS, Math.round(H * 0.20), "#00a800", "#007800");
  var cw2 = [[8, 1], [30, 0], [58, 1], [84, 0], [120, 1], [150, 0]];
  for(i = 0; i < cw2.length; i++)
    cloud(g, W, H, Math.round(cw2[i][0] * TS - off + TS / 2), Math.round(cw2[i][1] * TS + TS * 0.6), Math.max(0.8, TS / 3.4), "#fcfcfc");
  var bushX = [12, 66, 112];
  for(i = 0; i < bushX.length; i++)
    ellipse(g, W, H, Math.round(bushX[i] * TS - off), gy - 1, Math.round(TS * 1.6), Math.max(1, Math.round(TS * 0.55)), "#00a800");
  /* --- tiles --- */
  var tx0 = Math.floor(off / TS);
  for(var tx = tx0; tx <= tx0 + Math.ceil(W / TS) + 1; tx++){
    for(var ty = 0; ty < LV_TILES_Y; ty++){
      var kind = lvTile(tx, ty);
      if(kind) lvTileDraw(g, W, H, Math.round(tx * TS - off), ty * TS, TS, kind);
    }
  }
  /* --- flag --- */
  var flagX = Math.round(146 * TS - off + TS / 2);
  if(flagX > -8 && flagX < W + 8){
    rect(g, W, H, flagX, TS, 1, gy - TS, "#0c930c");
    circle(g, W, H, flagX, TS - 1, 1, "#f8b800");
    for(var fr = 0; fr < 4; fr++) rect(g, W, H, flagX - 1 - (3 - fr), TS + 1 + fr, 1, 1, "#00a800");
    rect(g, W, H, flagX - 2, TS + 4, 3, 1, "#00a800");
  }
  /* --- shell and walker --- */
  var shellSX = Math.round(s.shellWX - off);
  if(shellSX > -10 && shellSX < W + 4) stamp(g, W, H, SHELL_SM, SHELL_PAL, shellSX, gy - 5);
  var wyC = Math.round(s.wy * TS);
  var frame = (Math.floor(t * 8) % 2 === 0) ? RUNNER_A : RUNNER_B;
  stamp(g, W, H, frame, WALK_PAL, Math.round(W * 0.22), gy - 8 + wyC);
}

function drawPix(g, W, H, t){

  ellipse(g, W, H, Math.round(W * 0.80), Math.round(H * 0.26), Math.round(W * 0.055), Math.max(1, Math.round(H * 0.018)), "#453a72");
  ellipse(g, W, H, Math.round(W * 0.13), Math.round(H * 0.30), Math.round(W * 0.045), Math.max(1, Math.round(H * 0.015)), "#4c3a74");

  }
  rect(g, W, H, 0, horizon, W, 1, "#ffd9a0");
  /* island with a palm silhouette, right of centre */
  var ix = Math.round(W * 0.70);
  ellipse(g, W, H, ix, horizon + 1, Math.round(W * 0.085), Math.max(1, Math.round(H * 0.028)), "#0d0f18");
  var tx3 = ix - Math.round(W * 0.01), ty3 = horizon - Math.round(H * 0.15);

  line(g, W, H, bx2, by2, bx2, by2 - Math.round(H * 0.10), "#0d0f18", 0);

var CW = 48, CH = 27, builtCW = 0, builtCH = 0;

  grid.style.gridTemplateColumns = "repeat(" + CW + ", var(--px))";

  if(!sceneState) sceneState = SceneEngine.createState();

  sceneLast = now;

  var g = SceneEngine.frame(sceneState, sceneId(), { night: night }, CW, CH, dt);

  if(changed <= 300 && shim.length){

/* Ambience bed: one looping element under everything, never paused
   once on. It starts and stops the way the ambience design specifies:
   a 3 second fade-in and a 2 second fade-out, on the bed's own gain
   node, so the ambience bus keeps carrying the level and duck settings
   untouched and a change of bed crossfades instead of cutting. */
var bedGain = null;
function retireBed(){
  var el = bedEl, g = bedGain;
  bedEl = null; bedGain = null;
  if(!el) return;
  if(g && AC){
    var t = AC.currentTime;
    try{
      g.gain.cancelScheduledValues(t);
      g.gain.setValueAtTime(g.gain.value, t);
      g.gain.linearRampToValueAtTime(0, t + 2); /* 2 s fade-out */
    }catch(e){}
    setTimeout(function(){
      try{ el.pause(); }catch(e){}
      try{ el.remove(); }catch(e){}
      try{ g.disconnect(); }catch(e){}
    }, 2100);
  } else {
    try{ el.pause(); }catch(e){}
    try{ el.remove(); }catch(e){}
  }
}
function setupBed(){
  var bedFile = null;
  BEDS.forEach(function(b){ if(b[0] === board.ambience.bed) bedFile = b[2]; });
  retireBed();
  if(!bedFile) return;
  if(!board.ambience.on || inQuietHours()) { applyLevels(); return; }
  bedEl = new Audio("assets/audio/beds/" + bedFile);
  bedEl.loop = true; bedEl.crossOrigin = "anonymous";
  try{
    var src = AC.createMediaElementSource(bedEl);
    bedGain = AC.createGain();
    bedGain.gain.value = 0;
    bedGain.gain.linearRampToValueAtTime(1, AC.currentTime + 3); /* 3 s fade-in */
    src.connect(bedGain); bedGain.connect(ambBus);
  }catch(e){ bedEl.volume = 0.4; }
  bedEl.play().catch(function(){});
  applyLevels();
}

/* ============ Soundscape events ============ */
/* Sparse airport life over the bed: a suitcase crossing the floor, a
   baggage belt moment, a trolley in the distance. The clips are cut
   from the licensed event and ambience recordings and contain no board
   clatter. Events belong to the ambience: they exist only while it is
   on, they are silenced by quiet hours, they duck under announcements
   (through evtGain, see duck()), and each one fades in and out. The
   Events level is the events bus level, shared with the flap landings. */
var EVENT_FILES = [["event-01.mp3",6],["event-02.mp3",5],["event-03.mp3",8],["event-04.mp3",7],
                   ["event-05.mp3",8],["event-06.mp3",6],["event-07.mp3",7],["event-08.mp3",7]];
var nextEventAt = Date.now() + 25000, lastEvent = -1, evtNow = null;
function playEvent(){
  var i;
  do { i = Math.floor(Math.random() * EVENT_FILES.length); } while(EVENT_FILES.length > 1 && i === lastEvent);
  lastEvent = i;
  var name = EVENT_FILES[i][0], dur = EVENT_FILES[i][1];
  var a = new Audio("assets/audio/events/" + name);
  a.crossOrigin = "anonymous";
  var g = AC.createGain(); g.gain.value = 0;
  try{ var s = AC.createMediaElementSource(a); s.connect(g); }catch(e){ a.volume = 0; }
  g.connect(evtGain);
  var t = AC.currentTime;
  g.gain.linearRampToValueAtTime(1, t + 0.4);                 /* fade in */
  g.gain.setValueAtTime(1, t + Math.max(0.4, dur - 0.6));
  g.gain.linearRampToValueAtTime(0, t + dur);                 /* fade out */
  evtNow = { a: a, g: g };
  function clear(){ if(evtNow && evtNow.a === a) evtNow = null; }
  a.onended = clear; a.onerror = clear;
  a.play().catch(clear);
  nextEventAt = Date.now() + (dur + 25 + Math.random() * 45) * 1000;
}
function stopEvent(fade){
  var cur = evtNow; evtNow = null;
  if(!cur) return;
  if(fade && AC){
    var t = AC.currentTime;
    try{
      cur.g.gain.cancelScheduledValues(t);
      cur.g.gain.setValueAtTime(cur.g.gain.value, t);
      cur.g.gain.linearRampToValueAtTime(0, t + 1.5);         /* 1.5 s fade-out */
    }catch(e){}
    setTimeout(function(){ try{ cur.a.pause(); }catch(e){} }, 1600);
  } else {
    try{ cur.a.pause(); }catch(e){}
  }
  nextEventAt = Date.now() + 20000;
}

/* ============ Signals and announcements ============ */
function tone(freq, t0, dur, gain){
  var o = AC.createOscillator(), g = AC.createGain();
  o.type = "sine"; o.frequency.value = freq;
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(gain, t0 + 0.02);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(paBus); o.start(t0); o.stop(t0 + dur + 0.05);
}
/* Recorded signals: real PA chimes, played as files through the PA bus.
   Durations measured from the prepared files; the promise also resolves
   on the element's own ended event, whichever comes first. */
var SIGNALS_REC = { helsinki: "signal-helsinki-dingdong.mp3", bingbong: "signal-bingbong.mp3" };
var SIGNAL_DUR = { helsinki: 3.86, bingbong: 2.16 };
function playSignal(kind){
  if(!AC || kind === "none") return Promise.resolve();
  if(SIGNALS_REC[kind]){
    return new Promise(function(res){
      var a = new Audio("assets/audio/signals/" + SIGNALS_REC[kind]);
      a.crossOrigin = "anonymous";
      try{ var s = AC.createMediaElementSource(a); s.connect(paBus); }catch(e){ a.volume = 0.9; }
      var done = false;
      function fin(){ if(!done){ done = true; res(); } }
      a.onended = fin; a.onerror = fin;
      setTimeout(fin, (SIGNAL_DUR[kind] + 2) * 1000);
      a.play().catch(fin);
    });
  }
  var t = AC.currentTime + 0.05, dur;
  if(kind === "cdg"){ /* modelled multi-note gesture */
    var notes = [1318.5, 1046.5, 783.99, 1046.5];
    notes.forEach(function(f, i){ tone(f, t + i*0.22, 0.5, 0.22); });
    dur = notes.length * 0.22 + 0.55;
  }else{ /* international double dong: high then low */
    tone(830.61, t, 0.7, 0.25); tone(622.25, t + 0.28, 0.9, 0.25);
    dur = 1.35;
  }
  return new Promise(function(res){ setTimeout(res, dur * 1000); });
}
function paFileFor(scriptId){
  for(var i=0;i<LIVE_PA.length;i++) if(LIVE_PA[i][0] === scriptId) return "assets/audio/pa/" + LIVE_PA[i][2];
  return "assets/audio/pa/" + scriptId + "--" + board.voice + ".mp3";
}
var paPlaying = false;
function playAnnouncement(scriptId){
  if(!AC || paPlaying) return;
  paPlaying = true;
  duck(12000);
  playSignal(board.signal).then(function(){
    var a = new Audio(paFileFor(scriptId));
    a.crossOrigin = "anonymous";
    try{ var s = AC.createMediaElementSource(a); s.connect(paBus); }catch(e){ a.volume = 0.9; }
    a.onended = paDone;
    a.onerror = paDone;
    a.play().catch(paDone);
  });

/* The configured interval is the pause BETWEEN announcements, so the
   next one is scheduled from the moment this one ends. (Scheduling
   from the start instead made the pause shrink by the announcement's
   own length, and vanish entirely whenever a render ran longer than
   the interval.) */
function paDone(){
  if(!paPlaying) return;
  paPlaying = false;
  var ann = board.announcements || {};
  var lo = +ann.minSec || 420, hi = +ann.maxSec || 1200;
  var span = Math.max(0, hi - lo);
  nextPaAt = Date.now() + (lo + Math.random()*span) * 1000;
}
var nextPaAt = Date.now() + 20000, paIdx = 0;
var wasQuiet = inQuietHours();
setInterval(function(){
  /* Quiet hours begin and end on their own clock: when the board
     crosses into them the bed fades out, and when they end the bed
     fades back in, without waiting for a board change or a publish. */
  var qNow = inQuietHours();
  if(AC && qNow !== wasQuiet){
    if(qNow) retireBed();
    else if(board.ambience.on) setupBed();
  }
  wasQuiet = qNow;
  updateSceneSounds(qNow);
  /* Soundscape events follow the ambience: an event caught by the
     ambience switching off or by quiet hours beginning fades out, and
     new events start only while the bed is playing. */
  if(evtNow && (!board.ambience.on || qNow)) stopEvent(true);
  if(AC && !DEMO && board.ambience.on && !qNow
     && board.ambience.levels.events > 0 && !evtNow && Date.now() >= nextEventAt)
    playEvent();
  if(!AC || DEMO) return;
  if(!board.announcements.on || inQuietHours() || paPlaying) return;
  if(Date.now() < nextPaAt) return;
  var rot = board.announcements.rotation && board.announcements.rotation.length
    ? board.announcements.rotation : SCRIPTS.map(function(s){ return s[0]; });
  playAnnouncement(rot[paIdx % rot.length]); paIdx++;
  /* nextPaAt is set by paDone() when this announcement ends */
}, 1000);

/* ============ Quiet hours ============ */
function inQuietHours(){
  var q = board.quietHours; if(!q || !q.on) return false;
  var now = new Date(), mins = now.getHours()*60 + now.getMinutes();
  function parse(s){ var p = String(s||"0:0").split(":"); return (+p[0])*60 + (+p[1]||0); }
  var a = parse(q.start), b = parse(q.end);
  return a <= b ? (mins >= a && mins < b) : (mins >= a || mins < b);
}

/* ============ Cascade rendering ============ */
var STEP_MS = 85;
function renderBoard(cascade){
  var st = boardStyle();

  hidePixCap();
  if(board.type === "colour"){ stopStyled(); showColour(); return; }
  stopColour();
  if(st !== "isle"){ showStyled(st, cascade); return; }
  stopStyled();
  applyHeadings();
  var text = isTextBoard();
  headEl.style.display = text ? "none" : "";
  buildRows();
  rowsBuilt = true;
  var jobs = []; /* {tile, from, to, steps, delay, silent} */
  var count = boardRows(), r;
  if(text){
    var lines = board.lines || [];
    for(r = 0; r < count; r++){
      var ln = lines[r] || { text:"", black:false };
      var full = cleanRaw(ln.text);
      if(!ln.black && full.length > TEXT_COLS)
        console.warn("Flight Board: line " + (r + 1) + " is " + full.length +
                     " tiles wide; truncated to " + TEXT_COLS + " to fit the grid.");
      var targetLine = ln.black ? "" : full;
      targetLine = (targetLine + " ".repeat(TEXT_COLS)).slice(0, TEXT_COLS);
      for(var k = 0; k < TEXT_COLS; k++){
        var tt = tileGrid[r][0][k];
        var fromL = tt.dataset.ch || " ";
        var stepsL = (ringIdx(targetLine[k]) - ringIdx(fromL) + RING.length) % RING.length;
        if(!cascade) stepsL = 0;
        jobs.push({ tile: tt, from: fromL, to: targetLine[k], steps: stepsL,
                    delay: r * 55 + k * 26 + Math.random() * 22, silent: !!ln.black });
      }
    }
  } else {
    var fl = board.flights || [];
    for(r = 0; r < count; r++){
      var f = fl[r] || null;
      var silent = !f || !!f.black; /* blank and black rows make no clack of their own */
      COLS.forEach(function(c, ci){
        var target = (!f || f.black) ? "" : clean(f[c.key], c.width);
        target = (target + " ".repeat(c.width)).slice(0, c.width);
        for(var k2 = 0; k2 < c.width; k2++){
          var tile = tileGrid[r][ci][k2];
          var from = tile.dataset.ch || " ";
          var steps = (ringIdx(target[k2]) - ringIdx(from) + RING.length) % RING.length;
          if(!cascade) steps = 0;
          jobs.push({ tile: tile, from: from, to: target[k2], steps: steps,
                      delay: r * 55 + ci * 130 + k2 * 26 + Math.random() * 22, silent: silent });
        }
      });
    }
  }
  var totalSteps = 0; jobs.forEach(function(j){ totalSteps += j.steps; });
  if(cascade && totalSteps > 40) duck(Math.min(9000, totalSteps * 9));
  var quiet = inQuietHours();
  jobs.forEach(function(j){
    if(j.steps === 0){ j.tile.textContent = j.to; j.tile.dataset.ch = j.to; return; }
    var thinning = Math.min(0.92, 0.25 + totalSteps / 260); /* dense cascades: fewer, softer ticks */
    setTimeout(function(){
      var pos = ringIdx(j.from), remaining = j.steps;
      var iv = setInterval(function(){
        pos = (pos + 1) % RING.length;
        var ch = RING[pos];
        j.tile.textContent = ch;
        j.tile.classList.remove("flip"); void j.tile.offsetWidth; j.tile.classList.add("flip");
        if(!quiet && !j.silent && Math.random() > thinning) playStep();
        if(--remaining <= 0){
          clearInterval(iv);
          j.tile.dataset.ch = j.to;
          j.tile.classList.remove("land"); void j.tile.offsetWidth; j.tile.classList.add("land");
          if(!quiet && !j.silent) playFlap();
        }
      }, STEP_MS);
    }, j.delay);
  });
}

var styledEl = document.getElementById("styled");

var styledState = { style: null, timers: [], ivs: [], gCells: null, gPages: null, gPage: 0, gPageName: "FLIGHTS", pDest: [], pPhase: 0, dDigs: null, dLast: "" };
function stEl(tag, cls, parent, text){
  var d = document.createElement(tag);

}
function stTimeout(fn, ms){ var id = setTimeout(fn, ms); styledState.timers.push(id); return id; }
function stInterval(fn, ms){ var id = setInterval(fn, ms); styledState.ivs.push(id); return id; }

}
function stRows(){
  if(isTextBoard()){
    return (board.lines || []).map(function(l){
      return { time: "", destination: String(l.text || "").toUpperCase(), flight: "", gate: "", remarks: "", black: !!l.black };
    });
  }
  return (board.flights || []).map(function(f){
    return { time: f.time || "", destination: String(f.destination || "").toUpperCase(), flight: f.flight || "", gate: f.gate || "", remarks: String(f.remarks || "").toUpperCase(), black: !!f.black };
  });

var RING_LO = " abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789-·:";
function stFlipTiles(jobs, opts){
  opts = opts || {};

  var quiet = inQuietHours();
  jobs.forEach(function(j){
    if(!j.el) return;
    var from = j.el.dataset.ch || " ";
    var fi = ring.indexOf(from); if(fi < 0) fi = 0;
    var ti = ring.indexOf(j.to); if(ti < 0) ti = 0;
    var steps = (ti - fi + ring.length) % ring.length;
    if(steps === 0){ j.el.textContent = j.to; j.el.dataset.ch = j.to; return; }
    stTimeout(function(){
      var pos = fi, remaining = steps;
      var iv = setInterval(function(){
        pos = (pos + 1) % ring.length;
        j.el.textContent = ring[pos];
        j.el.classList.remove("flip"); void j.el.offsetWidth; j.el.classList.add("flip");
        if(opts.sound && !quiet && Math.random() > 0.4) playStep();
        if(--remaining <= 0){
          clearInterval(iv);
          j.el.textContent = j.to; j.el.dataset.ch = j.to;

/* ---------- Gallery Six ---------- */
var G_CHARSET = " ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789:.-/&'";
var G_COLORS = { R: "#cf3527", O: "#e87e1e", Y: "#eec41c", G: "#2f9e5f", B: "#2f6fd0", V: "#7a4fb3", W: "#f0ead9", K: "#171716" };

function gWrap(text, width){

  var words = text.split(" "), lines = [], cur = "";
  words.forEach(function(w){
    while(w.length > width){ if(cur){ lines.push(cur); cur = ""; } lines.push(w.slice(0, width)); w = w.slice(width); }
    if(!cur) cur = w;
    else if(cur.length + 1 + w.length <= width) cur += " " + w;
    else { lines.push(cur); cur = w; }
  });

}
function gCells(text){
  var out = [];
  for(var i = 0; i < 22; i++) out.push({ t: "ch", v: (text && text[i]) || " " });
  return out;
}
function gCompose(){
  var rows = [];
  var data = stRows();
  data.forEach(function(f){
    if(f.black){ rows.push(""); return; }
    var s = isTextBoard() ? f.destination : [f.time, f.destination, f.flight, f.gate].filter(Boolean).join("  ");
    var wrapped = gWrap(s.toUpperCase(), 22);
    if(!wrapped.length) wrapped = [""];
    /* orphan control: a flight never leaves a stub of three characters
       or fewer alone on its last wrapped row when the row above can
       spare its last word */
    if(wrapped.length > 1 && wrapped[wrapped.length - 1].length <= 3){
      var prevWords = wrapped[wrapped.length - 2].split(" ");
      if(prevWords.length > 1){
        var cand = prevWords[prevWords.length - 1] + " " + wrapped[wrapped.length - 1];
        if(cand.length <= 22){
          wrapped[wrapped.length - 2] = prevWords.slice(0, -1).join(" ");
          wrapped[wrapped.length - 1] = cand;
        }
      }
    }
    wrapped.forEach(function(w){ rows.push(w); });
  });
  var pages = [], i;
  for(i = 0; i < rows.length; i += 5) pages.push(rows.slice(i, i + 5));
  if(!pages.length) pages.push([]);
  var notice = "WELCOME TO THE ISLE", lead = "G";
  if(boardKind() === "weather" && data.length){ notice = data[data.length - 1].destination.slice(0, 22); lead = "O"; }
  if(boardKind() === "art"){ notice = "MADE OF FLAPS"; lead = "R"; }
  var out = pages.map(function(pg){
    var pr = [];
    for(var r = 0; r < 5; r++) pr.push(gCells(pg[r] || ""));
    return { rows: pr, notice: { text: notice, lead: lead } };
  });
  if(boardKind() === "art"){
    var art = [".....RRR.RRR..........", "....RRRRRRRRR.........", "....RRRRRRRRR.........", ".....RRRRRRR..........", "......RRR............."];
    out.push({
      rows: art.map(function(s){ return s.split("").map(function(ch){ return ch === "R" ? { t: "col", v: "R" } : { t: "ch", v: " " }; }); }),

}
function gSetCell(el, tg){

  else { el.textContent = tg.v; el.style.background = ""; el.classList.remove("col"); }

var gLastTick = 0;

  stTimeout(function(){
    var ringArr, pos, steps;
    var isCol = tg.t === "col" && el.dataset.t === "col";
    if(isCol){
      ringArr = G_ORDER; pos = ringArr.indexOf(el.dataset.v);
      steps = (ringArr.indexOf(tg.v) - pos + ringArr.length) % ringArr.length;
      if(steps === 0) steps = ringArr.length;
    } else if(tg.t === "ch" && el.dataset.t === "ch"){
      ringArr = G_CHARSET; pos = ringArr.indexOf(el.dataset.v); if(pos < 0) pos = 0;
      var ti = ringArr.indexOf(tg.v); if(ti < 0) ti = 0;
      steps = (ti - pos + ringArr.length) % ringArr.length;

      } else {

    if(animate && jobs.length) stFlipTiles(jobs, { ring: "0123456789", stepMs: 55, sound: true });
  }
  datorSetTime(cascade);
  stInterval(function(){ datorSetTime(true); }, 1000);
  var foot = stEl("div", "d-foot", root);
  foot.style.height = (H * 0.105) + "px"; foot.style.marginTop = (H * 0.012) + "px"; foot.style.paddingTop = (H * 0.014) + "px";
  var data = stRows().filter(function(f){ return !f.black && (f.time || f.destination); });
  var f1 = data[0], f2 = data[1];
  var left = "", ambFrom = -1, ambTo = -1;
  if(f1 && f1.time){
    left = "NEXT DEPARTURE " + f1.time + " · " + f1.destination + " · ";
    ambFrom = left.length; left += f1.remarks; ambTo = left.length;
  } else if(f1) left = f1.destination;
  else left = (board.name || "THE ISLE").toUpperCase();
  left = cleanRaw(left); ambTo = Math.min(ambTo, left.length);
  var right = (f2 && f2.time) ? cleanRaw("THEN " + f2.time + " · " + f2.destination + " · " + f2.remarks) : "";
  var ttw = H * 0.034, tgap = Math.max(2, ttw * 0.09);
  var count = Math.max(10, Math.floor((W - pad * 2) / (ttw + tgap)));
  var line = left.slice(0, count);
  if(right && line.length + 2 + right.length <= count) line = line + " ".repeat(count - line.length - right.length) + right;
  var trow = stEl("div", "d-tiles", foot);
  var tjobs = [];
  for(var ci = 0; ci < line.length; ci++){
    var ch2 = line[ci];
    var tt = stEl("div", "d-tile" + (ch2 === " " ? " dim" : "") + (ci >= ambFrom && ci < ambTo ? " amb" : ""), trow, cascade ? " " : ch2);
    tt.style.width = ttw + "px"; tt.style.height = (ttw * 1.686) + "px"; tt.style.fontSize = (ttw * 0.62) + "px";
    if(ci) tt.style.marginLeft = tgap + "px";
    tt.dataset.ch = " ";
    if(cascade) tjobs.push({ el: tt, to: ch2, delay: 300 + ci * 18 });
  }
  if(cascade && tjobs.length){ stFlipTiles(tjobs, { stepMs: 60, sound: true }); duck(1200); }
}

var CRANE_SVG = '<svg viewBox="0 0 100 100"><path fill="#f2a900" d="M15 71 Q27 39 55 29 Q41 45 39 61 Q53 51 71 55 Q49 82 27 82 Q17 79 15 71 Z"/><path fill="#f2a900" d="M39 61 Q47 33 71 19 L85 13 L75 27 Q57 39 49 63 Z"/><path fill="#f2a900" d="M85 13 L95 15 L84 21 Z"/><path fill="none" stroke="#f2a900" stroke-width="4" stroke-linecap="round" d="M22 84 Q50 92 78 84"/></svg>';
var REMARK_DE = { "ON TIME": "pünktlich", "BOARDING": "boarding", "FINAL CALL": "letzter aufruf", "GATE OPEN": "gate offen", "LANDED": "gelandet", "EXPECTED": "erwartet", "CANCELLED": "annulliert" };
function remarkDe(r){
  if(!r) return "";
  if(REMARK_DE[r]) return REMARK_DE[r];
  if(r.indexOf("DELAYED") === 0) return "verspätet";

}
function projektStripCells(){

    if(s.indexOf("TIDE") >= 0 && (m = s.match(/(\d+)\s*:?\s?(\d\d)/))) cells[1] = ["tide", "hochwasser " + m[1] + ":" + m[2], "high tide"];
  });

function buildProjekt(W, H, cascade){

  var ck = stEl("div", "j-clock", head);

  var cl = stEl("div", "", ck, "uhr · local time"); cl.style.fontSize = (headH * 0.075) + "px";
  var data = stRows();
  var n = boardRows();

  table.style.padding = "0 " + pad + "px";

    stEl("span", "j-rem" + (strong ? " strong" : ""), row, (f.black || isTextBoard()) ? "" : remarkDe(f.remarks));
    if(cascade){

  projektStripCells().forEach(function(c){

    cell.style.fontSize = (stripH * 0.165) + "px"; cell.style.gap = (stripH * 0.10) + "px";
    var ic = stEl("span", "", cell); ic.innerHTML = PIC[c[0]];
    ic.firstChild.style.width = (stripH * 0.42) + "px"; ic.firstChild.style.height = (stripH * 0.42) + "px";
    var tx = stEl("span", "", cell);
    tx.innerHTML = '<span class="a">' + escHtml(c[1]) + '</span> <span class="b">/ ' + escHtml(c[2]) + '</span>';

/* ---------- Scene sounds: waves under every palm, rain and thunder ----------
   A separate bus on the ambience pattern: its own switch and level in the
   board's sound configuration, off by default, 3 s class fade-in and 2 s
   fade-out, ducked with the bed under announcements and cascades, and
   silenced by quiet hours. Loops are minutes long and seamless. */
var sceneBus = null, sceneTarget = 0, sceneDuckF = 1, sceneEls = [], sceneKey = "";
var PALM_SCENES = ["palm", "palm-night", "palm-sunrise", "palm-sunset", "palm-cloudy", "palm-rain", "palm-storm", "palm-rainbow", "palm-mist"];
function sceneSoundFiles(){
  if(!board.sceneSounds || !board.sceneSounds.on) return null;
  var sc = boardStyle() === "flappix" ? "pix" : (board.scene || "");
  if(board.type !== "colour" && boardStyle() !== "flappix") return null;
  if(PALM_SCENES.indexOf(sc) < 0) return null;
  var files = ["assets/audio/scenes/scene-waves.mp3"];
  if(sc === "palm-rain") files.push("assets/audio/scenes/scene-rain.mp3");
  if(sc === "palm-storm") files.push("assets/audio/scenes/scene-thunder.mp3");
  return files;
}
function updateSceneSounds(qNow){
  if(!AC) return;
  if(!sceneBus){ sceneBus = AC.createGain(); sceneBus.gain.value = 0; sceneBus.connect(AC.destination); }
  var want = qNow ? null : sceneSoundFiles();
  var lvl = board.sceneSounds ? (board.sceneSounds.level || 0) : 0;
  var key = want ? want.join(",") + "|" + lvl : "";
  if(key === sceneKey){
    sceneTarget = want ? lvl * 0.9 : 0;
    sceneBus.gain.setTargetAtTime(sceneTarget * sceneDuckF, AC.currentTime, 0.8);
    return;
  }
  sceneKey = key;
  var old = sceneEls; sceneEls = [];
  old.forEach(function(rec){
    try{
      rec.gain.gain.setTargetAtTime(0, AC.currentTime, 0.6);
      var el = rec.el;
      setTimeout(function(){ try{ el.pause(); }catch(e){} }, 2200);
    }catch(e){}
  });
  if(want){
    want.forEach(function(url){
      var el = new Audio(); el.src = url; el.loop = true; el.preload = "auto";
      var src = AC.createMediaElementSource(el);
      var gn = AC.createGain(); gn.gain.value = 0;
      src.connect(gn); gn.connect(sceneBus);
      el.play().catch(function(){});
      gn.gain.setTargetAtTime(1, AC.currentTime + 0.1, 1.0);
      sceneEls.push({ el: el, gain: gn });
    });
    sceneTarget = lvl * 0.9;
  } else sceneTarget = 0;
  sceneBus.gain.setTargetAtTime(sceneTarget * sceneDuckF, AC.currentTime, 1.0);
}

/* ============ Fit the board to the screen ============ */
/* Board insets: the board box sits INSIDE the viewport on every side, in
   windowed and fullscreen modes alike. 2% of width at left/right and 2.5%
   of height at top/bottom: past the ~1.5%/2% design target, the extra
   ~0.5% is the allowance for TV overscan (many sets crop 1-3% of the
   picture in their default picture mode), so the outermost tiles and the
   header stay on the visible glass even with modest overscan. */
var INSET_X = 0.02, INSET_Y = 0.025;
function boardPads(fs, iw, ih){
  return { x: fs ? iw * 0.006 : iw * 0.012, y: fs ? ih * 0.008 : ih * 0.014 };
}
function fitColour(){
  colourDims();
  var root = document.documentElement;
  var iw = window.innerWidth, ih = window.innerHeight;
  var fs = !!document.fullscreenElement;
  var pad = boardPads(fs, iw, ih);
  root.style.setProperty("--pad-x", pad.x + "px");
  root.style.setProperty("--pad-y", pad.y + "px");
  var boardW = iw * (1 - 2 * INSET_X), boardH = ih * (1 - 2 * INSET_Y);
  var tw = Math.min(84, Math.max(18, iw * 0.0205)); /* :root --tile-w clamp, drives header size */
  var headBlock = 2.52 * tw + 2;
  if(boardStyle() === "flappix") headBlock += tw * 1.15; /* the caption band under the picture */
  var gapTotalW = (CW - 1) * 2, gapTotalH = (CH - 1) * 2;
  var px = Math.floor(Math.min((boardW - 2 * pad.x - gapTotalW) / CW,
                               (boardH - 2 * pad.y - headBlock - gapTotalH) / CH));
  root.style.setProperty("--px", Math.max(4, px) + "px"); /* .px is square: width == height */
}
function fitBoard(){
  var fst = boardStyle();
  if(fst === "flappix" || board.type === "colour"){ fitColour(); return; }
  if(fst !== "isle"){ fitStyled(); return; }
  var root = document.documentElement;
  var fs = !!document.fullscreenElement;
  var iw = window.innerWidth, ih = window.innerHeight;
  var units = 43 + 38 * 0.14 + 4 * 1.15; /* tiles + in-cell gaps + spacers, in tile widths */
  var rows = boardRows();
  var boardW = iw * (1 - 2 * INSET_X);
  var boardH = ih * (1 - 2 * INSET_Y);
  var pad = boardPads(fs, iw, ih);
  root.style.setProperty("--pad-x", pad.x + "px");
  root.style.setProperty("--pad-y", pad.y + "px");
  /* Vertical metrics in tile-width units. The tile aspect is FIXED at
     1.42 (height / width) by the --tile-h calc and never stretched:
     tiles grow only in true proportion. The board renders exactly
     `rows` rows (the chosen board size); leftover height is spread
     into the row pitch so the board fills the frame inside the insets. */
  var HEADER_ETC = isTextBoard() ? 1.85 : 2.52; /* header block (+ column headings for flight boards), in tile widths */
  var PITCH = 1.53;      /* row pitch incl. base row padding, in tile widths */
  var wByWidth = (boardW - 2 * pad.x) / units;
  var wByHeight = (boardH - 2 * pad.y - 2) / (HEADER_ETC + rows * PITCH);
  var w = Math.max(4, Math.min(wByWidth, wByHeight * 0.998));
  root.style.setProperty("--tile-w", w + "px");
  /* Tiles that fit across a text-board line at this tile width. Lines
     longer than this are truncated to the grid, never clipped mid-tile. */
  var colsFit = Math.max(8, Math.floor(((boardW - 2 * pad.x) / w + 0.14) / 1.14));
  if(colsFit !== TEXT_COLS){
    TEXT_COLS = colsFit;
    if(rowsBuilt && isTextBoard()) renderBoard(false);
  }
  var rowsAvail = boardH - 2 * pad.y - 2 - HEADER_ETC * w;
  var leftover = Math.max(0, rowsAvail - rows * PITCH * w);
  var rowPad = w * 0.055 + leftover / (rows * 2);
  root.style.setProperty("--row-pad", rowPad + "px");
}
document.addEventListener("fullscreenchange", function(){
  document.body.classList.toggle("fullscreen", !!document.fullscreenElement);
  fitBoard();
});
fitBoard();
window.addEventListener("resize", fitBoard);

/* ============ Clock, wiring, live updates ============ */
function tickClock(){
  var d = new Date();
  var t = String(d.getHours()).padStart(2,"0") + ":" + String(d.getMinutes()).padStart(2,"0");
  document.getElementById("clock").textContent = t;
  var sc = document.querySelectorAll(".st-clock");
  for(var i = 0; i < sc.length; i++) sc[i].textContent = t;
}
tickClock(); setInterval(tickClock, 1000);
renderBoard(false);
setTimeout(function(){ renderBoard(true); }, 600); /* opening cascade */

document.addEventListener("pointerdown", initAudio);
document.getElementById("btn-full").addEventListener("click", function(ev){
  ev.stopPropagation();
  if(document.fullscreenElement) document.exitFullscreen();
  else document.documentElement.requestFullscreen && document.documentElement.requestFullscreen();
});
document.getElementById("btn-cascade").addEventListener("click", function(ev){
  ev.stopPropagation(); initAudio();
  if(board.type === "colour" || boardStyle() === "flappix"){ sceneState = SceneEngine.createState(); paintScene(); return; }
  if(boardStyle() !== "isle"){ showStyled(boardStyle(), true); return; }
  tileGrid.forEach(function(row){ row.forEach(function(cell){ cell.forEach(function(t){ t.dataset.ch = " "; t.textContent = " "; }); }); });
  renderBoard(true);
});
if(!DEMO){
  window.addEventListener("storage", function(e){
    if(e.key !== "isle-board-config-v1" || !e.newValue) return;
    try{
      config = JSON.parse(e.newValue);
      var nb = config.boards[config.liveBoardId];
      if(!nb) return;
      if(!nb.type) nb.type = "departures";
      if(nb.rows !== 5 && nb.rows !== 14) nb.rows = 14;
      if(nb.type !== "colour" && !nb.kind) nb.kind = nb.shows === "arrivals" ? "arrivals" : "departures";
      if(!nb.flights) nb.flights = [];
      if(!nb.lines) nb.lines = [];
      if(nb.type === "colour" && !nb.scene) nb.scene = "walk";
      if(nb.type === "colour" && !(nb.night >= 1 && nb.night <= 8)) nb.night = 8;
      if(!nb.style) nb.style = "isle";
      if(!nb.sceneSounds) nb.sceneSounds = { on:false, level:0.5 };
      var setChanged = nb.clackSet !== board.clackSet;
      var bedChanged = nb.ambience.bed !== board.ambience.bed || nb.ambience.on !== board.ambience.on;
      board = nb;
      fitBoard();
      if(AC){ applyLevels(); if(setChanged) loadSet(board.clackSet); if(bedChanged) setupBed(); }
      renderBoard(true);
    }catch(err){}
  });
}
