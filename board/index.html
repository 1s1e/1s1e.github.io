<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon.png" />
<link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
<link rel="mask-icon" href="/assets/safari-pinned-tab.svg" color="#1d2a3b" />
<title>The Isle · Flight Board</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{ --panel:#141416; --line:#2a2b30; --ink:#f2ede1; --mut:#9a978c; }
  *{ box-sizing:border-box; }
  body{ margin:0; background:#0a0a0b; color:var(--ink);
        font-family:"Roboto Mono", ui-monospace, monospace; }
  .wrap{ max-width:640px; margin:0 auto; padding:48px 16px 64px; }
  .mark{ display:block; width:min(340px, 78vw); height:auto; margin:8px auto 10px; }
  h1{ font-size:13px; font-weight:500; letter-spacing:.24em; text-transform:uppercase;
      color:var(--mut); text-align:center; margin:0 0 34px; }
  /* The menu. Future size pages join this list as their own rows when
     they exist; nothing else belongs on this page. */
  .menu{ border-top:1px solid var(--line); }
  .menu a{ display:flex; align-items:center; gap:14px; min-height:64px;
           padding:14px 6px; border-bottom:1px solid var(--line);
           color:var(--ink); text-decoration:none; }
  .menu a:hover, .menu a:focus-visible{ background:var(--panel); }
  .menu a:focus-visible{ outline:2px solid var(--ink); outline-offset:-2px; }
  .menu .name{ font-size:16px; font-weight:700; letter-spacing:.14em;
               text-transform:uppercase; white-space:nowrap; }
  .menu .line{ font-size:13px; color:var(--mut); margin-left:auto;
               text-align:right; }
  .menu .arr{ font-size:16px; color:var(--mut); }
  .foot{ margin-top:22px; font-size:12px; color:var(--mut); text-align:center;
         letter-spacing:.08em; }
</style>
</head>
<body>
<div class="wrap">
  <img class="mark" src="/assets/the-isle-vertical-silver-colourtree.png" alt="The Isle" />
  <h1>Flight Board</h1>
  <nav class="menu">
    <a href="/board/live?fs=1" target="_blank" rel="noopener">
      <span class="name">Live board</span>
      <span class="line">The running board</span>
      <span class="arr">&rarr;</span>
    </a>
    <a href="/board/settings">
      <span class="name">Settings</span>
      <span class="line">Boards, sounds, announcements and publishing</span>
      <span class="arr">&rarr;</span>
    </a>
  </nav>
  <div class="foot">THE ISLE &middot; FLIGHT BOARD</div>
</div>
</body>
</html>
