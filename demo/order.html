<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Poster Order</title>
<style>
  :root { color-scheme: dark; }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #1b2a4a;
    color: #C0C0C0;
    font-family: Georgia, 'Times New Roman', serif;
    padding: 28px 18px 40px;
  }
  h1 {
    font-size: 22px;
    font-weight: 500;
    letter-spacing: 0.35em;
    text-align: center;
    text-transform: uppercase;
  }
  p.note {
    text-align: center;
    font-size: 15px;
    margin: 12px auto 26px;
    max-width: 560px;
    line-height: 1.5;
    color: #dfe2e6;
  }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 22px;
    max-width: 1200px;
    margin: 0 auto;
  }
  figure { text-align: center; }
  figure img {
    width: 100%;
    height: auto;
    display: block;
    border: 1px solid #93a7c9;
  }
  figcaption {
    margin-top: 9px;
    font-size: 15px;
    letter-spacing: 0.08em;
  }
  figcaption .pos {
    display: inline-block;
    min-width: 1.7em;
    font-size: 19px;
    color: #ffffff;
  }
</style>
</head>
<body>
  <h1>Poster Order</h1>
  <p class="note">The ten posters in the order they now follow on the splash page. The number is the current position. Reply with the new order by number or by name.</p>
  <div class="grid">
    <figure>
      <img src="assets/poster-set-01.jpg" alt="The Mountain Poster">
      <figcaption><span class="pos">1</span> The Mountain Poster</figcaption>
    </figure>
    <figure>
      <img src="assets/poster-set-04.jpg" alt="The Sunset Poster">
      <figcaption><span class="pos">2</span> The Sunset Poster</figcaption>
    </figure>
    <figure>
      <img src="assets/poster-set-05.jpg" alt="Lahaina">
      <figcaption><span class="pos">3</span> Lahaina</figcaption>
    </figure>
    <figure>
      <img src="assets/poster-set-06.jpg" alt="Kauai Cliffs">
      <figcaption><span class="pos">4</span> Kauai Cliffs</figcaption>
    </figure>
    <figure>
      <img src="assets/poster-set-12.jpg" alt="Kauai Bird">
      <figcaption><span class="pos">5</span> Kauai Bird</figcaption>
    </figure>
    <figure>
      <img src="assets/poster-set-23.jpg" alt="Pristine Beaches">
      <figcaption><span class="pos">6</span> Pristine Beaches</figcaption>
    </figure>
    <figure>
      <img src="assets/poster-set-26.jpg" alt="Lanikai Beach">
      <figcaption><span class="pos">7</span> Lanikai Beach</figcaption>
    </figure>
    <figure>
      <img src="assets/poster-set-28.jpg" alt="Bora Bora">
      <figcaption><span class="pos">8</span> Bora Bora</figcaption>
    </figure>
    <figure>
      <img src="assets/poster-set-35.jpg" alt="Bali Nusa Penida">
      <figcaption><span class="pos">9</span> Bali Nusa Penida</figcaption>
    </figure>
    <figure>
      <img src="assets/poster-set-36.jpg" alt="Zanzibar">
      <figcaption><span class="pos">10</span> Zanzibar</figcaption>
    </figure>
  </div>
</body>
</html>
