<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    
    <title>The Isle Splash Three Grounds</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon.png" />
<link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
<link rel="mask-icon" href="/assets/safari-pinned-tab.svg" color="#1b2a4a" />
    <style>
      :root {
        --page: #e9e7e2;
        --ink: #3c3a36;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #17181b;
          --ink: #b9b6ae;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--page);
        font-family: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
        padding: clamp(20px, 4vw, 48px) clamp(14px, 3vw, 40px) clamp(28px, 5vw, 56px);
      }
      .label {
        text-transform: uppercase;
        letter-spacing: 0.32em;
        color: var(--ink);
        text-align: center;
        margin: 0;
      }
      h1.label {
        font-size: 13px;
        font-weight: 600;
        margin-bottom: clamp(20px, 3.5vw, 40px);
      }
      .panels {
        display: flex;
        gap: clamp(14px, 2.5vw, 32px);
        align-items: flex-start;
        max-width: 1560px;
        margin: 0 auto;
      }
      figure {
        margin: 0;
        flex: 1 1 0;
        min-width: 0;
      }
      figcaption.label {
        font-size: 11px;
        font-weight: 500;
        margin-top: 14px;
      }
      .panel {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: clamp(22px, 3.2vw, 44px) 0 clamp(26px, 3.6vw, 48px);
      }
      .panel--master     { background: #1b2a4a; --frame: #14213c; --matte: #22355c; }
      .panel--nightchart { background: #101c2c; --frame: #0d1622; --matte: #0e1928; }
      .panel--refnavy    { background: #1d2a3b; --frame: #152130; --matte: #22344a; }
      .masthead {
        display: block;
        width: 58%;
        height: auto;
      }
      .silver-line {
        width: 100%;
        height: 2px;
        background: #c0c0c0;
        margin: clamp(18px, 2.6vw, 34px) 0 clamp(20px, 3vw, 38px);
      }
      .frame {
        background: var(--frame);
        padding: clamp(5px, 0.7vw, 9px);
        width: 62%;
      }
      .matte {
        background: var(--matte);
        padding: clamp(10px, 1.4vw, 18px);
      }
      .poster {
        display: block;
        width: 100%;
        height: auto;
      }
      @media (max-width: 720px) {
        .panels { flex-direction: column; }
        figure { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="label">The Splash on Three Grounds</h1>
      <div class="panels">
        <figure>
          <div class="panel panel--master">
            <img class="masthead" src="assets/the-isle-text-silver.svg" alt="The Isle" />
            <div class="silver-line"></div>
            <div class="frame"><div class="matte"><img class="poster" src="assets/poster-set-01.jpg" alt="" /></div></div>
          </div>
          <figcaption class="label">Master · #1B2A4A</figcaption>
        </figure>
        <figure>
          <div class="panel panel--nightchart">
            <img class="masthead" src="assets/the-isle-text-silver.svg" alt="The Isle" />
            <div class="silver-line"></div>
            <div class="frame"><div class="matte"><img class="poster" src="assets/poster-set-01.jpg" alt="" /></div></div>
          </div>
          <figcaption class="label">Night Chart · #101C2C</figcaption>
        </figure>
        <figure>
          <div class="panel panel--refnavy">
            <img class="masthead" src="assets/the-isle-text-silver.svg" alt="The Isle" />
            <div class="silver-line"></div>
            <div class="frame"><div class="matte"><img class="poster" src="assets/poster-set-01.jpg" alt="" /></div></div>
          </div>
          <figcaption class="label">Ref Navy · #1D2A3B</figcaption>
        </figure>
      </div>
    </main>
  </body>
</html>
