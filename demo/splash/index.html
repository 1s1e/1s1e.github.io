<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    
    <title>The Isle Splash Three Grounds</title>
<link rel="icon" href="/favicon.ico" sizes="any" />
<link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon.png" />
<link rel="icon" type="image/png" sizes="48x48" href="/assets/favicon-48.png" />
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png" />
<link rel="apple-touch-icon" sizes="180x180" href="/assets/apple-touch-icon.png" />
<link rel="mask-icon" href="/assets/safari-pinned-tab.svg" color="#1b2a4a" />
    <!-- The three splash pages in the iframes below rotate through all
         ten posters and the silver wordmark; prefetch them here so the
         full set ships with the page. -->
    <link rel="prefetch" as="image" href="assets/the-isle-text-silver.svg" />
    <link rel="prefetch" as="image" href="assets/poster-set-01.jpg" />
    <link rel="prefetch" as="image" href="assets/poster-set-04.jpg" />
    <link rel="prefetch" as="image" href="assets/poster-set-05.jpg" />
    <link rel="prefetch" as="image" href="assets/poster-set-06.jpg" />
    <link rel="prefetch" as="image" href="assets/poster-set-12.jpg" />
    <link rel="prefetch" as="image" href="assets/poster-set-23.jpg" />
    <link rel="prefetch" as="image" href="assets/poster-set-26.jpg" />
    <link rel="prefetch" as="image" href="assets/poster-set-28.jpg" />
    <link rel="prefetch" as="image" href="assets/poster-set-35.jpg" />
    <link rel="prefetch" as="image" href="assets/poster-set-36.jpg" />
    <style>
      :root {
        --page: #e9e7e2;
        --ink: #3c3a36;
        --hairline: rgba(60, 58, 54, 0.28);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --page: #17181b;
          --ink: #b9b6ae;
          --hairline: rgba(185, 182, 174, 0.28);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        background: var(--page);
        font-family: "Source Sans 3", "Helvetica Neue", Arial, sans-serif;
        padding: clamp(20px, 4vw, 48px) clamp(14px, 3vw, 40px) clamp(28px, 5vw, 56px);
      }
      .label {
        text-transform: uppercase;
        letter-spacing: 0.32em;
        color: var(--ink);
        text-align: center;
        margin: 0;
      }
      h1.label {
        font-size: 13px;
        font-weight: 600;
        margin-bottom: clamp(20px, 3.5vw, 40px);
      }
      .panels {
        display: flex;
        gap: clamp(14px, 2.5vw, 32px);
        align-items: flex-start;
        max-width: 1560px;
        margin: 0 auto;
      }
      figure {
        margin: 0;
        flex: 1 1 0;
        min-width: 0;
      }
      /* Portrait stage, close to a tablet screen at about 3:4. The
         iframe fills it, so the real splash page inside lays itself
         out exactly as it does full-screen, at this size. */
      .stage {
        aspect-ratio: 3 / 4;
        width: 100%;
        border: 1px solid var(--hairline);
      }
      .stage iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
      }
      .stage--master iframe { background: #1b2a4a; }
      .stage--night iframe   { background: #101c2c; }
      .stage--ref iframe     { background: #1d2a3b; }
      figcaption.label {
        font-size: 11px;
        font-weight: 500;
        margin-top: 14px;
      }
      .swatch {
        margin-top: 12px;
        padding: 20px;
        display: flex;
        justify-content: center;
      }
      .swatch--master { background: #1b2a4a; }
      .swatch--night  { background: #101c2c; }
      .swatch--ref    { background: #1d2a3b; }
      .favicon {
        display: block;
        width: 112px;
        height: 112px;
        border: 1px solid rgba(192, 192, 192, 0.55);
      }
      @media (max-width: 720px) {
        .panels { flex-direction: column; }
        figure { width: 100%; }
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="label">The Splash on Three Grounds</h1>
      <div class="panels">
        <figure>
          <div class="stage stage--master">
            <iframe src="assets/splash-master.html" title="The Isle splash page on the Master ground"></iframe>
          </div>
          <figcaption class="label">Master · #1B2A4A</figcaption>
          <div class="swatch swatch--master">
            <img class="favicon" src="assets/favicon-master.png" alt="The Isle favicon on the Master ground" width="112" height="112" />
          </div>
        </figure>
        <figure>
          <div class="stage stage--night">
            <iframe src="assets/splash-night.html" title="The Isle splash page on the Night Chart ground"></iframe>
          </div>
          <figcaption class="label">Night Chart · #101C2C</figcaption>
          <div class="swatch swatch--night">
            <img class="favicon" src="assets/favicon-night.png" alt="The Isle favicon on the Night Chart ground" width="112" height="112" />
          </div>
        </figure>
        <figure>
          <div class="stage stage--ref">
            <iframe src="assets/splash-ref.html" title="The Isle splash page on the Ref Navy ground"></iframe>
          </div>
          <figcaption class="label">Ref Navy · #1D2A3B</figcaption>
          <div class="swatch swatch--ref">
            <img class="favicon" src="assets/favicon-ref.png" alt="The Isle favicon on the Ref Navy ground" width="112" height="112" />
          </div>
        </figure>
      </div>
    </main>
  </body>
</html>
