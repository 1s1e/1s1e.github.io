<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light" />
    <meta name="author" content="MDS" />
    <link rel="icon" href="data:," />
    <title>1s1e.com</title>
    <style>
      :root {
        --ground: #ece4d4;
        --ink: #2b211a;
        --mat: #e0d2b8;

        /* The framed poster is the only thing on the page. It is sized
           from the viewport itself: the frame takes the full height or
           width available, whichever runs out first, leaving only a
           small margin of bone ground around it. --frame-pad is the
           sand mat width; it shrinks on small and short screens so the
           poster itself keeps as much of the screen as possible. */
        --page-margin: clamp(8px, 2vmin, 16px);
        --frame-pad: clamp(10px, 3vmin, 28px);
      }

      @media (max-height: 620px) {
        :root {
          --frame-pad: clamp(8px, 2.5vh, 14px);
        }
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--ground);
        color: var(--ink);
        height: 100vh;
        height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      main {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--page-margin);
      }

      /* ---------- Framed poster (Style 2) ---------- */

      .frame {
        background: var(--mat);
        border: 1px solid var(--ink);
        padding: var(--frame-pad);
        /* Width is the smaller of: the viewport width minus margins,
           and the width implied by the viewport height minus margins
           for a 2:3 poster plus its mat and rule. The 2px terms are
           the frame's two 1px rules. */
        width: min(
          calc(100vw - (2 * var(--page-margin))),
          calc((100vh - (2 * var(--page-margin)) - (2 * var(--frame-pad)) - 2px) * 2 / 3 + (2 * var(--frame-pad)) + 2px),
          calc((100dvh - (2 * var(--page-margin)) - (2 * var(--frame-pad)) - 2px) * 2 / 3 + (2 * var(--frame-pad)) + 2px)
        );
        box-shadow:
          0 1px 2px rgba(90, 58, 32, 0.14),
          0 12px 28px rgba(90, 58, 32, 0.20),
          0 32px 64px rgba(90, 58, 32, 0.14);
      }

      .viewport {
        position: relative;
        aspect-ratio: 2 / 3;
        overflow: hidden;
        touch-action: pan-y;
      }

      .viewport img {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 1.2s ease;
      }

      @media (prefers-reduced-motion: reduce) {
        .viewport img { transition: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="frame">
        <div class="viewport" id="viewport">
          <img id="layerA" alt="" width="1200" height="1800" />
          <img id="layerB" alt="" width="1200" height="1800" />
        </div>
      </div>
    </main>

    <script>
      // The single poster list. Rotation and preloading read from this
      // array only; swap a poster by replacing one entry. Titles stay as
      // the images' alt text; nothing is shown on the page.
      var POSTERS = [
        { file: "assets/poster-set-01.jpg", title: "The Mountain Poster" },
        { file: "assets/poster-set-04.jpg", title: "The Sunset Poster" },
        { file: "assets/poster-set-05.jpg", title: "Lahaina" },
        { file: "assets/poster-set-06.jpg", title: "Kauai Cliffs" },
        { file: "assets/poster-set-12.jpg", title: "Kauai Bird" },
        { file: "assets/poster-set-23.jpg", title: "Pristine Beaches" },
        { file: "assets/poster-set-26.jpg", title: "Lanikai Beach" },
        { file: "assets/poster-set-28.jpg", title: "Bora Bora" },
        { file: "assets/poster-set-35.jpg", title: "Bali Nusa Penida" },
        { file: "assets/poster-set-36.jpg", title: "Zanzibar" }
      ];

      var SHOW_MS = 6000;   // time each poster stays up
      var FADE_MS = 1200;   // crossfade length, matched to the CSS transition

      var motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
      var reducedMotion = motionQuery.matches;

      var layers = [document.getElementById("layerA"), document.getElementById("layerB")];

      var current = Math.floor(Math.random() * POSTERS.length); // random start each visit
      var topLayer = 0;              // index into layers of the visible poster
      var playing = !reducedMotion;  // reduced motion: no auto-advance
      var timer = null;
      var fadeTimer = null;
      var zTop = 2;

      function show(i, instant) {
        var incoming = layers[1 - topLayer];
        var outgoing = layers[topLayer];
        incoming.src = POSTERS[i].file;
        incoming.alt = POSTERS[i].title;
        zTop += 1;
        incoming.style.zIndex = zTop;
        outgoing.style.zIndex = zTop - 1;
        incoming.style.opacity = "1";
        clearTimeout(fadeTimer);
        if (instant) {
          outgoing.style.opacity = "0";
        } else {
          var out = outgoing;
          fadeTimer = setTimeout(function () { out.style.opacity = "0"; }, FADE_MS);
        }
        topLayer = 1 - topLayer;
        current = i;
      }

      function schedule() {
        clearTimeout(timer);
        if (playing) {
          timer = setTimeout(function () {
            show((current + 1) % POSTERS.length, reducedMotion);
            schedule();
          }, SHOW_MS);
        }
      }

      function goTo(i) {
        show(((i % POSTERS.length) + POSTERS.length) % POSTERS.length, reducedMotion);
        schedule(); // manual navigation restarts the full 6 seconds
      }

      // No on-screen controls: the arrow keys still move through the set.
      document.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight") { goTo(current + 1); }
        else if (e.key === "ArrowLeft") { goTo(current - 1); }
      });

      // Horizontal swipe on the poster navigates.
      var swipeX = null, swipeY = null;
      var viewport = document.getElementById("viewport");
      viewport.addEventListener("pointerdown", function (e) {
        swipeX = e.clientX;
        swipeY = e.clientY;
      });
      viewport.addEventListener("pointerup", function (e) {
        if (swipeX === null) { return; }
        var dx = e.clientX - swipeX;
        var dy = e.clientY - swipeY;
        swipeX = null;
        if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
          if (dx < 0) { goTo(current + 1); } else { goTo(current - 1); }
        }
      });
      viewport.addEventListener("pointercancel", function () { swipeX = null; });

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) { clearTimeout(timer); }
        else { schedule(); }
      });

      // Preload every poster from the same single list.
      POSTERS.forEach(function (p) {
        var pre = new Image();
        pre.src = p.file;
      });

      // First paint: the random starting poster, shown at once.
      layers[0].src = POSTERS[current].file;
      layers[0].alt = POSTERS[current].title;
      layers[0].style.zIndex = 2;
      layers[0].style.opacity = "1";
      schedule();
    </script>
  </body>
</html>
