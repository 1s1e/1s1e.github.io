<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="author" content="MDS" />
    <link rel="icon" href="data:," />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet" />
    <title>1s1e.com</title>
    <style>
      :root {
        --ground: #1b2a4a;
        --ink: #C0C0C0;
        --mat: #dfe2e6;
        --terra: #93a7c9;
        --frame: #1b2a4a;
        --band: #101a30;
        --band-text: #C0C0C0;
        --shadow: 27, 42, 74;
        --serif: "Cormorant Garamond", "Times New Roman", Georgia, serif;

        /* The page is a column: the masthead at the top, the framed
           poster in the space between, and the footer band across the
           bottom. --masthead-h and --footer-h are the fixed heights of
           those two pieces; the poster's size is worked out from the
           height that remains once both are taken away, so the whole
           composition always fits the screen with no scrolling.
           --frame-pad is the sand mat width; it shrinks on small and
           short screens so the poster itself keeps as much of the
           space as possible. */
        --page-margin: clamp(8px, 2vmin, 16px);
        --frame-pad: clamp(10px, 3vmin, 28px);
        --masthead-h: 112px;
        --footer-h: 62px;
      }

      @media (max-height: 620px) {
        :root {
          --frame-pad: clamp(8px, 2.5vh, 14px);
          --masthead-h: 78px;
          --footer-h: 48px;
        }
      }

      @media (max-width: 480px) {
        :root {
          --masthead-h: 100px;
        }
      }

      @media (max-height: 620px) and (max-width: 480px) {
        :root {
          --masthead-h: 74px;
        }
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        padding: 0;
      }

      body {
        background: var(--ground);
        color: var(--ink);
        height: 100vh;
        height: 100dvh;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        -webkit-font-smoothing: antialiased;
      }

      /* ---------- Masthead ---------- */

      .masthead {
        flex: 0 0 var(--masthead-h);
        height: var(--masthead-h);
        width: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        padding: 14px 16px 10px;
        text-align: center;
      }

      .masthead h1 {
        margin: 0;
        font-family: var(--serif);
        font-weight: 600;
        font-size: clamp(34px, 6vmin, 50px);
        line-height: 1;
        letter-spacing: 0.34em;
        /* Compensate for the trailing letter space so the word
           sits optically centred. */
        padding-left: 0.34em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .masthead .rule {
        width: clamp(120px, 24vw, 200px);
        height: 1px;
        background: var(--terra);
      }

      @media (max-height: 620px) {
        .masthead { gap: 6px; padding: 10px 16px 6px; }
        .masthead h1 { font-size: 28px; }
      }

      /* ---------- Poster stage ---------- */

      main {
        flex: 1 1 auto;
        min-height: 0;
        width: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: var(--page-margin);
        padding-top: 2px;
      }

      /* ---------- Framed poster (Style 2) ---------- */

      .frame {
        background: var(--mat);
        border: 1px solid var(--frame);
        padding: var(--frame-pad);
        /* Width is the smaller of: the viewport width minus margins,
           and the width implied by the height left between the
           masthead and the footer band, minus margins, for a 2:3
           poster plus its mat and rule. The 2px terms are the
           frame's two 1px rules. */
        width: min(
          calc(100vw - (2 * var(--page-margin))),
          calc((100vh - var(--masthead-h) - var(--footer-h) - (2 * var(--page-margin)) - (2 * var(--frame-pad)) - 2px) * 2 / 3 + (2 * var(--frame-pad)) + 2px),
          calc((100dvh - var(--masthead-h) - var(--footer-h) - (2 * var(--page-margin)) - (2 * var(--frame-pad)) - 2px) * 2 / 3 + (2 * var(--frame-pad)) + 2px)
        );
        box-shadow:
          0 1px 2px rgba(var(--shadow), 0.14),
          0 12px 28px rgba(var(--shadow), 0.20),
          0 32px 64px rgba(var(--shadow), 0.14);
      }

      /* ---------- Footer band ---------- */

      .footer-band {
        flex: 0 0 var(--footer-h);
        height: var(--footer-h);
        width: 100%;
        background: var(--band);
        color: var(--band-text);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 16px 16px;
        text-align: center;
      }

      .footer-band span {
        font-family: var(--serif);
        font-weight: 500;
        font-size: clamp(13px, 1.9vmin, 16px);
        line-height: 1;
        letter-spacing: 0.42em;
        /* Compensate for the trailing letter space so the line
           sits optically centred in the band. */
        padding-left: 0.42em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .footer-band .one {
        font-size: 1.68em;
        letter-spacing: 0.25em;
      }

      @media (max-height: 620px) {
        .footer-band { padding: 12px 16px; }
        .footer-band span { font-size: 12px; }
      }

      .viewport {
        position: relative;
        aspect-ratio: 2 / 3;
        overflow: hidden;
        touch-action: pan-y;
      }

      .viewport img {
        position: absolute;
        inset: 0;
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0;
        transition: opacity 1.2s ease;
      }

      @media (prefers-reduced-motion: reduce) {
        .viewport img { transition: none; }
      }
    </style>
  </head>
  <body>
    <header class="masthead">
      <h1>The Isle</h1>
      <div class="rule" aria-hidden="true"></div>
    </header>
    <main>
      <div class="frame">
        <div class="viewport" id="viewport">
          <img id="layerA" alt="" width="1200" height="1800" />
          <img id="layerB" alt="" width="1200" height="1800" />
        </div>
      </div>
    </main>
    <footer class="footer-band">
      <span><span class="one">1</span>S<span class="one">1</span>E.COM</span>
    </footer>

    <script>
      // The single poster list. Rotation and preloading read from this
      // array only; swap a poster by replacing one entry. Titles stay as
      // the images' alt text; nothing is shown on the page.
      var POSTERS = [
        { file: "assets/poster-set-01.jpg", title: "The Mountain Poster" },
        { file: "assets/poster-set-04.jpg", title: "The Sunset Poster" },
        { file: "assets/poster-set-05.jpg", title: "Lahaina" },
        { file: "assets/poster-set-06.jpg", title: "Kauai Cliffs" },
        { file: "assets/poster-set-12.jpg", title: "Kauai Bird" },
        { file: "assets/poster-set-23.jpg", title: "Pristine Beaches" },
        { file: "assets/poster-set-26.jpg", title: "Lanikai Beach" },
        { file: "assets/poster-set-28.jpg", title: "Bora Bora" },
        { file: "assets/poster-set-35.jpg", title: "Bali Nusa Penida" },
        { file: "assets/poster-set-36.jpg", title: "Zanzibar" }
      ];

      var SHOW_MS = 6000;   // time each poster stays up
      var FADE_MS = 1200;   // crossfade length, matched to the CSS transition

      var motionQuery = window.matchMedia("(prefers-reduced-motion: reduce)");
      var reducedMotion = motionQuery.matches;

      var layers = [document.getElementById("layerA"), document.getElementById("layerB")];

      var current = Math.floor(Math.random() * POSTERS.length); // random start each visit
      var topLayer = 0;              // index into layers of the visible poster
      var playing = !reducedMotion;  // reduced motion: no auto-advance
      var timer = null;
      var fadeTimer = null;
      var zTop = 2;

      function show(i, instant) {
        var incoming = layers[1 - topLayer];
        var outgoing = layers[topLayer];
        incoming.src = POSTERS[i].file;
        incoming.alt = POSTERS[i].title;
        zTop += 1;
        incoming.style.zIndex = zTop;
        outgoing.style.zIndex = zTop - 1;
        incoming.style.opacity = "1";
        clearTimeout(fadeTimer);
        if (instant) {
          outgoing.style.opacity = "0";
        } else {
          var out = outgoing;
          fadeTimer = setTimeout(function () { out.style.opacity = "0"; }, FADE_MS);
        }
        topLayer = 1 - topLayer;
        current = i;
      }

      function schedule() {
        clearTimeout(timer);
        if (playing) {
          timer = setTimeout(function () {
            show((current + 1) % POSTERS.length, reducedMotion);
            schedule();
          }, SHOW_MS);
        }
      }

      function goTo(i) {
        show(((i % POSTERS.length) + POSTERS.length) % POSTERS.length, reducedMotion);
        schedule(); // manual navigation restarts the full 6 seconds
      }

      // No on-screen controls: the arrow keys still move through the set.
      document.addEventListener("keydown", function (e) {
        if (e.key === "ArrowRight") { goTo(current + 1); }
        else if (e.key === "ArrowLeft") { goTo(current - 1); }
      });

      // Horizontal swipe on the poster navigates.
      var swipeX = null, swipeY = null;
      var viewport = document.getElementById("viewport");
      viewport.addEventListener("pointerdown", function (e) {
        swipeX = e.clientX;
        swipeY = e.clientY;
      });
      viewport.addEventListener("pointerup", function (e) {
        if (swipeX === null) { return; }
        var dx = e.clientX - swipeX;
        var dy = e.clientY - swipeY;
        swipeX = null;
        if (Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) {
          if (dx < 0) { goTo(current + 1); } else { goTo(current - 1); }
        }
      });
      viewport.addEventListener("pointercancel", function () { swipeX = null; });

      document.addEventListener("visibilitychange", function () {
        if (document.hidden) { clearTimeout(timer); }
        else { schedule(); }
      });

      // Preload every poster from the same single list.
      POSTERS.forEach(function (p) {
        var pre = new Image();
        pre.src = p.file;
      });

      // First paint: the random starting poster, shown at once.
      layers[0].src = POSTERS[current].file;
      layers[0].alt = POSTERS[current].title;
      layers[0].style.zIndex = 2;
      layers[0].style.opacity = "1";
      schedule();
    </script>
  </body>
</html>
