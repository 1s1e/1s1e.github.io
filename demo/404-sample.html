<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <meta name="author" content="MDS" />
    <link rel="icon" type="image/png" sizes="512x512" href="/assets/favicon.png" />
    <link rel="apple-touch-icon" href="/assets/favicon.png" />
    <title>Page Not Found · 1s1e.com</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500&display=swap" rel="stylesheet" />
    <style>
      :root {
        --ground: #1b2a4a;
        --ink: #C0C0C0;
        --mat: #dfe2e6;
        --accent: #93a7c9;
      }

      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { height: 100%; }

      body {
        background: var(--ground);
        color: var(--mat);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }

      main {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 24px;
      }

      /* The same masthead as the home page: the word in Playfair
         Display, flat silver, with the silver line underneath. */
      .masthead {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
      }

      .masthead h1 {
        font-family: "Playfair Display", "Iowan Old Style", Georgia, serif;
        font-weight: 500;
        font-size: clamp(38px, 6.7vmin, 56px);
        line-height: 1;
        letter-spacing: 0.34em;
        padding-left: 0.34em;
        text-transform: uppercase;
        white-space: nowrap;
        color: var(--ink);
      }

      .masthead .tree {
        height: 76px;
        width: auto;
      }

      .masthead .rule {
        width: clamp(140px, 28vw, 240px);
        height: 1px;
        background: var(--ink);
      }

      h2 {
        margin-top: 46px;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 0.42em;
        padding-left: 0.42em;
        text-transform: uppercase;
        color: var(--accent);
      }

      p {
        margin-top: 16px;
        font-size: 15px;
        line-height: 1.7;
        color: var(--mat);
      }

      a.home {
        margin-top: 28px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.32em;
        padding-left: 0.32em;
        text-transform: uppercase;
        color: var(--ink);
        text-decoration: none;
        border-bottom: 1px solid var(--accent);
        padding-bottom: 5px;
      }

      a.home:hover { color: #ffffff; }
    </style>
  </head>
  <body>
    <main>
      <div class="masthead">
        <img class="tree" src="/assets/palm-tree.png" alt="" width="414" height="326" />
        <h1>The Isle</h1>
        <div class="rule" aria-hidden="true"></div>
      </div>
      <h2>Page Not Found</h2>
      <p>This page does not exist, or has been moved.</p>
      <a class="home" href="/">Return to the home page</a>
    </main>
  </body>
</html>
